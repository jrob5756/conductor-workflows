workflows:
  # document-create:
  #   description: "Create a new markdown document grounded in the codebase, with a structure inferred from the stated purpose, reviewed by the document-review sub-workflow for technical accuracy and readability"
  #   path: workflows/document/create.yaml
  document-review:
    description: "Review-only workflow that scores a markdown document on technical accuracy and readability, short-circuiting if the technical score is below the threshold"
    path: workflows/document/review.yaml
  # document-update:
  #   description: "Update an existing markdown document according to a stated purpose, with technical and readability review cycles via the document-review sub-workflow"
  #   path: workflows/document/update.yaml
  # fusion:
  #   description: "Multi-model deliberation modelled on OpenRouter's Fusion Router: a panel of models from different labs answers the question independently in parallel, an analyst compares (never merges) their answers into consensus, contradictions, coverage gaps, unique insights and blind spots, and a synthesiser writes the final answer. Includes a cheap gate so trivial questions skip the panel, and an optional targeted blind-spot round."
  #   path: workflows/fusion/workflow.yaml
  pr-review:
    description: "Reviews a pull request and posts the findings you approve — cuts a throwaway worktree, runs a concept review that gates the expensive work behind a human decision, runs a code review that reports without touching anything, puts every finding to you individually to post as-is, promote or demote, reword or drop, then publishes one COMMENT review with inline comments anchored wherever the diff allows. On a pull request you have already reviewed it checks what became of each point you made instead, and closes on a choice between approving, re-raising what is still open, or a note you write yourself"
    path: workflows/pr-review/workflow.yaml
  sdd-design:
    description: "Solution design document with technical and readability review cycles, a fixer agent applying targeted revisions between rounds, and a human gate when reviews don't converge (no implementation plan)"
    path: workflows/sdd/design.yaml
  sdd-plan:
    description: "Solution design + implementation plan with technical and readability review cycles, a fixer agent applying targeted revisions between rounds, and a human gate when reviews don't converge. Accepts an optional `design` input to skip the design phase and produce only the implementation plan from an existing design document"
    path: workflows/sdd/plan.yaml
  sdd-implement:
    description: "Implement a feature based on an implementation plan document, with epic-level and plan-level review"
    path: workflows/sdd/implement.yaml
  ship:
    description: "Takes an existing GitHub issue to a merged pull request — cuts a worktree, plans with a human question gate, implements unattended, opens a draft PR, reviews it and applies the findings in a separate step, then publishes and merges behind a human gate with full branch and worktree cleanup. Merge conflicts pause for a human, and `autopilot` bypasses every gate"
    path: workflows/ship/workflow.yaml
