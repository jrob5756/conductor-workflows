# Plan Workflow
#
# This workflow creates a comprehensive solution design and implementation plan
# that is closely grounded in the codebase. It combines high-level architectural
# design (decisions, trade-offs, alternatives) with actionable implementation
# planning (epics, tasks, file changes).
#
# When an existing solution design document is provided via the `design`
# input, the workflow skips the design phase and produces ONLY an
# implementation plan grounded in that design (a typical pairing with the
# `sdd-design` workflow, which authors the design document on its own).
#
# The plan is reviewed by the `document-review` sub-workflow, which scores it
# on technical accuracy and readability. If either score is below the
# threshold (90), a cheaper fixer agent applies targeted revisions and sends
# the document back for re-review. When the feedback invalidates the plan
# itself rather than calling for surgical edits, the fixer escalates back to
# the architect, which is the only agent that re-derives design and plan.
#
# Usage:
#   conductor run workflows/sdd/plan.yaml --input purpose="Build a user authentication system with OAuth2"
#
# With explicit output path:
#   conductor run workflows/sdd/plan.yaml --input purpose="..." --input output_path="docs/auth-migration.plan.md"
#
# Plan-only mode (consume an existing design):
#   conductor run workflows/sdd/plan.yaml \
#     --input purpose="..." \
#     --input design="docs/auth-migration.design.md"
#
# With verbose output:
#   conductor -V run workflows/sdd/plan.yaml --input purpose="..."
#
# Flow:
#   architect
#     → ask_questions         (when it has open questions and human input is allowed)
#     → document_review       (otherwise)
#   ask_questions (questions node — the whole set inside one step)
#     → architect             (once the questions have been put to the human)
#     → $end                  (abort)
#   document_review (sub-workflow)
#     → $end                  (when both reviews are approved)
#     → fixer                 (when either review is not approved)
#   fixer
#     → review_escalation     (at the round cap with blocking issues still open)
#     → architect             (when the feedback requires a fundamental rework)
#     → document_review       (otherwise, after targeted revisions)
#   review_escalation (human gate)
#     → document_review       (re-review the latest revisions)
#     → architect             (send back for a full revision)
#     → mark_accepted → $end  (accept the document as-is)
#     → $end                  (stop)
#
# Review approval is gated on BLOCKING defects, not on hitting a score. The
# thresholds are advisory anchors passed to the sub-workflow, and each
# re-review is told which round it is and what was previously raised, so the
# reviewers verify old defects were fixed rather than surfacing a fresh set of
# nitpicks each pass. Without that, an LLM reviewer will always find something
# and the fixer loop runs to the cap on every document.

workflow:
  name: plan
  description: Create a comprehensive solution design with implementation plan grounded in the codebase, reviewed by the document-review sub-workflow for technical accuracy and readability, with a fixer agent applying targeted revisions between review rounds. Puts the architect's open questions to a human before review, and accepts an optional `design` input to produce only the implementation plan from an existing design document.
  version: "3.0.0"
  entry_point: architect

  runtime:
    provider: copilot
    mcp_servers:
      web-search:
        command: npx
        args: ["-y", "open-websearch@latest"]
        env:
          MODE: stdio
          DEFAULT_SEARCH_ENGINE: duckduckgo
          ALLOWED_SEARCH_ENGINES: duckduckgo,brave,exa
        tools: ["search"] # others use playwright
      context7:
        command: npx
        args: ["-y", "@upstash/context7-mcp@latest"]
        tools: ["*"]
      ms-learn:
        type: http
        url: https://learn.microsoft.com/api/mcp
        tools: ["*"]

  input:
    purpose:
      type: string
      required: true
      description: A clear description of the feature, change, or initiative to design and plan
    output_path:
      type: string
      required: false
      description: Optional file path for the plan document (e.g. docs/my-feature.plan.md)
    design:
      type: string
      required: false
      description: Optional path to an existing solution design document. When provided, the workflow skips the design phase and produces only an implementation plan grounded in that design.
    max_architect_escalations:
      type: number
      required: false
      default: 2
      description: Max times the fixer may hand a revision back to the architect before it must resolve the review feedback itself
    max_review_rounds:
      type: number
      required: false
      default: 3
      description: Max revision rounds without reviewer sign-off before escalating to a human gate instead of looping indefinitely
    technical_threshold:
      type: number
      required: false
      default: 90
      description: Advisory technical score (0-100) passed to the document-review sub-workflow. Review approval is gated on blocking defects, not this number.
    readability_threshold:
      type: number
      required: false
      default: 90
      description: Advisory readability score (0-100) passed to the document-review sub-workflow. Review approval is gated on blocking defects, not this number.
    allow_human_escalation:
      type: boolean
      required: false
      default: true
      description: Whether the workflow may pause to ask a human questions — the architect surfaces its open questions after drafting, and the document-review technical reviewer may ask about facts it cannot resolve on its own

  context:
    mode: explicit

  limits:
    max_iterations: 120

agents:
  - name: architect
    description: Researches the codebase and broader context, then authors a solution design document with actionable implementation plan
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: max
    input:
      - workflow.input.purpose
      - workflow.input.output_path?
      - workflow.input.design?
      - workflow.input.allow_human_escalation?
      - architect.output?
      - ask_questions.output?
      - document_review.output?
      - fixer.output?
    system_prompt: |
      You are a Principal Software Architect. You analyze requirements deeply, research the
      existing codebase, and produce clear, high-level technical design documents with
      actionable implementation plans.

      Your core capabilities include:
      - Designing scalable, maintainable architectures
      - Analyzing existing codebases to ground designs in reality
      - Identifying architectural patterns, trade-offs, and alternatives
      - Writing precise, fact-based design documents for cross-team alignment
      - Documenting APIs, data flows, and component interactions
      - Identifying risks, dependencies, and open questions
      - Breaking complex designs into discrete, actionable epics
      - Identifying file changes, dependencies, and prerequisites
      - Creating task breakdowns with effort estimates

      Your documents are:
      - High-level but grounded in the actual codebase (not abstract hand-waving)
      - Focused on *what* and *why* for design sections, with concrete *how* in the implementation plan
      - Structured for engineering and architecture audiences
      - Honest about trade-offs, risks, and open questions
      - Actionable — a developer or AI agent should be able to execute the plan
    prompt: |
      {% if workflow.input.design %}
      Create an implementation plan for an existing solution design.
      {% else %}
      Create a solution design and implementation plan based on the following purpose:
      {% endif %}

      **Purpose:** {{ workflow.input.purpose }}

      {% if ask_questions is defined and ask_questions.output.answered_any %}
      ## ANSWERS TO YOUR OPEN QUESTIONS

      A human stakeholder went through your open questions one at a time.
      Here is the transcript:

      {{ ask_questions.output.transcript }}

      **IMPORTANT:** You are revising the existing document at
      `{{ architect.output.file_path }}`. Read it and update it in place — do
      not create a new file or change the file name.

      Apply these answers throughout:

      1. **Replace assumptions with decisions.** Anywhere you hedged, guessed,
         or wrote a placeholder because the answer was unknown, rewrite it as a
         settled decision and propagate the consequences through the affected
         epics, tasks, and file lists.
      2. **Retire the questions that were answered.** Move each answered item
         out of **Open Questions** and record the resolution where it belongs —
         as a decision, constraint, or acceptance criterion. Do not leave an
         answered question sitting in the Open Questions section.
      3. **Keep the ones that were not answered.** A question missing from the
         transcript above was skipped. Leave those under **Open Questions**
         with your working assumption stated explicitly, so a reader knows what
         was assumed rather than confirmed.
      4. **Preserve everything else.** Do not rewrite sections the answers do
         not touch.
      {% elif ask_questions is defined %}
      ## PROCEEDING WITHOUT ANSWERS

      You raised open questions and the human skipped all of them. Make sure
      every assumption behind those questions is written down explicitly in the
      document — under **Open Questions** or alongside the decision it affects —
      so a reader knows what was assumed rather than confirmed. Revise the
      existing document at `{{ architect.output.file_path }}` in place.
      {% endif %}

      {% if document_review is defined and document_review.output and document_review.output.technical_review_score and not document_review.output.technical_review_approved %}
      **Technical Review Feedback (Score: {{ document_review.output.technical_review_score }}/100):**
      {{ document_review.output.technical_review_feedback }}

      **IMPORTANT:** You are revising an existing document. Read the document at
      `{{ architect.output.file_path }}` and update it to address the feedback.
      Preserve content that is satisfactory.
      {% endif %}

      {% if document_review is defined and document_review.output and document_review.output.readability_review_score and not document_review.output.readability_review_approved %}
      **Readability Review Feedback (Score: {{ document_review.output.readability_review_score }}/100):**
      {{ document_review.output.readability_review_feedback }}

      **IMPORTANT:** You are revising an existing document. Read the document at
      `{{ architect.output.file_path }}` and update it to address the feedback.
      Preserve content that is satisfactory.
      {% endif %}

      {% if fixer is defined and fixer.output %}
      **Handed back from the fixer** — targeted edits were not enough to resolve
      the review feedback.

      {% if fixer.output.escalation_reason %}
      **Why this needs you:**
      {{ fixer.output.escalation_reason }}
      {% endif %}

      **Corrections the fixer already applied** — the document on disk is newer
      than your last draft. Read the current file and preserve these:
      {% for item in fixer.output.issues_fixed %}
      - {{ item }}
      {% endfor %}

      **Issues the fixer could not resolve:**
      {% for item in fixer.output.unresolved_issues %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ---

      {% if workflow.input.design %}
      ## Source Design Document

      You are producing the implementation plan for an existing, already-reviewed
      solution design. Read the design at:

      `{{ workflow.input.design }}`

      Treat the design as the authoritative source of truth:

      - Do **not** re-derive design decisions, alternatives, or trade-offs — the
        design has already settled them.
      - Do **not** duplicate design content in your output. Reference the design
        by section/heading when explaining what each task delivers.
      - Do **not** re-litigate the design. If you discover genuine gaps,
        ambiguities, or inconsistencies that block planning, surface them in
        the **Open Questions** section instead of silently choosing.

      You should still browse the codebase as needed to:

      - Confirm concrete file paths, existing patterns, and naming conventions
      - Verify task feasibility against the current code
      - Identify prerequisites and sequencing constraints

      ---

      ## Implementation Plan Document

      Write the document with the following sections:
      {% else %}
      ## Phase 1: Research

      Before drafting, perform thorough research:

      ### Codebase Analysis
      - Explore the relevant portions of the codebase deeply
      - Identify existing components, patterns, abstractions, and conventions
      - Understand the current architecture and how data flows
      - Map out dependencies between components
      - Note any technical debt or constraints that affect the design

      ### External Research
      - Search the web for context on relevant technologies and best practices
      - Research similar designs and architectural patterns
      - Look up documentation for key libraries, frameworks, or protocols involved
      - Identify industry standards or conventions that apply

      ---

      ## Phase 2: Design & Plan Document

      Write the document with the following sections:

      ### Executive Summary
      One paragraph describing the proposal, its motivation, and expected outcome.

      ### Background
      - Current state of the system and relevant architecture
      - Context that motivates this design (why now, what changed)
      - Prior art or related work in the codebase

      ### Problem Statement
      Clearly define the problem(s) this design addresses. Be specific about
      pain points, limitations, or gaps in the current system.

      ### Goals and Non-Goals
      **Goals** — specific, measurable outcomes this design aims to achieve.
      **Non-Goals** — explicit exclusions to keep scope focused.

      ### Requirements
      Define functional and non-functional requirements.

      ### Proposed Design

      Provide the core of the design:
      - **Architecture Overview** — high-level component diagram and how pieces fit together
      - **Key Components** — each major component with its responsibilities and interfaces
      - **Data Flow** — how data moves through the system for key operations
      - **API Contracts** — public interfaces, protocols, or contracts (if applicable)
      - **Design Decisions** — key decisions made and the rationale behind each

      ### Alternatives Considered *(optional)*
      For each significant design decision, describe:
      - What alternatives were evaluated
      - Pros and cons of each
      - Why the chosen approach was selected

      Include this section when the design involves non-obvious choices between
      viable approaches. Skip if the solution is straightforward.

      ### Dependencies
      - External dependencies (libraries, services, infrastructure)
      - Internal dependencies (other components, teams, systems)
      - Sequencing constraints (what must happen before this design can proceed)

      ### Impact Analysis *(optional)*
      - Components and areas of the codebase affected
      - Backward compatibility considerations
      - Performance implications
      - Operational impact (deployment, monitoring, debugging)

      Include this section when the design touches multiple components or has
      compatibility/performance implications. Skip for isolated changes.

      ### Security Considerations *(optional)*
      - Authentication, authorization, and access control implications
      - Data protection and privacy concerns
      - Attack surface changes

      Include this section when the design affects security boundaries, handles
      sensitive data, or changes the attack surface. Skip if not applicable.

      ### Risks and Mitigations *(optional)*
      Table with: Risk, Likelihood (Low/Medium/High), Impact (Low/Medium/High), Mitigation.

      Include this section when the design carries meaningful technical, operational,
      or schedule risks. Skip for low-risk changes.
      {% endif %}

      ### Open Questions
      Items requiring further discussion, investigation, or decision from stakeholders.
      {% if workflow.input.design %}In plan-only mode, surface any gaps,
      ambiguities, or inconsistencies in the source design that prevented
      confident planning.{% endif %}
      {% if workflow.input.allow_human_escalation and ask_questions is not defined %}

      **Each question will be put to a human individually, on its own screen,
      before this plan is reviewed.** Return them in the `open_questions`
      output field as objects — `{"question": "...", "choices": ["...", "..."]}`
      — one self-contained question per entry. The reader sees only that entry,
      so include the context needed to answer it and keep it to something
      answerable in a sentence or two.

      Give `choices` whenever the answer is a decision between options you can
      name: 2-4 candidate answers, each phrased as the decision itself rather
      than as "yes"/"no". Put the option you would take by default first and
      mark it by ending its text with ` (Recommended)`, so the reader can see
      your recommendation without reading your reasoning — at most one choice
      per question carries that suffix, and you leave it off entirely when you
      genuinely have no preference. A human picking a listed option is far
      cheaper than typing prose, and they can still write their own answer
      instead. Omit `choices` only for genuinely open-ended questions where you
      cannot name the alternatives.

      Raise a question when a human's answer would actually change the plan —
      an unstated requirement or constraint, a business or product decision
      that is not yours to make, a choice between viable approaches where the
      trade-off depends on priorities you do not know, or missing context you
      could not recover from the codebase or documentation.

      Do not ask about anything you can determine yourself by reading the code
      or searching documentation — investigate it instead. Do not pad the list;
      if drafting genuinely raised nothing a human needs to settle, return an
      empty `open_questions` list and say so in this section. Be honest either
      way: unasked questions become silent assumptions, and padding the list
      wastes a stakeholder's time.
      {% endif %}

      ### Implementation Phases
      Break down the implementation into logical phases with exit criteria.

      ### Files Affected

      #### New Files
      | File Path | Purpose |
      |-----------|---------|

      #### Modified Files
      | File Path | Changes |
      |-----------|---------|

      #### Deleted Files
      | File Path | Reason |
      |-----------|--------|

      ### Implementation Plan

      For each epic, provide:
      - **Goal**: What this epic achieves
      - **Prerequisites**: Dependencies on other epics
      - **Tasks**: Table with Task ID, Type (IMPL/TEST), Description, Files, and Status (TO DO/IN PROGRESS/DONE)
      - **Acceptance Criteria**: Checkboxes for completion

      Keep epics focused—ideally affecting no more than 7 files and completable within 1-2 weeks.
      Tests should be created alongside implementation tasks.

      ### References
      Links to relevant documentation, prior art, RFCs, or external resources.
      {% if workflow.input.design %} Include a reference to the source design
      document at `{{ workflow.input.design }}`.{% endif %}

      ---

      Be thorough and specific. Ground every claim in evidence from the codebase or research.
      Avoid vague or aspirational language — if something is uncertain, call it out as an open question.

      ---

      ## REVISION NOTES

      {% if document_review is defined and document_review.output %}
      After revising the document, provide a concise summary of what you changed and why
      in your `revision_notes` output. Structure it as a bullet list, e.g.:
      - Corrected gRPC version numbers per technical reviewer feedback
      - Rewrote Executive Summary for clarity per readability feedback
      - Added missing risk mitigation for database migration

      This helps reviewers understand what changed.
      {% else %}
      This is the first draft. Set `revision_notes` to "Initial draft."
      {% endif %}

      ---

      ## SAVING THE DOCUMENT

      After creating the document, save it to a file.

      {% if workflow.input.output_path %}
      Save the document to: `{{ workflow.input.output_path }}`
      {% elif workflow.input.design %}
      Derive the file path from the source design document at
      `{{ workflow.input.design }}`:

      - If the design path ends in `.design.md`, replace that suffix with
        `.plan.md` and save in the same directory. Examples:
        - `docs/auth-migration.design.md` → `docs/auth-migration.plan.md`
        - `jwt-rotation.design.md` → `jwt-rotation.plan.md`
      - Otherwise, save next to the design with the same base name and a
        `.plan.md` suffix. Example:
        - `docs/auth-migration.md` → `docs/auth-migration.plan.md`
      {% else %}
      Choose a file path using the following convention:

      - If the purpose input references a document path, derive the name from that document
        and save it in the same directory. Examples:
        - `upgrade-database-v2.brainstorm.md` → `upgrade-database-v2.plan.md`
        - `add-user-authentication.md` → `add-user-authentication.plan.md`
      - Otherwise:
        - Save the document in the current working directory.
        - Use the naming convention: `[descriptive-slug].plan.md`
        - Examples:
          - `jwt-authentication-migration.plan.md`
          - `event-sourcing-pipeline.plan.md`
      {% endif %}
    output:
      file_path:
        type: string
        description: The path where the plan document was saved
      revision_notes:
        type: string
        description: Summary of changes made in this revision (empty on first draft)
      open_questions:
        type: array
        description: 'Questions a human stakeholder must answer, mirroring the document''s Open Questions section. Each entry is an object: {"question": "...", "choices": ["..."]}, with choices omitted only when the alternatives cannot be named. The default choice comes first and ends with " (Recommended)". Empty when drafting raised nothing that needs a human decision.'
    routes:
      - to: ask_questions
        when: "{{ workflow.input.allow_human_escalation and (output.open_questions | length) > 0 and ask_questions is not defined }}"
      - to: document_review

  - name: ask_questions
    type: questions
    description: Puts every open question to the human inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: architect.output.open_questions
    prompt: |
      The architect raised {{ architect.output.open_questions | length }} open
      question{{ 's' if (architect.output.open_questions | length) != 1 else '' }}
      while drafting `{{ architect.output.file_path }}`.

      Answer what you can — anything left unanswered becomes a silent
      assumption the plan proceeds on. You can go back and revise an earlier
      answer at any point before finishing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: $end
    routes:
      - to: architect

  - name: document_review
    description: Reviews the plan document for technical accuracy and readability via the document-review sub-workflow
    type: workflow
    workflow: ../document/review.yaml
    input:
      - workflow.input.purpose
      - workflow.input.technical_threshold?
      - workflow.input.readability_threshold?
      - workflow.input.allow_human_escalation?
      - architect.output.file_path
      - fixer.output?
      - document_review.output?
    input_mapping:
      document_path: "{{ architect.output.file_path }}"
      purpose: "{{ workflow.input.purpose }}"
      technical_threshold: "{{ workflow.input.technical_threshold | default(90, true) }}"
      readability_threshold: "{{ workflow.input.readability_threshold | default(90, true) }}"
      allow_human_escalation: "{{ workflow.input.allow_human_escalation }}"
      # Round context so a re-review verifies the previously raised defects were
      # fixed instead of re-scoring from scratch and inventing new findings.
      review_round: "{{ (fixer.output.review_round + 1) if fixer is defined else 1 }}"
      prior_blocking_issues: "{{ document_review.output.technical_review_blocking_issues if document_review is defined else [] }}"
    routes:
      - to: $end
        when: "{{ document_review.output.technical_review_approved and document_review.output.readability_review_approved }}"
      - to: fixer

  - name: fixer
    description: Applies targeted revisions to the plan document from review feedback, escalating to the architect when the feedback requires a fundamental rework
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium 
    input:
      - workflow.input.purpose
      - workflow.input.design?
      - workflow.input.max_architect_escalations?
      - workflow.input.max_review_rounds?
      - architect.output.file_path
      - document_review.output
      - fixer.output?
    system_prompt: |
      You are a Senior Technical Editor who revises implementation plans in
      response to review feedback.

      You make surgical edits that resolve reviewer findings without rewriting
      content that already passes. You verify before you write — reading the
      codebase and searching documentation rather than guessing at facts you
      are asked to correct.

      You also know the limits of a targeted edit. When feedback invalidates the
      plan's approach or demands design work that an editing pass cannot
      honestly deliver, you escalate to the architect instead of papering over
      the problem.
    prompt: |
      {% set max_escalations = workflow.input.max_architect_escalations | default(2, true) %}
      The review did not approve the plan document. Revise it.

      **Purpose:** {{ workflow.input.purpose }}

      **Document:** `{{ architect.output.file_path }}`
      {% if workflow.input.design %}
      **Source design:** `{{ workflow.input.design }}` — authoritative and already reviewed.
      {% endif %}

      Read the current document from that path and edit it in place. Do not
      create a new file and do not change the file name.

      ---

      ## REVIEW FEEDBACK

      {% if not document_review.output.technical_review_approved %}
      ### Technical review — {{ document_review.output.technical_review_score }}/100 (NOT APPROVED)

      {{ document_review.output.technical_review_feedback }}

      **Blocking technical issues — these gate approval and must all be resolved:**
      {% for issue in document_review.output.technical_review_blocking_issues %}
      - {{ issue }}
      {% endfor %}

      {% if document_review.output.technical_review_suggestions %}
      **Non-blocking suggestions** — apply only the ones that are quick and
      clearly improve the document. These do NOT gate approval; skipping them
      is fine and they must not be recorded as unresolved issues.
      {% for item in document_review.output.technical_review_suggestions %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      The readability review did not run this round — the review sub-workflow
      short-circuits when the technical review is not approved. Focus this pass
      on technical accuracy and completeness.
      {% else %}
      ### Technical review — {{ document_review.output.technical_review_score }}/100 (APPROVED)

      Technical accuracy passed. Do not regress it while addressing readability.

      ### Readability review — {{ document_review.output.readability_review_score }}/100 (NOT APPROVED)

      {{ document_review.output.readability_review_feedback }}

      **Blocking readability issues — these gate approval and must all be resolved:**
      {% for issue in document_review.output.readability_review_blocking_issues %}
      - {{ issue }}
      {% endfor %}

      {% if document_review.output.readability_review_suggestions %}
      **Non-blocking suggestions** — optional polish. These do NOT gate approval.
      {% for item in document_review.output.readability_review_suggestions %}
      - {{ item }}
      {% endfor %}
      {% endif %}
      {% endif %}

      **Clearing every blocking issue is what ends this loop.** Resolve them
      completely and precisely; do not spend the pass on suggestions at their
      expense.

      ---

      ## ESCALATION CHECK

      Before editing, decide whether this feedback is within reach of targeted
      revisions or belongs to the architect.

      **Escalate (`escalate_to_architect: true`) when:**
      - The reviewer rejects the core approach, architecture, or a key design decision
      - The epic breakdown, sequencing, or phasing is fundamentally wrong and must be re-derived
      - Whole required sections are missing and can only be written from fresh
        codebase or external research
      - The plan's factual grounding is wrong in ways that invalidate the proposed work
      {% if workflow.input.design %}
      - The plan does not actually deliver the source design, and reconciling the
        two means re-deriving the plan from scratch
      {% endif %}

      **Fix it yourself (`escalate_to_architect: false`) when:**
      - Claims, versions, API names, file paths, or links are wrong but the plan holds
      - Tasks, acceptance criteria, or affected-file tables are thin, stale, or
        incomplete and you can correct them by verifying against the codebase
      - Structure, clarity, ordering, formatting, redundancy, or verbosity need work
      - Assumptions or open questions need to be stated explicitly
      - Scope creep or unnecessary complexity the reviewer flagged needs trimming

      {% if fixer is defined and fixer.output %}
      You have escalated to the architect {{ fixer.output.escalation_count }} time(s)
      so far. The limit is {{ max_escalations }}.
      {% if fixer.output.escalation_count >= max_escalations %}

      **You have reached the escalation limit. Do NOT escalate again.** Make the
      strongest targeted improvements you can and record anything still
      outstanding in `unresolved_issues`.
      {% endif %}
      {% endif %}

      ---

      ## ROUND TRACKING

      Set `review_round` to {% if fixer is defined and fixer.output %}the previous round ({{ fixer.output.review_round }}) plus 1{% else %}1 — this is the first failed review round{% endif %}.

      Set `escalation_count` to {% if fixer is defined and fixer.output %}{{ fixer.output.escalation_count }}{% else %}0{% endif %},
      plus 1 if you escalate this round.

      ---

      ## REVISION TASKS

      {% if fixer is defined and fixer.output and fixer.output.escalation_count >= max_escalations %}
      You cannot escalate. Work the list below.
      {% else %}
      **If you are escalating:** do NOT attempt the rework yourself. Apply only
      unambiguous, low-risk corrections (typos, broken links, wrong file paths),
      then write a precise handoff brief in `escalation_reason` covering what is
      fundamentally wrong, which sections are affected, and what the architect
      must re-derive. Stop there.

      **Otherwise:**
      {% endif %}

      1. **Resolve every blocking issue.** Work the blocking list first, then
         the narrative feedback. Anything you cannot resolve goes in
         `unresolved_issues` with the reason — never silently skip it. Only
         blocking issues belong in `unresolved_issues`; skipped suggestions do
         not count as unresolved.
      2. **Verify before you write.** Read the referenced source files and search
         documentation to confirm the facts you are correcting. Every file path,
         task, and prerequisite you touch must hold up against the current code.
      3. **Preserve what passed.** Leave satisfactory content alone. Do not
         rewrite sections the reviewers did not fault, and do not renumber epics
         or tasks unless the feedback demands it.
      4. **Respect the document's contract.**
         {% if workflow.input.design %}This document is an implementation plan for
         the already-approved design at `{{ workflow.input.design }}`. Do not
         re-derive, duplicate, or re-litigate design content. If the feedback
         exposes a genuine gap in the source design, record it under **Open
         Questions** rather than deciding it yourself.
         {% else %}This document carries both the design and the implementation
         plan. Keep epics focused — ideally no more than 7 files each — with
         tests alongside implementation tasks.{% endif %}
      5. **Stay in scope.** Fix what the reviewers raised. Do not add epics,
         tasks, or sections nobody asked for.
    output:
      issues_fixed:
        type: array
        description: Review issues resolved in this pass
      unresolved_issues:
        type: array
        description: Review issues left unresolved, each with the reason why
      fix_notes:
        type: string
        description: Summary of the revisions made in this pass
      escalate_to_architect:
        type: boolean
        description: True when the feedback requires a fundamental rework rather than targeted edits
      escalation_reason:
        type: string
        description: Handoff brief for the architect when escalating; empty string otherwise
      escalation_count:
        type: number
        description: Total escalations to the architect so far, including this round
      review_round:
        type: number
        description: Number of failed review rounds handled so far, including this one. 1 on the first run, previous round + 1 on every later run.
      all_issues_resolved:
        type: boolean
        description: Whether every BLOCKING issue raised by the review was resolved this pass. Skipped non-blocking suggestions do not make this false.
    routes:
      # Only pull in a human when the fixer could not clear the blocking issues,
      # or as a hard backstop if the loop somehow keeps going past the cap.
      - to: review_escalation
        when: "{{ (output.review_round >= (workflow.input.max_review_rounds | default(3, true)) and not output.all_issues_resolved) or output.review_round >= ((workflow.input.max_review_rounds | default(3, true)) + 2) }}"
      - to: architect
        when: "{{ output.escalate_to_architect and output.escalation_count <= (workflow.input.max_architect_escalations | default(2, true)) }}"
      - to: document_review

  - name: review_escalation
    type: human_gate
    description: Escalate when the document hasn't earned reviewer sign-off after several revision rounds
    prompt: |
      The plan document at `{{ architect.output.file_path }}` has been through
      {{ fixer.output.review_round }} revision rounds without reviewer sign-off
      (limit: {{ workflow.input.max_review_rounds | default(3, true) }}).

      **Latest scores (advisory):** technical {{ document_review.output.technical_review_score }}/100{% if document_review.output.technical_review_approved %}, readability {{ document_review.output.readability_review_score }}/100{% else %} (readability did not run — the technical review short-circuited){% endif %}. Approval is gated on blocking defects, not on these numbers.

      **Blocking issues still open:**
      {% if document_review.output.technical_review_approved %}
      {% for item in document_review.output.readability_review_blocking_issues %}
      - {{ item }}
      {% endfor %}
      {% else %}
      {% for item in document_review.output.technical_review_blocking_issues %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      **Fixes applied in the latest round:**
      {% for item in fixer.output.issues_fixed %}
      - {{ item }}
      {% endfor %}

      **Still unresolved:**
      {% for item in fixer.output.unresolved_issues %}
      - {{ item }}
      {% endfor %}

      {% if fixer.output.escalate_to_architect %}
      **The fixer wants the architect to take this back:**
      {{ fixer.output.escalation_reason }}
      {% endif %}

      How would you like to proceed?
    options:
      - label: Re-review the latest revisions (one more round)
        value: continue
        route: document_review
      - label: Send it back to the architect for a full revision
        value: redesign
        route: architect
      - label: Accept the document as-is and finish
        value: accept
        route: mark_accepted
      - label: Stop the workflow here
        value: stop
        route: $end

  - name: mark_accepted
    type: set
    description: Record that a human accepted the document past the revision-round cap without reviewer sign-off
    input:
      - fixer.output
    values:
      human_accepted: "true"
      human_accepted_note: "Accepted by a human after {{ fixer.output.review_round }} revision rounds without reviewer sign-off. Outstanding: {{ fixer.output.unresolved_issues | join('; ') }}"
    routes:
      - to: $end

# `fixer` and `mark_accepted` only run when a review round fails, and
# `document_review` is skipped entirely when a human aborts the
# ask_questions step, so every reference to them is guarded with
# `is defined` to keep the output valid on all paths.
output:
  purpose: "{{ workflow.input.purpose }}"
  plan_file: "{{ architect.output.file_path }}"
  technical_review_score: "{{ document_review.output.technical_review_score if document_review is defined else 0 }}"
  readability_review_score: "{{ document_review.output.readability_review_score if document_review is defined else 0 }}"
  technical_review_feedback: "{{ document_review.output.technical_review_feedback if document_review is defined else '' }}"
  readability_review_feedback: "{{ document_review.output.readability_review_feedback if document_review is defined else '' }}"
  open_questions: "{{ architect.output.open_questions }}"
  open_questions_answered: "{{ ask_questions.output.answered_any if ask_questions is defined else false }}"
  open_questions_answers: "{{ ask_questions.output.answers | tojson if ask_questions is defined else '{}' }}"
  open_questions_transcript: "{{ ask_questions.output.transcript if ask_questions is defined else '' }}"
  revision_rounds: "{{ fixer.output.review_round if fixer is defined else 0 }}"
  unresolved_issues: "{{ fixer.output.unresolved_issues | join('; ') if fixer is defined else '' }}"
  human_accepted: "{{ mark_accepted.output.human_accepted if mark_accepted is defined else 'false' }}"
  human_accepted_note: "{{ mark_accepted.output.human_accepted_note if mark_accepted is defined else '' }}"
  iterations: "{{ context.iteration }}"
