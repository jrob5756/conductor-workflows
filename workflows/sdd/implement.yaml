# Implementation Workflow
#
# This example demonstrates an implementation workflow that mirrors
# the /implement command pattern. It shows:
# - Epic selector agent for identifying the next epic to implement
# - Coder agent for deep research, analysis, and first-pass implementation
# - Epic reviewer agent for per-epic quality assessment
# - Epic fixer agent for narrow, fix-only revision rounds
# - Committer agent for git commits and plan updates
# - Plan reviewer agent for holistic review of all changes
# - Fixer agent for addressing plan-level issues
#
# Architecture Decision:
# - Epic selector enforces one-epic-at-a-time execution
# - The coder implements an epic once; the epic_fixer owns every revision
#   round, so a re-review never re-runs codebase research or re-writes passing
#   tests — the two failure modes that grow a diff and re-trigger scope-creep
#   findings
# - Two-tier review: epic-level (fast) and plan-level (thorough)
#
# Review convergence:
#   Reviewers read the actual working-tree diff, not the implementer's summary
#   of it, and approval is gated on BLOCKING defects rather than on an ideal
#   standard. An LLM reviewer will always find *something* to say, so "no
#   remaining defects" is a reachable bar where "nothing left to improve" is
#   not. Re-reviews verify the previous round's blocking issues were fixed
#   instead of re-scoring from scratch, which is what stops every epic from
#   grinding through the round cap into a human gate.
#
# Human escalation:
#   Either reviewer may put questions to a human whenever its verdict turns on
#   something the code and the plan cannot settle, on any round. The human can
#   skip any question or abort the run from the question gate. This is the only
#   point at which the workflow asks for human input — there is no round-cap
#   gate. An epic that exhausts max_epic_review_rounds is committed as-is with
#   its unresolved issues flagged in the plan, and the final plan_reviewer pass
#   is told to give it extra scrutiny. Disable questions entirely with
#   --input allow_human_escalation=false for a fully unattended run.
#
# Usage:
#   conductor run examples/implement.yaml --input plan="Path to implementation plan document"
#
# With specific epic:
#   conductor run examples/implement.yaml --input plan="..." --input epic="EPIC-001"
#
# Fully unattended (no question gates):
#   conductor run examples/implement.yaml --input plan="..." \
#     --input allow_human_escalation=false
#
# With verbose output:
#   conductor -V run examples/implement.yaml --input plan="..."

workflow:
  name: implement
  description: Implement a feature based on an implementation plan document
  version: "2.0.0"
  entry_point: epic_selector

  runtime:
    provider: copilot
    max_session_seconds: 3600  # 1 hour per agent session
    checkpoint:
      every_agent: true   # checkpoint before each step so an external kill
      keep_last: 5        # (e.g. SIGTERM) is resumable via `conductor resume`
    mcp_servers:
      web-search:
        command: npx
        args: ["-y", "open-websearch@latest"]
        env:
          MODE: stdio
          DEFAULT_SEARCH_ENGINE: duckduckgo
          ALLOWED_SEARCH_ENGINES: duckduckgo,brave,exa
        tools: ["search"] # others use playwright
      context7:
        command: npx
        args: ["-y", "@upstash/context7-mcp@latest"]
        tools: ["*"]
      ms-learn:
        type: http
        url: https://learn.microsoft.com/api/mcp
        tools: ["*"]
        
  input:
    plan:
      type: string
      required: true
      description: A link to an implementation plan (e.g., `.plan.md`) or the plan content itself
    epic:
      type: string
      required: false
      description: A specific epic ID to implement. If not provided, all incomplete epics are in scope
    max_epic_review_rounds:
      type: number
      default: 4
      description: Max epic_fixer<->epic_reviewer rounds for a single epic. At the cap the epic is committed as-is with its unresolved issues flagged in the plan for the final plan_reviewer pass, rather than looping indefinitely.
    allow_human_escalation:
      type: boolean
      required: false
      default: true
      description: Whether a reviewer may pause the workflow to ask a human questions it cannot resolve from the code or the plan. Reviewers may ask on any round; set false for a fully unattended run.

  context:
    mode: accumulate

  limits:
    max_iterations: 100
    # timeout_seconds is unlimited by default

agents:
  - name: epic_selector
    description: Reads the plan and selects exactly one epic to implement next
    model: claude-sonnet-5
    context_tier: default 
    reasoning:
      effort: medium 
    input:
      - workflow.input.plan
      - workflow.input.epic?
      - committer.output?
    system_prompt: |
      You are an Implementation Planner agent. Your ONLY job is to read an implementation
      plan document and identify the SINGLE next epic that needs to be implemented.

      You do NOT implement anything. You do NOT write code. You ONLY:
      1. Read and parse the plan document
      2. Identify epic statuses (DONE, IN PROGRESS, NOT STARTED, TO DO)
      3. Select the first incomplete epic
      4. Extract that epic's details for the implementation agent

      You must be precise about epic identification and status tracking.
    prompt: |
      Read the implementation plan and identify the next epic to implement.

      **Plan:**
      {{ workflow.input.plan }}

      {% if workflow.input.epic %}
      **Requested Epic:** {{ workflow.input.epic }}
      Only select this specific epic. If it is already DONE, report all_complete as true.
      {% endif %}

      {% if committer is defined and committer.output %}
      **Previous Epic Completed:** {{ committer.output.epic_completed }}
      **Committer's Remaining Epics:** {{ committer.output.remaining_epics | json }}
      **Committer's Next Epic Suggestion:** {{ committer.output.next_epic }}
      {% endif %}

      ## YOUR TASKS

      1. **Read the Plan Document**
         - If the plan is a file path, read the file to get the full plan content
         - Parse the entire document to identify ALL epics
         - For each epic, determine its current status:
           - Look at task status fields (DONE, IN PROGRESS, NOT STARTED, TO DO)
           - An epic is DONE only if ALL its tasks are marked DONE
           - An epic is IN PROGRESS if any task is IN PROGRESS
           - Otherwise it is NOT STARTED

      2. **Select the Next Epic**
         - If a specific epic was requested via input, select that epic
         - If the committer suggested a next epic, verify it is indeed incomplete and select it
         - Otherwise, scan epics in order (Epic 1, Epic 2, etc.) and select the FIRST one that is NOT DONE
         - Check prerequisites: verify all prerequisite epics are DONE before selecting
         - If ALL epics are DONE, set `all_complete` to true

         **SOURCE OF TRUTH for epic/task status:** the explicit `Status:` markers
         on each epic and task (DONE / IN PROGRESS / NOT STARTED / TO DO) and any
         "DONE" / checked acceptance-criteria boxes on the epic itself. Treat
         those as authoritative.

         Do NOT downgrade an epic's status based on freeform prose elsewhere in
         the plan — phrases like "deferred", "incomplete acceptance criteria",
         "blocked", or "status note" in another epic's description are author
         commentary, not status. If a prerequisite epic is marked DONE, report
         `prerequisites_met: true` for the epic that depends on it. If the
         author wanted the prerequisite treated as incomplete, they would have
         marked its status accordingly.

         `prerequisites_met` is informational: it is passed downstream as
         context but does NOT gate workflow routing — the workflow proceeds as
         long as a current_epic is selected and not all epics are DONE.

      3. **Extract Epic Details**
         - Copy the FULL epic details including:
           - Epic title and description/goal
           - All tasks with their descriptions and file paths
           - Acceptance criteria
           - Prerequisites
           - Any technical notes relevant to the epic
         - This will be the ONLY information the implementation agent receives about the epic

      4. **Create a Plan Summary**
         - Summarize the overall plan (what is being built)
         - List all epics with their current status

      **CRITICAL:** Do NOT implement anything. Do NOT write or modify any code.
      Your output will be passed to the implementation agent.
    output:
      plan_summary:
        type: string
        description: Summary of the overall implementation plan
      all_epics:
        type: array
        description: List of all epic IDs/names with their current status
      current_epic:
        type: string
        description: The epic ID/name selected for implementation
      epic_details:
        type: string
        description: Full details of the selected epic (tasks, acceptance criteria, files, prerequisites)
      prerequisites_met:
        type: boolean
        description: Informational — whether the selector judged all prerequisite epics DONE based on the plan's explicit status markers. Does not gate routing; passed downstream as context only.
      all_complete:
        type: boolean
        description: True only if ALL epics in the plan are marked DONE
      remaining_count:
        type: number
        description: Number of epics still remaining (not DONE)
    routes:
      - to: plan_reviewer
        when: "{{ output.all_complete }}"
      - to: coder

  - name: coder
    description: Implements code changes for a single epic
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: high
    input:
      - workflow.input.plan
      - epic_selector.output
    system_prompt: |
      You are a Senior Software Engineer agent. Your task is to implement code changes
      for ONE specific epic that has been assigned to you.

      Your core capabilities include:
      - Deep codebase research to understand existing patterns, dependencies, and conventions
      - Identifying all relevant code, modules, and integration points
      - Writing clean, well-documented, production-ready code
      - Anticipating edge cases and handling them properly
      - Creating comprehensive tests
      - Following existing code patterns and conventions precisely

      CRITICAL CONSTRAINT: You must implement ONLY the epic specified below.
      Do NOT implement any other epics, even if you can see them in the plan.
      After completing this ONE epic, stop and report your results.
    prompt: |
      Implement the following epic. Do NOT implement any other epics.

      **Epic to Implement:** {{ epic_selector.output.current_epic }}

      **Epic Details:**
      {{ epic_selector.output.epic_details }}

      **Plan Context (for reference only - do NOT implement other epics):**
      {{ epic_selector.output.plan_summary }}

      **Plan Document:**
      {{ workflow.input.plan }}

      {% if epic_selector.output.prerequisites_met == false %}
      **Selector Flagged Prerequisites As Not Met:**
      The epic selector marked `prerequisites_met = false` for this epic. This
      is informational — the workflow proceeded because the plan's explicit
      status markers say earlier epics are DONE, but the selector saw prose
      elsewhere in the plan suggesting earlier work may be incomplete.

      Before writing code:
      - Sanity-check that this epic's prerequisites really are in place by
        inspecting the codebase and tests.
      - If a real blocker exists, STOP and surface it in `implementation_notes`
        with a concrete list of what is missing; do not work around or paper
        over the blocker.
      - If the plan's "DONE" status is correct and the selector was being
        overly conservative, proceed with the epic.
      {% endif %}

      ## IMPLEMENTATION TASKS

      You are implementing ONLY: **{{ epic_selector.output.current_epic }}**

      1. **Deep Codebase Research**
         - Analyze the codebase to understand existing patterns and conventions
         - Identify all files that will be created, modified, or deleted for THIS epic
         - Review related modules and their interfaces
         - Identify integration points and potential conflicts
         - Document the coding style, naming conventions, and patterns used

      2. **Update Plan Status to IN PROGRESS**
         - Open the plan document and update this epic's status to "IN PROGRESS"
         - Update task statuses within this epic from "TO DO" or "NOT STARTED" to "IN PROGRESS"
         - Save the plan document

      3. **Write Tests First**
         - For each task in THIS epic, write tests that define the expected behavior BEFORE implementing the code
         - Run the tests and confirm they fail (they define what "done" looks like)
         - These tests are your success criteria — implementation is complete when they pass

      4. **Implement the Changes**
         For THIS epic only:
         - Create or modify files as specified in the epic details
         - Follow existing code patterns and conventions exactly
         - Run your tests after each significant change — stop when they pass

         **Surgical changes constraint**: Every changed line MUST trace to a task in THIS epic.
         Do NOT "improve" adjacent code, add type hints to unrelated functions, refactor code
         not specified for change, or add abstractions/configurability not in the plan.
         If you notice unrelated issues, mention them in implementation_notes — do not fix them.

      5. **Verify All Tests Pass**
         - Run the full test suite to confirm no regressions
         - Ensure your new tests all pass
         - Record the exact commands you ran and their outcome in
           `verification_evidence`, and set `tests_pass` honestly. The reviewer
           treats a failing or unrun suite as a blocking defect, so do not
           claim a green run you did not perform.

      6. **Document Your Changes**
         - Add inline comments only where the logic is not self-evident
         - Update any relevant documentation specified in the epic

      **STOP after completing this epic. Do NOT continue to the next epic.**
    output:
      current_epic:
        type: string
        description: The epic that was implemented
      epic_details:
        type: string
        description: Detailed description of the implemented epic
      files_modified:
        type: array
        description: List of files that were created or modified
      changes_made:
        type: array
        description: List of specific changes made during implementation
      tests_added:
        type: array
        description: List of tests that were added or updated
      edge_cases_handled:
        type: array
        description: List of edge cases that were handled
      implementation_notes:
        type: string
        description: Notes about the implementation, decisions made, and any concerns
      tests_pass:
        type: boolean
        description: Whether the full test suite was actually run and passed. Report honestly — false (with the reason in verification_evidence) is a valid answer, a false green is a blocking defect.
      verification_evidence:
        type: array
        description: The exact build, lint and test commands run to verify this epic, each with its outcome (e.g. "pytest -q — 148 passed, 0 failed"). This is the evidence the reviewer checks the work against.
    routes:
      - to: epic_reviewer

  - name: epic_reviewer
    description: Reviews the implementation for a single epic
    model: gpt-5.6-sol
    context_tier: long_context
    reasoning:
      effort: xhigh
    input:
      - workflow.input.plan
      - workflow.input.max_epic_review_rounds
      - workflow.input.allow_human_escalation?
      - coder.output
      - epic_fixer.output?
      - epic_reviewer.output?
      - epic_reviewer_questions.output?
    system_prompt: |
      You are a Code Review agent. You conduct thorough reviews of code changes
      to ensure quality, correctness, and adherence to best practices.

      You are critical but constructive, providing specific, actionable feedback
      that helps improve the code.

      You review to a professional standard, not an ideal one. Your job is to
      decide whether this epic is fit to commit — not whether it is the best
      code that could conceivably be written. An implementation that correctly
      and safely delivers its epic passes, even when you can imagine a version
      you would have liked better.
    prompt: |
      Review the implementation changes for the following epic.

      {% set fixed = epic_fixer is defined and epic_fixer.output and epic_fixer.output.current_epic == coder.output.current_epic %}
      {% set impl = epic_fixer.output if fixed else coder.output %}
      {% set from_fixer = context.history and context.history[-1] == 'epic_fixer' %}
      {% set from_questions = context.history and context.history[-1] == 'epic_reviewer_questions' %}
      **Epic:** {{ coder.output.current_epic }}

      **Your Previous Review (if any, for round-tracking):**
      {% if epic_reviewer is defined and epic_reviewer.output %}
      - Epic reviewed: {{ epic_reviewer.output.epic_reviewed | default('(none)') }}
      - Round: {{ epic_reviewer.output.review_round | default(0) }}
      {% else %}
      (This is the first review in this workflow run — start at round 1.)
      {% endif %}

      If the epic above differs from "Epic reviewed" here, this is a NEW epic:
      set `review_round` to 1.
      {% if from_questions %}
      You are resuming after a human answered your questions — no new code was
      written, so this is **not** a new round. Keep `review_round` at
      {{ epic_reviewer.output.review_round | default(1) }}.
      {% elif from_fixer %}
      The epic_fixer has revised the code since your last review, so this IS a
      new round: set `review_round` to
      {{ (epic_reviewer.output.review_round | default(0)) + 1 }}.
      {% endif %}
      Always set `epic_reviewed` to the current epic identifier so the next
      round can detect epic changes correctly.

      **Epic Details:**
      {{ coder.output.epic_details }}

      {% if fixed %}
      The `epic_fixer` has since revised this epic in response to your last
      review. The report below is the fixer's account of the current state.
      {% endif %}

      **Changes Made:**
      {% for change in impl.changes_made %}
      - {{ change }}
      {% endfor %}

      **Files Modified:**
      {% for file in impl.files_modified %}
      - {{ file }}
      {% endfor %}

      **Tests Added:**
      {% for test in impl.tests_added %}
      - {{ test }}
      {% endfor %}

      **Edge Cases Handled:**
      {% for edge_case in impl.edge_cases_handled %}
      - {{ edge_case }}
      {% endfor %}

      **Verification the implementer reports running:**
      Test suite passed: {{ impl.tests_pass | default('(not reported)') }}
      {% for evidence in impl.verification_evidence | default([]) %}
      - {{ evidence }}
      {% endfor %}

      **Implementation Notes:**
      {{ impl.implementation_notes }}

      ---

      ## READ THE ACTUAL CODE FIRST

      Everything above is the implementer's own account of its work. **It is a
      claim, not evidence.** The epic has not been committed yet, so the changes
      are sitting in the working tree and you can read them directly:

      ```
      git status --short          # every changed and untracked path
      git diff HEAD               # the actual line-level changes
      ```

      Read new (untracked) files directly — they will not appear in the diff.
      Review the diff, not the summary. A finding you cannot point to a
      specific file and line for is not a finding.

      Note that the implementer is *instructed* to update this epic's status
      markers in the plan document (`{{ workflow.input.plan }}`). Those edits
      are in scope by design — never flag them as scope creep.

      {% if from_fixer %}
      ## RE-REVIEW — Round {{ (epic_reviewer.output.review_round | default(0)) + 1 }} of at most {{ workflow.input.max_epic_review_rounds }}

      You already reviewed this epic and the `epic_fixer` has revised it in
      response to your feedback. **You are not reviewing it fresh.**

      {% if epic_fixer.output.fixes_applied %}
      What the fixer reports changing:
      {% for fix in epic_fixer.output.fixes_applied %}
      - {{ fix }}
      {% endfor %}
      {% endif %}

      {% if epic_reviewer.output.blocking_issues %}
      You raised these blocking issues last round:
      {% for issue in epic_reviewer.output.blocking_issues %}
      - {{ issue }}
      {% endfor %}
      {% endif %}

      {% if epic_reviewer.output.suggestions %}
      And these were your NON-blocking suggestions last round. They did not
      block approval then and they cannot block it now, whether or not the
      fixer adopted them:
      {% for suggestion in epic_reviewer.output.suggestions %}
      - {{ suggestion }}
      {% endfor %}
      {% endif %}

      Your job this round is narrow:

      1. **Verify the issues above were actually resolved.** Check each one
         against the current diff. An issue that is genuinely fixed is closed —
         do not re-open it because you would have fixed it differently.
      2. **Only raise a NEW blocking issue if it is a real defect** — something
         broken, unsafe, or missing that would ship a bug. A point you did not
         think to raise last round is not automatically blocking now.
      3. **Do not move the goalposts.** Polish, alternative structures, extra
         test cases you would have liked, naming preferences, and additional
         hardening are `suggestions`, never `blocking_issues`. If last round's
         defects are fixed and no genuine new defect exists, **APPROVE.**

      An epic that keeps failing review over a rotating cast of minor
      observations is a review failure, not an implementation failure.
      {% endif %}

      ## REVIEW TASKS

      1. **Requirements Verification**
         - Verify that all requirements from the epic are met
         - Check that acceptance criteria are satisfied
         - Ensure no requirements were missed

      2. **Scope Containment**
         - Verify every changed line in the diff traces to a specific task in THIS epic
         - Flag any modified files NOT specified in the epic details (excluding
           the plan document's own status updates)
         - Flag any drive-by changes: formatting, style adjustments, comment rewrites, or refactoring outside the epic's scope
         - Flag unnecessary abstractions, configurability, or flexibility not in the plan

      3. **Code Quality**
         - Check for bugs, errors, or logical issues
         - Verify proper error handling
         - Ensure code is clean and well-documented
         - Confirm code follows existing patterns and conventions

      4. **Test Verification**
         - Verify tests exist in the diff for the new functionality
         - Check that tests cover the epic's edge cases and error conditions
         - Confirm the suite actually passes. If the implementer did not report
           a green run, run it yourself before deciding.

      ---

      ## Blocking vs. Advisory

      Sort every finding into exactly one of two buckets. This classification —
      nothing else — determines your decision.

      **`blocking_issues`** — the epic is *wrong or unsafe to commit* until this
      is fixed. A finding is blocking only if you can say yes to one of these:
      - It is a defect: the code is incorrect, crashes, or does the wrong thing
      - A requirement or acceptance criterion of THIS epic is not met
      - Tests for the epic's behavior are absent, or the suite does not pass
      - The change is unsafe: a security hole, data loss, or a silent failure
      - It is real scope creep: changed lines that trace to no task in this epic

      **`suggestions`** — everything else. Refactors you would prefer, extra
      test cases, naming, comments, defensive hardening, structure you would
      have chosen differently. These are recorded and passed to the coder, but
      they **do not** block approval and must never be recycled into
      `blocking_issues` on a later round.

      When you are unsure which bucket a finding belongs in, it is a
      **suggestion**. Reserve `blocking_issues` for things you would insist on
      fixing before letting this land in the repository.

      ## Your Decision

      **`decision` is "APPROVE" when `blocking_issues` is empty, and
      "REQUEST_CHANGES" when it is not. Nothing else.**

      The two must agree: do not request changes while listing no blocking
      issue, and do not approve while listing one. **Routing follows
      `blocking_issues`, not the string** — an empty blocking list commits the
      epic no matter what you put in `decision`, so never park a real defect in
      `suggestions` expecting "REQUEST_CHANGES" to hold it back. Do not
      withhold approval because the implementation could hypothetically be
      better — a defect-free epic with a long `suggestions` list is an APPROVE.

      The `decision` output field MUST be a single plain string — either the
      literal string "APPROVE" or the literal string "REQUEST_CHANGES". Do
      NOT return an object, nested fields, or any other structure for this
      field.

      {% if workflow.input.allow_human_escalation %}
      {% if from_questions %}
      ## Human Escalation Follow-up

      You escalated your unresolved questions to a human.

      {% if epic_reviewer_questions.output.answered_any %}
      Their answers, question by question:

      {{ epic_reviewer_questions.output.transcript }}

      Use these answers to finalize your review now. Any question you asked
      that is missing above was skipped — settle it with your own best
      judgment and say what you assumed.
      {% else %}
      The human chose to skip answering. Finalize your review using your best
      judgment given the available information.
      {% endif %}
      Give your decision for this round now. You may escalate again later if a
      genuinely new ambiguity appears, but do not re-ask something the human
      has already answered or deliberately skipped — a skipped question is an
      answer: it means "use your own judgment."
      {% else %}
      ## Escalating to a Human

      A human is available to answer questions during this review.

      If your verdict turns on something you cannot settle by reading the diff,
      the plan, or the codebase — an unstated requirement, a product decision
      the plan does not record, a deliberate trade-off only the owner can
      confirm, or an ambiguity in the epic's acceptance criteria — **ask rather
      than assume.** Set `needs_human_escalation` to `true` and put the specific
      questions in `escalation_questions`.

      Ask only when the answer would change your decision. Do not ask about
      anything you can verify yourself from the code, and do not ask for an
      opinion on a finding you have already made — that belongs in
      `blocking_issues` or `suggestions`. "Is this good enough?" is not a
      question for a human; it is your job.

      Return each entry as an object — `{"question": "...", "choices": ["...",
      "..."]}` — self-contained, since the reader sees it alone with no other
      context, and answerable in a sentence or two. Give `choices` whenever the
      answer is a decision between readings you can name. Put the reading you
      would assume by default first and mark it by ending its text with
      ` (Recommended)`, so the reader can see your recommendation without
      reading your reasoning — at most one choice per question carries that
      suffix, and you leave it off entirely when you genuinely have no
      preference. A human picking a listed option is far cheaper than typing
      prose, and they can still write their own answer instead. Omit `choices`
      only when you cannot name the alternatives.

      Still give your best-effort decision, feedback, and issue lists alongside
      the questions, in case the human skips answering.
      {% endif %}
      {% endif %}
    output:
      decision:
        type: string
        description: |
          Review decision — a single plain string with one of two exact values:
          "APPROVE" or "REQUEST_CHANGES". Must be "APPROVE" exactly when
          blocking_issues is empty. Do NOT return an object or nested
          fields — just one string.
      feedback:
        type: string
        description: Detailed feedback on the implementation
      blocking_issues:
        type: array
        description: Defects that make the epic wrong or unsafe to commit. Empty means APPROVE. Never includes polish, preference, or optional hardening.
      suggestions:
        type: array
        description: Non-blocking improvements. Passed to the epic_fixer for consideration but never gate approval, and never promoted to blocking on a later round.
      strengths:
        type: array
        description: List of things done well in the implementation
      epic_reviewed:
        type: string
        description: The exact epic identifier under review this round (for round-tracking; copy the "Epic:" value verbatim).
      review_round:
        type: number
        description: This epic's review round number. 1 for a fresh epic; previous round + 1 when re-reviewing the SAME epic after REQUEST_CHANGES; resets to 1 whenever the epic changes.
      needs_human_escalation:
        type: boolean
        description: Whether you need a human to answer something before you can finalize this epic's verdict. False unless a human's answer would actually change your decision.
      escalation_questions:
        type: array
        description: 'Questions for the human, populated only when needs_human_escalation is true. Each entry is an object: {"question": "...", "choices": ["..."]}, with choices omitted only when the alternatives cannot be named. The default choice comes first and ends with " (Recommended)".'
    routes:
      - to: epic_reviewer_questions
        when: "{{ workflow.input.allow_human_escalation and output.needs_human_escalation and (output.escalation_questions | length) > 0 }}"
      - to: committer
        when: "{{ (output.blocking_issues | length) == 0 }}"
      - to: mark_round_cap_reached
        when: "{{ output.review_round >= workflow.input.max_epic_review_rounds }}"
      - to: epic_fixer

  - name: epic_reviewer_questions
    type: questions
    description: Puts the epic reviewer's unresolved questions to the human inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: epic_reviewer.output.escalation_questions
    prompt: |
      ## Epic review — {{ coder.output.current_epic }}

      The epic reviewer flagged
      {{ epic_reviewer.output.escalation_questions | length }}
      question{{ 's' if (epic_reviewer.output.escalation_questions | length) != 1 else '' }}
      it cannot resolve from the code or the plan. Nothing has been committed
      yet.

      **Its current best-effort verdict:** {{ epic_reviewer.output.decision }}

      Answer what you can — anything left unanswered is settled by the
      reviewer's own judgment. You can go back and revise an earlier answer at
      any point before finishing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: $end
    routes:
      - to: epic_reviewer

  - name: epic_fixer
    description: Resolves the epic reviewer's blocking issues with a narrow, fix-only pass instead of re-running the full implementation
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium
    input:
      - workflow.input.plan
      - epic_selector.output
      - coder.output
      - epic_reviewer.output
    system_prompt: |
      You are a Senior Software Engineer agent specializing in resolving code
      review feedback on a single epic.

      You make targeted, minimal fixes. You do not re-implement work that
      already passes, you do not refactor code the reviewer did not flag, and
      you do not improve things nobody asked you to improve. The smallest
      correct change that clears the review is the right change.
    prompt: |
      The epic reviewer found blocking defects in this epic's implementation.
      Fix them.

      **Epic:** {{ coder.output.current_epic }}

      **Epic Details:**
      {{ coder.output.epic_details }}

      **Review round:** {{ epic_reviewer.output.review_round }} of at most
      {{ workflow.input.max_epic_review_rounds }}

      **Reviewer feedback:**
      {{ epic_reviewer.output.feedback }}

      **Blocking issues you must resolve:**
      {% for issue in epic_reviewer.output.blocking_issues %}
      - {{ issue }}
      {% endfor %}

      {% if epic_reviewer.output.suggestions %}
      **Non-blocking suggestions** — these did NOT block approval. Adopt one
      only if it is trivially safe and clearly correct; skipping all of them is
      the right default. Do not let them expand the diff.
      {% for suggestion in epic_reviewer.output.suggestions %}
      - {{ suggestion }}
      {% endfor %}
      {% endif %}

      ## FIX TASKS

      1. **Read the current diff.** The epic is not committed yet, so the work
         is in the working tree:

         ```
         git status --short          # every changed and untracked path
         git diff HEAD               # the actual line-level changes
         ```

         Fix what is actually there, not what the reports above describe.

      2. **Resolve each blocking issue, and only those.** For every issue,
         make the smallest change that resolves it. Do not redo the codebase
         research the coder already did, do not restructure working code, and
         do not rewrite tests that already pass.

      3. **Do not grow the diff.** Every line you add must trace to a blocking
         issue above or to a task in THIS epic. New abstractions, extra
         hardening, adjacent cleanups, and unrequested improvements are what
         get an epic flagged for scope creep — adding more will fail review
         again. If you notice an unrelated problem, record it in
         `implementation_notes` and leave it alone.

      4. **Re-run the full test suite.** Confirm the fixes work and nothing
         regressed. Set `tests_pass` and `verification_evidence` from the
         commands you actually ran this round.

      5. **Report what you did.** In `fixes_applied`, state issue by issue what
         you changed to resolve it. If you believe a flagged issue is not a real
         defect, say so explicitly in `implementation_notes` and explain why,
         rather than silently ignoring it.

      **STOP once the listed issues are resolved. Do NOT implement other epics.**
    output:
      current_epic:
        type: string
        description: The epic that was fixed. Copy the "Epic:" value verbatim so the reviewer can tell this fix pass applies to the epic under review.
      fixes_applied:
        type: array
        description: One entry per blocking issue, stating what changed to resolve it
      files_modified:
        type: array
        description: The full list of files created or modified for this epic, including the coder's original changes
      changes_made:
        type: array
        description: The full list of changes making up this epic after the fixes
      tests_added:
        type: array
        description: The full list of tests added or updated for this epic
      edge_cases_handled:
        type: array
        description: The full list of edge cases handled for this epic
      implementation_notes:
        type: string
        description: Notes on the fixes, any flagged issue you disagree with and why, and any unrelated problems you deliberately left alone
      tests_pass:
        type: boolean
        description: Whether the full test suite was actually run and passed after the fixes. Report honestly — a false green is a blocking defect.
      verification_evidence:
        type: array
        description: The exact build, lint and test commands run this round, each with its outcome
    routes:
      - to: epic_reviewer

  - name: mark_round_cap_reached
    type: set
    description: Record that this epic exhausted its review rounds without sign-off, so the committer flags it and the final plan_reviewer gives it extra scrutiny
    values:
      capped_epic: "{{ coder.output.current_epic }}"
      capped_note: "Accepted after {{ epic_reviewer.output.review_round }} review rounds without reviewer sign-off (cap: {{ workflow.input.max_epic_review_rounds }}). Unresolved: {{ epic_reviewer.output.blocking_issues | join('; ') }}"
    routes:
      - to: committer

  - name: committer
    description: Commits the changes and updates the plan document
    model: claude-sonnet-5
    context_tier: default
    reasoning:
      effort: medium
    input:
      - workflow.input.plan
      - coder.output
      - epic_fixer.output?
      - epic_reviewer.output
    system_prompt: |
      You are a Commit and Documentation agent. Your job is to:
      - Create clear, descriptive git commits for completed work
      - Update plan documents to reflect progress
      - Determine if there are more epics to implement
    prompt: |
      The following epic has been implemented and approved.

      {% set fixed = epic_fixer is defined and epic_fixer.output and epic_fixer.output.current_epic == coder.output.current_epic %}
      {% set impl = epic_fixer.output if fixed else coder.output %}
      **Epic:** {{ coder.output.current_epic }}

      {% if mark_round_cap_reached is defined and mark_round_cap_reached.output.capped_epic == coder.output.current_epic %}
      **IMPORTANT:** This epic exhausted its review rounds without sign-off —
      the epic_reviewer had NOT approved it, and it is being committed anyway
      so the run can make progress. When updating the plan document, add a note
      under this epic's status: "⚠️ {{ mark_round_cap_reached.output.capped_note }}"
      so the final plan_reviewer pass is aware this epic needs extra scrutiny.
      {% endif %}

      **Epic Details:**
      {{ coder.output.epic_details }}

      **Changes Made:**
      {% for change in impl.changes_made %}
      - {{ change }}
      {% endfor %}

      **Files Modified:**
      {% for file in impl.files_modified %}
      - {{ file }}
      {% endfor %}

      **Reviewer Feedback:**
      {{ epic_reviewer.output.feedback }}

      **All Epics:**
      {{ epic_selector.output.all_epics | json }}

      ## COMMIT AND UPDATE TASKS

      1. **Update Plan Document**
         Open the plan document and make the following updates:

         a. **Update Epic Status**
            - Change the epic's status from "IN PROGRESS" to "DONE"

         b. **Update Task Statuses**
            - For each task in the epic, update the status field from "IN PROGRESS" or "TO DO" to "DONE"
            - Example: Change `Status: IN PROGRESS` to `Status: DONE`
            - Example: Change `Status: TO DO` to `Status: DONE`

         c. **Check Acceptance Criteria Checkboxes**
            - For each acceptance criterion that has been satisfied, check the checkbox
            - Change `- [ ]` to `- [x]` for completed criteria
            - Only check boxes for criteria that were actually implemented and verified

         d. **Add Completion Notes**
            - Add completion date if there's a field for it
            - Add any relevant implementation notes

         Save the updated plan document.

      2. **Create Git Commit**
         - Stage all modified files INCLUDING the updated plan document
         - Create a clear commit message starting with the epic ID
         - Example: "EPIC-001: Implement user authentication flow"

      3. **Determine Next Steps**
         - Re-read the plan document after updating it
         - Scan ALL epics in order (EPIC-001, EPIC-002, etc.)
         - Build a list of remaining epics that are NOT marked as "DONE"
         - If there are remaining epics:
           - Set `all_complete` to FALSE
           - Set `next_epic` to the FIRST remaining epic (by ID order)
           - Set `remaining_epics` to the full list of non-DONE epics
         - ONLY set `all_complete` to TRUE if EVERY epic in the plan is marked as "DONE"

      **IMPORTANT:** Do NOT set `all_complete` to true unless you have verified that
      ALL epics in the entire plan document are marked as DONE. When in doubt, 
      set `all_complete` to false and specify the next epic to implement.

      Commit the changes and update the plan.
    output:
      epic_completed:
        type: string
        description: The epic that was completed
      commit_message:
        type: string
        description: The git commit message used
      plan_updated:
        type: boolean
        description: Whether the plan document was updated
      remaining_epics:
        type: array
        description: List of ALL remaining epics (not marked DONE) in the plan, in order
      all_complete:
        type: boolean
        description: TRUE only if EVERY epic in the plan is marked DONE. FALSE if any epic remains.
      next_epic:
        type: string
        description: The FIRST remaining epic to implement (by ID order). Empty only if all_complete is true.
    routes:
      - to: epic_selector
        when: "{{ not output.all_complete }}"
      - to: plan_reviewer
        when: "{{ output.all_complete }}"

  - name: plan_reviewer
    description: Reviews the entire implementation plan and all commits holistically
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: max
    input:
      - workflow.input.plan
      - workflow.input.allow_human_escalation?
      - epic_selector.output
      - coder.output
      - committer.output
      - fixer.output?
      - plan_reviewer_questions.output?
    system_prompt: |
      You are a Senior Architecture Reviewer. Your job is to perform a holistic review
      of the entire implementation after all epics have been completed.

      You review:
      - Overall architecture and design coherence
      - Cross-cutting concerns (error handling, logging, security)
      - Code consistency across all changes
      - Integration between components
      - Documentation completeness
      - Test coverage across the entire feature

      You are thorough and ensure the implementation is production-ready.
    prompt: |
      All epics have been implemented. Perform a holistic review of the entire implementation.

      **Original Plan:**
      {{ workflow.input.plan }}

      **Plan Summary:**
      {{ epic_selector.output.plan_summary }}

      {% if committer is defined and committer.output %}
      **Epics Completed:**
      {{ committer.output.epic_completed }}

      **Final Commit:**
      {{ committer.output.commit_message }}
      {% else %}
      **Note:** All epics were already marked DONE in the plan. No implementation was performed.
      {% endif %}

      ## HOLISTIC REVIEW TASKS

      1. **Architecture Review**
         - Review the overall architecture of the changes
         - Ensure components integrate well together
         - Check for proper separation of concerns
         - Verify the design is maintainable and extensible

      2. **Scope Containment (Minimal Diff)**
         - Review all changed files across ALL commits against the plan's Files Affected section
         - Flag any files modified that are NOT in the plan
         - Flag any changes that do not trace to a specific requirement or EPIC task
         - Flag unnecessary abstractions, patterns, or configurability not in the plan
         - Ask: "Is there anything in this diff that wasn't asked for?" If yes, flag it.

      3. **Cross-Cutting Concerns**
         - Review error handling across all components
         - Check logging and observability
         - Verify security considerations
         - Ensure proper resource management

      4. **Code Consistency**
         - Check for consistent patterns across all changes
         - Verify naming conventions are consistent
         - Ensure code style is uniform

      5. **Documentation Review**
         - Verify documentation is complete and accurate
         - Check that README or other docs are updated
         - Ensure code comments are helpful

      6. **Test Coverage**
         - Review overall test coverage
         - Identify any gaps in testing
         - Verify integration tests exist where needed

      7. **Git History Review**
         - Review all commits made during implementation
         - Ensure commit messages are clear and descriptive
         - Check for any commits that should be squashed or amended

      ---

      ## Blocking vs. Advisory

      Sort every finding into exactly one of two buckets. This classification —
      nothing else — determines your decision.

      A finding is **blocking** only if the implementation is *wrong or unsafe
      to ship* until it is fixed:
      - A defect: the code is incorrect, crashes, or does the wrong thing
      - A requirement of the plan is not delivered
      - Components do not actually integrate, or the suite does not pass
      - The change is unsafe: a security hole, data loss, or a silent failure
      - Real scope creep: shipped changes that trace to no task in the plan

      Everything else is a **suggestion**: refactors you would prefer, extra
      test cases, naming, comments, defensive hardening, structure you would
      have chosen differently. Record them in `suggestions` — they do not block
      approval and must never be recycled into a blocking list on a later round.

      When you are unsure which bucket a finding belongs in, it is a
      **suggestion**. The per-epic reviewer has already approved every epic;
      your job is to catch what only a whole-implementation view can reveal,
      not to re-litigate work that already passed.

      {% if fixer is defined and fixer.output %}
      ## RE-REVIEW

      You already reviewed this implementation and the fixer has revised it in
      response to your feedback. **You are not reviewing it fresh.**

      You raised these issues last round:
      {% for issue in plan_reviewer.output.architecture_issues %}
      - (architecture) {{ issue }}
      {% endfor %}
      {% for issue in plan_reviewer.output.code_issues %}
      - (code) {{ issue }}
      {% endfor %}
      {% for issue in plan_reviewer.output.documentation_issues %}
      - (documentation) {{ issue }}
      {% endfor %}
      {% for gap in plan_reviewer.output.test_gaps %}
      - (test gap) {{ gap }}
      {% endfor %}

      {% if plan_reviewer.output.suggestions %}
      And these were your NON-blocking suggestions. They did not block approval
      then and they cannot block it now, whether or not the fixer adopted them:
      {% for suggestion in plan_reviewer.output.suggestions %}
      - {{ suggestion }}
      {% endfor %}
      {% endif %}

      What the fixer reports doing:
      {{ fixer.output.fix_notes }}
      {% if fixer.output.all_issues_resolved == false %}
      The fixer reports it did NOT resolve everything.
      {% endif %}

      Verify the issues above were actually resolved. An issue that is
      genuinely fixed is closed — do not re-open it because you would have
      fixed it differently. Only raise a NEW blocking issue if it is a real
      defect; a point you did not think to raise last round is not
      automatically blocking now. Polish and preference stay in `suggestions`.

      If last round's issues are fixed and no genuine new defect exists,
      **APPROVE.** An implementation that keeps failing review over a rotating
      cast of minor observations is a review failure, not an implementation
      failure.
      {% endif %}

      ## Your Decision

      **`decision` is "APPROVE" when you have no blocking findings, and
      "REQUEST_CHANGES" when you do. Nothing else.** **Routing follows the
      issue arrays, not the string** — leaving
      `architecture_issues`, `code_issues`, `documentation_issues` and
      `test_gaps` all empty ends the workflow no matter what you put in
      `decision`, so never park a real defect in `suggestions` expecting
      "REQUEST_CHANGES" to hold it back. Do not withhold approval because the
      implementation could hypothetically be better — a defect-free
      implementation with a long `suggestions` list is an APPROVE.

      The `decision` output field MUST be a single plain string — either the
      literal string "APPROVE" or the literal string "REQUEST_CHANGES". Do
      NOT return an object, nested fields, or any other structure for this
      field.

      If REQUEST_CHANGES, provide specific issues that need to be fixed.

      {% if workflow.input.allow_human_escalation %}
      {% if context.history and context.history[-1] == 'plan_reviewer_questions' %}
      ## Human Escalation Follow-up

      You escalated your unresolved questions to a human.

      {% if plan_reviewer_questions.output.answered_any %}
      Their answers, question by question:

      {{ plan_reviewer_questions.output.transcript }}

      Use these answers to finalize your review now. Any question you asked
      that is missing above was skipped — settle it with your own best
      judgment and say what you assumed.
      {% else %}
      The human chose to skip answering. Finalize your review using your best
      judgment given the available information.
      {% endif %}
      Give your decision for this round now. You may escalate again later if a
      genuinely new ambiguity appears, but do not re-ask something the human
      has already answered or deliberately skipped — a skipped question is an
      answer: it means "use your own judgment."
      {% else %}
      ## Escalating to a Human

      A human is available to answer questions during this review.

      If your verdict turns on something you cannot settle by reading the code,
      the commits, or the plan — an unstated requirement, a product decision the
      plan does not record, a deliberate trade-off only the owner can confirm —
      **ask rather than assume.** Set `needs_human_escalation` to `true` and put
      the specific questions in `escalation_questions`.

      Ask only when the answer would change your decision. Do not ask about
      anything you can verify yourself, and do not ask for an opinion on a
      finding you have already made.

      Return each entry as an object — `{"question": "...", "choices": ["...",
      "..."]}` — self-contained, since the reader sees it alone with no other
      context, and answerable in a sentence or two. Give `choices` whenever the
      answer is a decision between readings you can name. Put the reading you
      would assume by default first and mark it by ending its text with
      ` (Recommended)`, so the reader can see your recommendation without
      reading your reasoning — at most one choice per question carries that
      suffix, and you leave it off entirely when you genuinely have no
      preference. A human picking a listed option is far cheaper than typing
      prose, and they can still write their own answer instead. Omit `choices`
      only when you cannot name the alternatives.

      Still give your best-effort decision, feedback, and issue lists alongside
      the questions, in case the human skips answering.
      {% endif %}
      {% endif %}
    output:
      decision:
        type: string
        description: |
          Review decision — a single plain string with one of two exact values:
          "APPROVE" or "REQUEST_CHANGES". Must be "APPROVE" exactly when you
          have no blocking findings. Do NOT return an object or nested
          fields — just one string.
      feedback:
        type: string
        description: Detailed holistic feedback on the implementation
      architecture_issues:
        type: array
        description: Blocking architecture or design defects. Preferences and alternative structures belong in suggestions.
      code_issues:
        type: array
        description: Blocking code quality or consistency defects. Polish belongs in suggestions.
      documentation_issues:
        type: array
        description: Blocking documentation defects — missing or incorrect docs, not docs you would have written differently.
      test_gaps:
        type: array
        description: Blocking test coverage gaps — untested behavior the plan requires, not extra cases you would have liked.
      suggestions:
        type: array
        description: Non-blocking improvements across the implementation. Recorded for the author but never gate approval, and never promoted to blocking on a later round.
      strengths:
        type: array
        description: List of things done well across the implementation
      needs_human_escalation:
        type: boolean
        description: Whether you need a human to answer something before you can finalize your verdict. False unless a human's answer would actually change your decision.
      escalation_questions:
        type: array
        description: 'Questions for the human, populated only when needs_human_escalation is true. Each entry is an object: {"question": "...", "choices": ["..."]}, with choices omitted only when the alternatives cannot be named. The default choice comes first and ends with " (Recommended)".'
    routes:
      - to: plan_reviewer_questions
        when: "{{ workflow.input.allow_human_escalation and output.needs_human_escalation and (output.escalation_questions | length) > 0 }}"
      - to: $end
        when: "{{ (output.architecture_issues | length) + (output.code_issues | length) + (output.documentation_issues | length) + (output.test_gaps | length) == 0 }}"
      - to: fixer

  - name: plan_reviewer_questions
    type: questions
    description: Puts the plan reviewer's unresolved questions to the human inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: plan_reviewer.output.escalation_questions
    prompt: |
      ## Final implementation review

      The plan reviewer flagged
      {{ plan_reviewer.output.escalation_questions | length }}
      question{{ 's' if (plan_reviewer.output.escalation_questions | length) != 1 else '' }}
      it cannot resolve from the code, the commits, or the plan. Every epic has
      been implemented and committed.

      **Its current best-effort verdict:** {{ plan_reviewer.output.decision }}

      Answer what you can — anything left unanswered is settled by the
      reviewer's own judgment. You can go back and revise an earlier answer at
      any point before finishing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: $end
    routes:
      - to: plan_reviewer

  - name: fixer
    description: Fixes issues identified by the plan reviewer
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium
    input:
      - workflow.input.plan
      - coder.output
      - plan_reviewer.output
    system_prompt: |
      You are a Senior Software Engineer agent specializing in fixing issues
      identified during holistic code review.

      Your job is to address all issues raised by the plan reviewer:
      - Architecture and design issues
      - Code quality and consistency issues
      - Documentation gaps
      - Test coverage gaps

      You make targeted, precise fixes while maintaining the overall integrity
      of the implementation.
    prompt: |
      The plan reviewer has identified issues that need to be fixed.

      **Original Plan:**
      {{ workflow.input.plan }}

      **Reviewer Decision:** {{ plan_reviewer.output.decision }}

      **Reviewer Feedback:**
      {{ plan_reviewer.output.feedback }}

      **Architecture Issues:**
      {% for issue in plan_reviewer.output.architecture_issues %}
      - {{ issue }}
      {% endfor %}

      **Code Issues:**
      {% for issue in plan_reviewer.output.code_issues %}
      - {{ issue }}
      {% endfor %}

      **Documentation Issues:**
      {% for issue in plan_reviewer.output.documentation_issues %}
      - {{ issue }}
      {% endfor %}

      **Test Gaps:**
      {% for gap in plan_reviewer.output.test_gaps %}
      - {{ gap }}
      {% endfor %}

      {% if plan_reviewer.output.suggestions %}
      **Non-blocking suggestions** — these did NOT block approval. Adopt one
      only if it is trivially safe and clearly correct; skipping all of them is
      the right default. Do not let them expand the diff.
      {% for suggestion in plan_reviewer.output.suggestions %}
      - {{ suggestion }}
      {% endfor %}
      {% endif %}

      ## FIX TASKS

      1. **Address Architecture Issues**
         - Review and fix any architecture or design problems
         - Ensure proper component integration
         - Maintain separation of concerns

      2. **Fix Code Issues**
         - Address all code quality issues
         - Ensure consistency across all changes
         - Fix any bugs or logical errors

      3. **Complete Documentation**
         - Fill in documentation gaps
         - Update README or other docs as needed
         - Add missing code comments

      4. **Add Missing Tests**
         - Write tests to cover identified gaps
         - Add integration tests where needed
         - Ensure comprehensive coverage

      5. **Commit Fixes**
         - Stage all fixes
         - Create a clear commit message describing the fixes
         - Example: "fix: Address plan review feedback - improve error handling and add tests"

      Fix all identified issues.
    output:
      issues_fixed:
        type: array
        description: List of issues that were fixed
      files_modified:
        type: array
        description: List of files that were modified during fixes
      tests_added:
        type: array
        description: List of tests that were added
      documentation_updated:
        type: array
        description: List of documentation that was updated
      commit_message:
        type: string
        description: The git commit message for the fixes
      fix_notes:
        type: string
        description: Notes about the fixes made
      all_issues_resolved:
        type: boolean
        description: Whether all issues have been resolved
    routes:
      - to: plan_reviewer

output:
  plan: "{{ workflow.input.plan }}"
  epic_requested: "{{ workflow.input.epic | default('all') }}"
  epics_completed: "{{ committer.output.epic_completed if committer is defined else '' }}"
  remaining_epics: "{{ committer.output.remaining_epics | json if committer is defined else '[]' }}"
  all_complete: "{{ committer.output.all_complete if committer is defined else false }}"
  last_commit: "{{ committer.output.commit_message if committer is defined else '' }}"
  epic_review_decision: "{{ epic_reviewer.output.decision if epic_reviewer is defined else '' }}"
  epic_review_rounds: "{{ epic_reviewer.output.review_round if epic_reviewer is defined else 0 }}"
  capped_epic: "{{ mark_round_cap_reached.output.capped_epic if mark_round_cap_reached is defined else '' }}"
  plan_review_decision: "{{ plan_reviewer.output.decision if plan_reviewer is defined else '' }}"
  plan_review_suggestions: "{{ plan_reviewer.output.suggestions | json if plan_reviewer is defined else '[]' }}"
  human_questions_answered: "{{ (epic_reviewer_questions is defined and epic_reviewer_questions.output.answered_any) or (plan_reviewer_questions is defined and plan_reviewer_questions.output.answered_any) }}"
  iterations: "{{ context.iteration }}"
