# Ship Workflow
#
# Takes an existing GitHub issue all the way to a merged pull request,
# orchestrating the skills you already use rather than reimplementing their
# logic:
#
#   bootstrap (script)        resolve repo root / default branch / gh identity
#     ↓
#   issue_resolver            read the issue from GitHub
#     ↓
#   worktree_setup            [worktree skill] assign, comment, cut a worktree
#     ↓
#   worktree_verify (script)  assert the worktree exists; emit an absolute path
#     ↓
#   planner ←──────────┐      "plan mode": study the repo, draft a plan, raise
#     ↓                │      genuine open questions
#   ask_questions ─────┘      the whole set in one step (back / skip / abort)
#     ↓
#   plan_approval             approve / revise / stop (human gate)
#     ↓
#   coder                     implement on autopilot, run the repo's own
#     ↓                       build, lint and tests
#   ship_draft                [git-workflow skill] stage, commit, push, draft PR
#     ↓
#   review                    [code-review skill] review only — gather the
#     ↓                       blocking and recommended changes, change nothing
#   review_fixer              apply those findings, re-verify, commit and push
#     ↓                       (skipped when the review found nothing)
#   publish                   [git-workflow skill] mark ready for review
#     ↓
#   merge_gate                merge / don't merge (human gate)
#     ↓
#   merge ─────────────→ merge_conflicts   the branch conflicts with the base:
#     ↓                       ↓            resolve them / stop (human gate)
#     ↓                  conflict_resolver merge the base branch in, resolve,
#     ↓                       ↓            re-verify, push, then merge again
#     ↓ ←────────────────────┘
#   $end                      [merge-pr skill] squash, delete branch, remove
#                             the worktree — runs in the repo root, NOT in the
#                             worktree it is deleting
#
# Loops
#   Two, and a human drives both. The coder runs once, and if it does not
#   finish, `implementation_stalled` asks whether to run it again. If the merge
#   is blocked by conflicts, `merge_conflicts` asks whether to resolve them and
#   retry. Everything else is a straight line — `review_fixer` re-runs the
#   repository's checks after applying the findings, so an outer review loop
#   would just re-review code that was already reconciled. Declining the merge
#   leaves the PR open and ends the run; pick it up by hand or start a fresh
#   one.
#
# Review
#   The review reports and the fixer changes, and neither does the other's job.
#   An agent that reviews and patches in one pass grades its own work: it stops
#   writing findings down once it has fixed them, so whatever it got wrong is
#   invisible by the time anyone reads the summary. Splitting them forces every
#   finding through a written, self-contained handoff, which is also what makes
#   the merge gate's "not all were resolved" line trustworthy.
#
# Autopilot
#   `--input autopilot=true` bypasses every human gate, for a run you do not
#   intend to sit with. The workflow then takes the obvious choice at each one:
#   it skips the planner's questions and plan approval, retries a stalled coder
#   up to `max_autopilot_rounds` times before shipping what exists, and
#   resolves merge conflicts itself rather than asking.
#
#   Because no human is left to break a cycle, both loops are bounded by
#   `max_autopilot_rounds` under autopilot, and exhausting the conflict budget
#   fails the run rather than merging something unverified. Autopilot merges
#   without asking, so a plan you would have corrected at the gate reaches the
#   default branch — leave it off unless the issue is genuinely routine.
#
#   Two things still stop an autopilot run, because neither is a human
#   approval: a code review that reports unresolved blocking findings or
#   `do_not_merge`, and merge conflicts it could not resolve. Both leave the
#   pull request open and fail the run rather than landing the change.
#
# Working directories
#   Steps with no `working_dir` run in the directory you invoked
#   `conductor run` from, so the workflow targets whatever repository you are
#   standing in. Once the worktree exists, every implementation step pins
#   `working_dir` to its absolute path. `merge` deliberately pins back to the
#   repository root, mirroring the manual step of leaving the worktree before
#   deleting it.
#
# Plugins
#   Each step declares the plugin whose skill it drives, rather than the
#   workflow enabling skill discovery and excluding everything it does not
#   want. An allowlist cannot leak: installing a new plugin later has no
#   effect on this run, where a blocklist silently grew.
#
#   Declaring the plugin also loads what the skill depends on. `code-review`
#   dispatches to the seven specialist subagents `prs` ships in `agents/`;
#   discovering the skill alone left it calling agents that were not there.
#
#     issue_resolver, ship_draft, publish   git@jason-tools    gh-cli, git-workflow
#     worktree_setup                        issues@jason-tools worktree
#     planner                               ado@jason-tools    ado agent (ADO MCP)
#     planner                          ms-internal@jason-tools ms-internal agent (Learn, EngHub)
#     coder                                 dev@jason-tools    code-comments
#     review, merge                         prs@jason-tools    code-review, merge-pr
#     review_fixer, conflict_resolver       git@jason-tools    git-workflow, gh-cli
#     review_fixer                          dev@jason-tools    code-comments
#
#   Entries are `plugin@marketplace`, so they resolve against the installed
#   `jason-tools` marketplace. To run this against a different marketplace,
#   rewrite the suffixes, or declare `runtime.plugin_sources` to fetch one by
#   git URL and make the workflow self-installing.
#
#   Nothing else is loaded. `ship` in particular is absent, so an agent cannot
#   recursively re-invoke this workflow.
#
# Usage:
#   Run it from the repository you want to work in. The issue must already
#   exist — this workflow never creates one.
#
#     conductor run workflows/ship/workflow.yaml --input issue=123
#
#   The issue can also be a URL or an `owner/repo#123` reference:
#     conductor run workflows/ship/workflow.yaml \
#       --input issue="https://github.com/owner/repo/issues/123"
#
#   Skip the question gate and go straight to plan approval:
#     conductor run workflows/ship/workflow.yaml --input issue=123 \
#       --input ask_questions=false
#
#   Fully unattended — no gates at all, merges without asking:
#     conductor run workflows/ship/workflow.yaml --input issue=123 \
#       --input autopilot=true
#
# Requires:
#   - git and gh (GitHub CLI) on PATH, with `gh auth status` passing
#   - python3 on PATH (used by the bootstrap and worktree_verify steps)
#   - The plugins listed above installed from the `jason-tools` marketplace

workflow:
  name: ship
  description: Takes an existing GitHub issue to a merged pull request — cuts a worktree, plans with a one-question-at-a-time human gate, implements unattended, opens a draft PR, reviews it and applies the findings in a separate step, then publishes and merges behind a human gate with full branch and worktree cleanup. Merge conflicts pause for a human, and `autopilot` bypasses every gate for a run you do not sit with
  version: "1.1.0"
  entry_point: bootstrap

  runtime:
    provider: copilot
    default_model: claude-sonnet-5
    max_session_seconds: 3600
    checkpoint:
      every_agent: true   # long, human-gated run — keep it resumable after an
      keep_last: 5        # external interruption

  input:
    issue:
      type: string
      required: true
      description: "Issue to work on — a number (`123`), a full URL, or `owner/repo#123`. The issue must already exist; this workflow never creates one."

    ask_questions:
      type: boolean
      required: false
      default: true
      description: "Put the planner's open questions to you one at a time before implementation starts. Set false to go straight to plan approval. Ignored when `autopilot` is true."

    autopilot:
      type: boolean
      required: false
      default: false
      description: "Run with no human gates at all: skip the planner's questions and plan approval, retry a stalled implementation instead of asking, resolve merge conflicts instead of asking, and merge without a final confirmation. The pull request lands on the default branch with nobody having read it, so use it only for work you would have approved unseen."

    max_autopilot_rounds:
      type: number
      required: false
      default: 2
      description: "How many times autopilot retries by itself before giving up — re-running a coder that did not finish, and re-attempting a merge whose conflicts were not resolved. Bounds the two loops a human would otherwise break. Ignored unless `autopilot` is true."

  context:
    mode: explicit

  limits:
    max_iterations: 150

agents:
  # ---------------------------------------------------------------------------
  # Setup
  # ---------------------------------------------------------------------------

  - name: bootstrap
    description: Resolves the target repository, its default branch and your GitHub identity from the directory the workflow was invoked in
    type: script
    command: python3
    timeout: 120
    args:
      - "-c"
      - |
        import json, os, subprocess, sys

        def emit(payload):
            print(json.dumps(payload))
            sys.exit(0)

        def run(args):
            p = subprocess.run(args, capture_output=True, text=True)
            return p.returncode, p.stdout.strip(), p.stderr.strip()

        rc, repo_root, err = run(["git", "rev-parse", "--show-toplevel"])
        if rc != 0 or not repo_root:
            emit({"ok": False, "error": "Not inside a git repository (cwd " + os.getcwd() + "). " + err})

        rc, nwo, err = run(["gh", "repo", "view", "--json", "nameWithOwner", "-q", ".nameWithOwner"])
        if rc != 0 or not nwo:
            emit({"ok": False, "error": "'gh repo view' failed - check that the GitHub CLI is installed and authenticated. " + err})

        rc, gh_user, err = run(["gh", "api", "user", "--jq", ".login"])
        if rc != 0 or not gh_user:
            emit({"ok": False, "error": "'gh api user' failed - run 'gh auth status'. " + err})

        rc, ref, _ = run(["git", "symbolic-ref", "--quiet", "--short", "refs/remotes/origin/HEAD"])
        default_branch = ref.split("/", 1)[1] if rc == 0 and "/" in ref else ""
        if not default_branch:
            rc, db, _ = run(["gh", "repo", "view", "--json", "defaultBranchRef", "-q", ".defaultBranchRef.name"])
            default_branch = db if rc == 0 else ""
        if not default_branch:
            emit({"ok": False, "error": "Could not determine the default branch for " + nwo + "."})

        repo_name = os.path.basename(repo_root)
        emit({
            "ok": True,
            "error": "",
            "repo_root": repo_root,
            "repo_name": repo_name,
            "name_with_owner": nwo,
            "default_branch": default_branch,
            "gh_user": gh_user,
            "worktrees_dir": os.path.join(os.path.dirname(repo_root), repo_name + ".worktrees"),
        })
    routes:
      - to: bootstrap_failed
        when: "{{ not output.ok }}"
      - to: issue_resolver

  - name: bootstrap_failed
    type: terminate
    status: failed
    input:
      - bootstrap.output.error
    reason: "{{ bootstrap.output.error }}"

  - name: issue_resolver
    description: Loads the issue to work on from GitHub
    model: claude-sonnet-5
    reasoning:
      effort: medium
    plugins:
      - git@jason-tools       # gh-cli — account switching on a 404 or 403
    input:
      - workflow.input.issue
      - bootstrap.output.name_with_owner
      - bootstrap.output.repo_root
      - bootstrap.output.default_branch
    system_prompt: |
      You resolve the unit of work for an implementation pipeline: you read an
      existing GitHub issue and classify it. You never create or edit issues,
      you never implement anything, and you never touch git branches.

      Use the `gh` CLI for every GitHub operation. If a `gh` call fails with a
      404 or a permission error, run `gh auth status`, try `gh auth switch`,
      and retry once before reporting failure.
    prompt: |
      Repository: `{{ bootstrap.output.name_with_owner }}` (checked out at `{{ bootstrap.output.repo_root }}`)
      Default branch: `{{ bootstrap.output.default_branch }}`

      ## Load issue `{{ workflow.input.issue }}`

      The reference may be a bare number, a full URL, or `owner/repo#123`.
      Normalise it, then read the issue:

      ```
      gh issue view <number> -R <owner>/<repo> --json number,title,body,labels,url,state
      ```

      If the issue cannot be read at all — it does not exist, or you lack
      access — set `found: false` and put the exact `gh` error in `notes`. Do
      not invent an issue, and do not create one; this workflow only ever works
      an issue that already exists.

      If the issue is closed, set `found: true` and say so plainly in `notes` —
      that is not a failure, the human decides at the approval gate.

      Report the issue exactly as GitHub returned it. Do not paraphrase the
      title or body, and do not classify or summarise it — later steps read the
      labels themselves.
    output:
      found:
        type: boolean
        description: True when the issue was read from GitHub. False when it does not exist or is not accessible.
      issue_number:
        type: number
        description: The issue number
      issue_title:
        type: string
        description: The issue title, verbatim from GitHub
      issue_body:
        type: string
        description: The issue body, verbatim from GitHub
      issue_url:
        type: string
        description: Full URL of the issue
      notes:
        type: string
        description: Anything the human should know before work starts, such as the issue already being closed. Empty when there is nothing to flag.
    routes:
      - to: issue_resolver_failed
        when: "{{ not output.found }}"
      - to: worktree_setup

  - name: issue_resolver_failed
    type: terminate
    status: failed
    input:
      - workflow.input.issue
      - issue_resolver.output.notes
    reason: "Issue '{{ workflow.input.issue }}' could not be read from GitHub. {{ issue_resolver.output.notes }}"

  - name: worktree_setup
    description: Claims the issue and creates an isolated worktree and branch for it, using the worktree skill
    model: claude-sonnet-5
    plugins:
      - issues@jason-tools    # worktree
    input:
      - issue_resolver.output.issue_number
    system_prompt: |
      You invoke the `worktree` skill and report what it did. The skill owns
      the procedure — assigning, commenting, naming and creating the worktree.
      Follow it as written; do not substitute your own steps and do not write
      any implementation code.
    prompt: |
      /worktree #{{ issue_resolver.output.issue_number }}

      Then report the worktree exactly as the skill left it. The absolute path
      and branch name must match what is on disk — every later step runs there.
    output:
      worktree_path:
        type: string
        description: Absolute path to the created worktree. Empty when creation failed.
      branch_name:
        type: string
        description: The branch created in the worktree
      worktree_created:
        type: boolean
        description: True only when the worktree exists on disk
      issue_assigned:
        type: boolean
        description: True when the issue was assigned
      comment_posted:
        type: boolean
        description: True when the starting-work comment was posted
      error:
        type: string
        description: What went wrong, empty on success
    routes:
      - to: worktree_verify

  - name: worktree_verify
    description: Independently confirms the worktree exists and is a git checkout, so that a wrong path fails here with a clear message rather than inside a later agent's working_dir resolution
    type: script
    command: python3
    timeout: 60
    input:
      - worktree_setup.output.worktree_path
      - worktree_setup.output.error
    args:
      - "-c"
      - |
        import json, os, subprocess, sys

        def emit(payload):
            print(json.dumps(payload))
            sys.exit(0)

        raw = sys.argv[1].strip() if len(sys.argv) > 1 else ""
        reported_error = sys.argv[2].strip() if len(sys.argv) > 2 else ""

        if not raw:
            emit({
                "ok": False,
                "worktree_path": "",
                "branch": "",
                "error": "worktree_setup reported no path. " + reported_error,
            })

        path = os.path.abspath(os.path.expanduser(raw))
        if not os.path.isdir(path):
            emit({
                "ok": False,
                "worktree_path": "",
                "branch": "",
                "error": "Worktree path does not exist: " + path + ". " + reported_error,
            })

        p = subprocess.run(
            ["git", "-C", path, "rev-parse", "--abbrev-ref", "HEAD"],
            capture_output=True,
            text=True,
        )
        if p.returncode != 0:
            emit({
                "ok": False,
                "worktree_path": path,
                "branch": "",
                "error": "Not a git checkout: " + path + ". " + p.stderr.strip(),
            })

        emit({"ok": True, "worktree_path": path, "branch": p.stdout.strip(), "error": ""})
      - "{{ worktree_setup.output.worktree_path }}"
      - "{{ worktree_setup.output.error }}"
    routes:
      - to: worktree_setup_failed
        when: "{{ not output.ok }}"
      - to: planner

  - name: worktree_setup_failed
    type: terminate
    status: failed
    input:
      - worktree_verify.output.error
    reason: "{{ worktree_verify.output.error }}"

  # ---------------------------------------------------------------------------
  # Planning
  # ---------------------------------------------------------------------------

  - name: planner
    description: Studies the codebase and produces an implementation plan for the issue, raising the questions it genuinely cannot answer from the code
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: xhigh
    plugins:
      - ado@jason-tools       # ado agent — ADO work items, repos, wikis
      - ms-internal@jason-tools  # ms-internal agent — MS Learn, EngHub
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - issue_resolver.output.issue_number
      - issue_resolver.output.issue_title
      - issue_resolver.output.issue_body
      - issue_resolver.output.issue_url
      - issue_resolver.output.notes?
      - workflow.input.ask_questions
      - workflow.input.autopilot
      - worktree_verify.output.worktree_path
      - worktree_verify.output.branch
      - ask_questions.output?
      - plan_approval.output?
      - planner.output?
    system_prompt: |
      You are a planning agent operating exactly like plan mode in a coding
      CLI: you investigate the codebase, decide how the change should be made,
      and write that down. You do not edit files, run generators, or make
      commits. Reading, searching and running read-only commands is expected
      and encouraged.

      A plan is only useful if it is grounded. Name real files, real functions
      and real commands that you have confirmed exist. A plan full of plausible
      but unverified paths is worse than no plan, because it will be followed.
    prompt: |
      You are working in `{{ worktree_verify.output.worktree_path }}` on branch
      `{{ worktree_verify.output.branch }}`.

      ## The work

      **Issue #{{ issue_resolver.output.issue_number }} — {{ issue_resolver.output.issue_title }}**
      {{ issue_resolver.output.issue_url }}

      {{ issue_resolver.output.issue_body }}
      {% if issue_resolver.output.notes %}

      *Flagged when the issue was loaded: {{ issue_resolver.output.notes }}*
      {% endif %}

      {% if planner is defined and planner.output %}
      ## This is a revision

      You already produced a plan. Revise it — do not start over, and keep
      everything that was not challenged.

      {% if ask_questions is defined and ask_questions.output.transcript %}
      ### The human answered your questions

      ```
      {{ ask_questions.output.transcript }}
      ```

      Fold these answers into the plan. An answer that changes the approach
      must change the plan, not just get appended to it. Any question you asked
      that is missing above was skipped and stays unresolved — state the
      assumption you are proceeding on.
      {% endif %}

      {% if plan_approval is defined and plan_approval.output.selected == 'revise' %}
      ### The human asked for changes

      ```
      {{ plan_approval.output.additional_input.feedback }}
      ```

      Address this directly.
      {% endif %}
      {% endif %}

      ## What to do

      1. **Understand the current state.** Read the code that this change
         touches. Follow the call paths. Check for an existing partial
         implementation, a related helper, or a convention you should be
         following. Read `AGENTS.md`, `CLAUDE.md`, `CONTRIBUTING.md` or the
         README if they exist — they usually constrain the answer.

      2. **Find how this repository builds, lints and tests itself.** Look at
         the package manifest, the CI workflows, and the contributor guide.
         The plan must name the exact commands, because the implementation
         step will run them.

      3. **Write the plan.** In `plan`, as markdown:
         - **Approach** — the shape of the change in a few sentences, and any
           real alternative you rejected, with the reason.
         - **Changes** — one entry per file to add or modify, saying what
           changes in it and why. Concrete paths only.
         - **Verification** — the exact build, lint and test commands, and what
           new test coverage the change needs.
         - **Risks** — what could break, and anything deliberately out of scope.

      4. **Raise your open questions.**
         {% if workflow.input.ask_questions and not workflow.input.autopilot %}
         Put a question in `open_questions` only when a human decision actually
         changes the plan and the codebase cannot settle it: a product choice,
         a behavioural trade-off, an ambiguity in the issue, an interaction
         with something you have no visibility into.

         Do not ask what you can find out by reading the code. Do not ask for
         permission to proceed. Do not ask about style that the repository
         already settles.

         Each question must stand on its own — the human sees it alone, on its
         own screen, with no other context. Return each entry as an object —
         `{"question": "...", "choices": ["...", "..."]}` — and give `choices`
         whenever the answer is a decision between options you can name: 2-4
         candidate answers, each phrased as the decision itself rather than as
         "yes"/"no". Put the option you would take by default first and mark it
         by ending its text with ` (Recommended)`, so the reader can see your
         recommendation without reading your reasoning — at most one choice per
         question carries that suffix, and you leave it off entirely when you
         genuinely have no preference. Picking a listed option is far cheaper
         for a human than typing prose, and they can still write their own
         answer instead. Omit `choices` only for genuinely open-ended questions
         where you cannot name the alternatives. Either way, a skipped question
         must still leave the plan actionable.

         An empty list is the correct answer when nothing genuinely needs
         deciding. Do not manufacture questions to look thorough.
         {% else %}
         The human has turned off the question gate, so return an empty
         `open_questions` list. Where you would have asked, state the
         assumption you are proceeding on in the plan's Risks section instead.
         {% if workflow.input.autopilot %}

         This run is on autopilot: nobody reviews this plan before it is
         implemented, and nobody reviews the pull request before it merges.
         Be correspondingly conservative — prefer the change the issue
         literally asks for over the more ambitious one you would have
         proposed for a human to weigh, and put anything you would have
         escalated into Risks.
         {% endif %}
         {% endif %}
    output:
      plan:
        type: string
        description: The implementation plan as markdown, covering approach, per-file changes, verification commands and risks
      summary:
        type: string
        description: A two or three sentence description of the change, for the commit message and PR body
      open_questions:
        type: array
        description: 'Self-contained questions a human must answer. Each entry is an object: {"question": "...", "choices": ["..."]}, with choices omitted only when the alternatives cannot be named. The default choice comes first and ends with " (Recommended)". Empty when nothing genuinely needs a human decision.'
      verification_commands:
        type: array
        description: The exact build, lint and test commands this repository uses, as confirmed from its own configuration
    routes:
      - to: ask_questions
        when: "{{ workflow.input.ask_questions and not workflow.input.autopilot and (output.open_questions | length) > 0 and ask_questions is not defined }}"
      - to: coder
        when: "{{ workflow.input.autopilot }}"
      - to: plan_approval

  - name: ask_questions
    type: questions
    description: Puts every open question to the human inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: planner.output.open_questions
    prompt: |
      ## Issue #{{ issue_resolver.output.issue_number }} — {{ issue_resolver.output.issue_title }}

      The planner raised {{ planner.output.open_questions | length }} open
      question{{ 's' if (planner.output.open_questions | length) != 1 else '' }}
      before it commits to an approach. Nothing has been written to the
      repository yet.

      Answer what you can — anything left unanswered becomes an assumption the
      plan proceeds on. You can go back and revise an earlier answer at any
      point before finishing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: stopped
    routes:
      - to: planner

  - name: plan_approval
    type: human_gate
    description: The approve-then-autopilot checkpoint — nothing is written to the repository until this gate is cleared
    prompt: |
      ## Implementation plan — issue #{{ issue_resolver.output.issue_number }}

      **{{ issue_resolver.output.issue_title }}**
      {{ issue_resolver.output.issue_url }}

      {{ planner.output.summary }}

      ---

      {{ planner.output.plan }}

      ---

      **Worktree:** `{{ worktree_verify.output.worktree_path }}`
      **Branch:** `{{ worktree_verify.output.branch }}`
      {% if planner.output.verification_commands | length > 0 %}
      **Verification:** {% for cmd in planner.output.verification_commands %}`{{ cmd }}`{% if not loop.last %}, {% endif %}{% endfor %}
      {% endif %}
      {% if ask_questions is defined and ask_questions.output.transcript %}

      <details><summary>Your answers</summary>

      ```
      {{ ask_questions.output.transcript }}
      ```

      </details>
      {% endif %}

      Approving starts autopilot implementation in the worktree.
    options:
      - label: Approve & implement
        value: approve
        route: coder
      - label: Revise the plan
        value: revise
        route: planner
        prompt_for: feedback
      - label: Stop the workflow here
        value: stop
        route: stopped

  # ---------------------------------------------------------------------------
  # Implementation
  # ---------------------------------------------------------------------------

  - name: coder
    description: Implements the approved plan on autopilot and verifies it with the repository's own build, lint and test commands
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: high
    plugins:
      - dev@jason-tools       # code-comments
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - planner.output.plan
      - planner.output.summary
      - planner.output.verification_commands
      - issue_resolver.output.issue_number
      - issue_resolver.output.issue_title
      - worktree_verify.output.worktree_path
      - worktree_verify.output.branch
      - workflow.input.autopilot
      - workflow.input.max_autopilot_rounds
      - coder.output?
      - implementation_stalled.output?
    system_prompt: |
      You implement an approved plan. The planning is done and the plan is
      settled, so do not re-litigate the approach — build it.

      You work only inside the worktree you are given. Do not commit, do not
      push, and do not open a pull request; a later step owns all of that.

      Verification is part of the job, not an optional extra. Code that has not
      been built, linted and tested is not finished, and reporting it as
      finished is the single most damaging thing you can do here.
    prompt: |
      Implement this plan in `{{ worktree_verify.output.worktree_path }}` (branch
      `{{ worktree_verify.output.branch }}`), for issue
      #{{ issue_resolver.output.issue_number }} — {{ issue_resolver.output.issue_title }}.

      ## The approved plan

      {{ planner.output.plan }}

      {% if coder is defined and coder.output %}
      ## Continuing — round {{ coder.output.round + 1 }}

      What you completed last round:

      {{ coder.output.summary }}

      What was still outstanding:
      {% for item in coder.output.blockers %}
      - {{ item }}
      {% endfor %}

      Verification stood at: {{ coder.output.verification }}

      Pick up from there. Do not redo work that is already done.
      {% if implementation_stalled is defined and implementation_stalled.output.selected == 'continue' %}

      The human reviewed the stall and told you to keep going.
      {% endif %}
      {% if workflow.input.autopilot %}

      This run is on autopilot, so nobody reviewed the stall — you were
      restarted automatically, and you get at most
      {{ workflow.input.max_autopilot_rounds }} round(s) in total. If this is
      the last one, spend it on making what exists correct and verified rather
      than on starting anything new: whatever you leave behind is what ships.
      {% endif %}
      {% endif %}

      ## How to work

      1. Make the changes the plan calls for. Follow the conventions already in
         the files you are editing rather than importing your own.
      2. Add or update tests for behaviour you changed, as the plan's
         verification section requires.
      3. Run the repository's own checks and get them passing:
         {% if planner.output.verification_commands | length > 0 %}
         {% for cmd in planner.output.verification_commands %}
         - `{{ cmd }}`
         {% endfor %}
         {% else %}
         Find them in the package manifest, the CI workflows, or the
         contributor guide, and run them.
         {% endif %}
      4. Only run checks that already exist. Do not introduce a new test
         framework, linter or build tool to satisfy this step.

      ## Scope

      Implement the plan fully and correctly. Fix bugs you introduce, and fix
      pre-existing bugs that your change makes reachable — but leave unrelated
      problems alone.

      ## Reporting

      Set `complete: true` only when the plan is fully implemented **and** the
      verification commands pass. If something is genuinely blocked — a missing
      credential, a failing test you cannot reach, a decision that was never
      settled — set `complete: false`, put the specifics in `blockers`, and say
      what you tried. An honest incomplete report is useful. A false completion
      wastes the review and merge stages downstream.

      Set `round` to {% if coder is defined and coder.output %}{{ coder.output.round + 1 }}{% else %}1{% endif %}.
    output:
      complete:
        type: boolean
        description: True only when the plan is fully implemented and the verification commands pass
      round:
        type: number
        description: Which implementation round this was, starting at 1
      summary:
        type: string
        description: What was implemented this round
      files_changed:
        type: array
        description: Paths of files added or modified, relative to the worktree root
      verification:
        type: string
        description: Which verification commands were run and what they reported
      blockers:
        type: array
        description: Specific reasons the work is not complete. Empty when complete is true.
    routes:
      # Autopilot has no human to ask, so a stalled coder is retried on a round
      # counter and then ships what exists rather than blocking forever.
      - to: coder
        when: "{{ not output.complete and workflow.input.autopilot and output.round < workflow.input.max_autopilot_rounds }}"
      - to: implementation_stalled
        when: "{{ not output.complete and not workflow.input.autopilot }}"
      - to: ship_draft

  - name: implementation_stalled
    type: human_gate
    description: Reached when the coder used its whole round budget without finishing, so the human decides whether to keep going, ship what exists, or stop
    prompt: |
      ## Implementation did not finish

      Issue #{{ issue_resolver.output.issue_number }} — {{ issue_resolver.output.issue_title }}

      The coder stopped after {{ coder.output.round }} round(s) without
      reporting completion.

      **Last round:**

      {{ coder.output.summary }}

      **Still blocked on:**
      {% for item in coder.output.blockers %}
      - {{ item }}
      {% endfor %}

      **Verification:** {{ coder.output.verification }}

      **Worktree:** `{{ worktree_verify.output.worktree_path }}`

      Your changes are on disk and uncommitted. Continuing runs the coder
      again; shipping opens a draft PR with the work as it stands.
    options:
      - label: Run the coder again
        value: continue
        route: coder
      - label: Ship what exists as a draft PR
        value: ship
        route: ship_draft
      - label: Stop the workflow here
        value: stop
        route: stopped

  # ---------------------------------------------------------------------------
  # Draft PR, review, reconcile
  # ---------------------------------------------------------------------------

  - name: ship_draft
    description: Stages, commits, pushes and opens a draft pull request, using the git-workflow skill
    model: claude-sonnet-5
    plugins:
      - git@jason-tools       # git-workflow, gh-cli
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - worktree_verify.output.worktree_path
      - issue_resolver.output.issue_number
    system_prompt: |
      You invoke the `git-workflow` skill and report what it did. The skill
      owns the pipeline — what to stage, how to word the commit, and how to
      open the PR. Follow it as written. You do not modify implementation code.
    prompt: |
      /git-workflow acdpr

      Link the pull request to the issue by putting `Closes #{{ issue_resolver.output.issue_number }}`
      in the PR body, then report what the skill produced.
    output:
      pr_url:
        type: string
        description: Full URL of the pull request
      pr_number:
        type: number
        description: The pull request number
      commit_sha:
        type: string
        description: SHA of the commit that was pushed
      pushed:
        type: boolean
        description: True when the branch was pushed and the draft PR exists
      warnings:
        type: array
        description: Anything the skill flagged or excluded, such as a skipped credentials file. Empty when there was nothing to report.
    routes:
      - to: review

  - name: review
    description: Reviews the pull request and reports what needs changing, without touching the code — a separate step applies the findings
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: high
    plugins:
      # `code-review` dispatches to the seven specialist subagents the plugin
      # ships in `agents/` (code-reviewer, pr-test-analyzer, silent-failure-
      # hunter, type-design-analyzer, comment-analyzer, code-simplifier,
      # dead-code-finder). Loading the plugin brings the skill AND those
      # subagents; loading the skill alone left it dispatching to agents that
      # did not exist.
      - prs@jason-tools       # code-review
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - ship_draft.output.pr_number
      - worktree_verify.output.worktree_path
      - worktree_verify.output.branch
    system_prompt: |
      You invoke the `code-review` skill and report its findings. The skill
      owns which reviews run and how findings are ranked — follow it as written
      for everything up to and including the aggregated summary.

      You are a reviewer, not an implementer. You do not edit files, do not
      commit, and do not push. A separate step applies your findings, and it
      can only apply what you actually wrote down — a finding you fixed
      yourself, or described too vaguely to act on, is a finding that step will
      get wrong.
    prompt: |
      /code-review #{{ ship_draft.output.pr_number }}
      
      Do not apply the fixes, just report the findings.
    output:
      blocking:
        type: array
        description: Findings that must be fixed before this can merge. Each entry names the file and line, what is wrong, and what the fix should be, in enough detail to act on without re-reviewing. Empty when nothing blocks.
      recommendations:
        type: array
        description: Findings worth fixing that do not block the merge, in the same self-contained form as blocking entries. Nits are excluded.
      strengths:
        type: array
        description: What the implementation does well, from the review's summary
      summary:
        type: string
        description: The review's overall assessment of the pull request
      merge_readiness:
        type: string
        description: One of ready, needs_work, do_not_merge. Reserve do_not_merge for an objection that fixing the listed findings would not resolve — it stops an autopilot run outright.
    routes:
      - to: review_fixer
        when: "{{ (output.blocking | length) > 0 or (output.recommendations | length) > 0 }}"
      - to: publish

  - name: review_fixer
    description: Applies the review's findings and pushes them, so the review itself never has to double as an implementer
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium
    plugins:
      - git@jason-tools       # git-workflow, gh-cli
      - dev@jason-tools       # code-comments
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - review.output.blocking
      - review.output.recommendations
      - review.output.summary
      - planner.output.plan
      - planner.output.verification_commands
      - issue_resolver.output.issue_number
      - ship_draft.output.pr_number
      - worktree_verify.output.worktree_path
      - worktree_verify.output.branch
    system_prompt: |
      You apply the findings of a code review that has already happened. The
      reviewing is done — do not re-review the pull request, do not go looking
      for problems nobody raised, and do not re-litigate a finding you disagree
      with by quietly ignoring it.

      Every line you change must trace to a finding you were given. Unrequested
      refactors, extra hardening and adjacent cleanups are what turn a small
      review pass into a diff that needs its own review.

      A finding you cannot fix correctly is worth more reported than guessed
      at. Say so and move on.
    prompt: |
      The code review of PR #{{ ship_draft.output.pr_number }} is complete.
      Apply its findings in the worktree at
      `{{ worktree_verify.output.worktree_path }}` (branch
      `{{ worktree_verify.output.branch }}`).

      **The reviewer's assessment:** {{ review.output.summary }}

      {% if (review.output.blocking | length) > 0 %}
      ## Blocking — fix all of these

      {% for item in review.output.blocking %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% else %}
      ## Blocking

      None.
      {% endif %}

      {% if (review.output.recommendations | length) > 0 %}
      ## Recommendations — apply the ones that are clearly worth it

      These did not block the merge. Apply the ones that are safe, small and
      clearly correct. Skip any that would grow the diff out of proportion to
      what they buy, or that you cannot make confidently — and say which you
      skipped and why. Skipping all of them is a legitimate outcome.

      {% for item in review.output.recommendations %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}

      ## How to work

      1. **Read the actual diff first.** The findings describe it, but the code
         is the truth:

         ```
         git status --short
         git diff origin/{{ worktree_verify.output.branch }}...HEAD
         ```

      2. **Fix the blocking findings, smallest correct change each.** Work
         through them in order. If a finding is already fixed, or you believe
         it is not a real defect, do not silently skip it — record it in
         `unresolved` with your reasoning.

      3. **Then consider the recommendations**, on the terms above.

      4. **Re-run the repository's own checks**, so a fix that breaks something
         does not reach the merge gate:
         {% if planner.output.verification_commands | length > 0 %}
         {% for cmd in planner.output.verification_commands %}
         - `{{ cmd }}`
         {% endfor %}
         {% else %}
         Find them in the package manifest, the CI workflows, or the
         contributor guide, and run them.
         {% endif %}

      5. **Commit and push** to the existing branch. Use the `git-workflow`
         skill's `acp` — stage, commit, push. Never force-push and never
         rebase: the pull request is open, and rewriting its history detaches
         the review comments on it.

      ## Reporting

      Set `all_resolved: true` only when every blocking finding is genuinely
      resolved, the checks pass, and the work is pushed. Anything you left —
      including a finding you disagreed with — belongs in `unresolved` with the
      reason. A false green here is what lets an autopilot run merge the exact
      defect the review caught.
    output:
      all_resolved:
        type: boolean
        description: True only when every blocking finding was resolved, the verification commands passed, and the work was pushed
      blocking_resolved:
        type: number
        description: How many of the blocking findings were actually fixed
      recommendations_applied:
        type: array
        description: The recommendations that were adopted. Empty when none were.
      recommendations_skipped:
        type: array
        description: The recommendations that were deliberately not adopted, each with the reason
      unresolved:
        type: array
        description: Blocking findings not fixed, each with the reason — including any you judged not to be real defects. Empty when all_resolved is true.
      files_changed:
        type: array
        description: Paths of files modified while applying the findings, relative to the worktree root
      verification:
        type: string
        description: Which verification commands were run after the fixes and what they reported
      summary:
        type: string
        description: What was changed in response to the review
      pushed:
        type: boolean
        description: True when the fixes were committed and pushed to the branch
    routes:
      - to: publish


  # ---------------------------------------------------------------------------
  # Publish and merge
  # ---------------------------------------------------------------------------

  - name: publish
    description: Takes the pull request out of draft and reports its CI status, using the gh-cli skill
    model: claude-sonnet-5
    plugins:
      - git@jason-tools       # gh-cli
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - ship_draft.output.pr_number
      - ship_draft.output.pr_url
      - worktree_verify.output.worktree_path
      - workflow.input.autopilot
    system_prompt: |
      You invoke the `gh-cli` skill to take a pull request out of draft and
      report its state. You do not merge it and you do not change any code.
    prompt: |
      Use the **gh-cli** skill to mark PR #{{ ship_draft.output.pr_number }}
      ({{ ship_draft.output.pr_url }}) ready for review, then report its
      mergeable state and CI check status.

      Marking a draft ready is `gh pr ready` — the `git-workflow` skill has no
      token for it, so do not reach for a token combo here.
    output:
      pr_url:
        type: string
        description: Full URL of the pull request
      is_draft:
        type: boolean
        description: Whether the PR is still a draft. False on success.
      mergeable:
        type: string
        description: GitHub's mergeable state, such as MERGEABLE or CONFLICTING
      checks_summary:
        type: string
        description: Plain-language summary of the CI check status
      error:
        type: string
        description: What went wrong, empty on success
    routes:
      # Autopilot has no gate to show the review at, so the review's own verdict
      # becomes the stop condition. This is not a human approval being bypassed
      # — it is the one check that would have made a human decline the merge.
      # `do_not_merge` is a hard stop because it is reserved for objections the
      # fix step cannot clear; everything else is judged on what that step
      # actually resolved.
      - to: review_rejected
        when: "{{ workflow.input.autopilot and review is defined and (review.output.merge_readiness == 'do_not_merge' or (review_fixer is defined and not review_fixer.output.all_resolved)) }}"
      - to: merge
        when: "{{ workflow.input.autopilot }}"
      - to: merge_gate

  - name: review_rejected
    type: terminate
    status: failed
    input:
      - review.output?
      - review_fixer.output?
      - publish.output.pr_url?
    reason: >-
      Autopilot stopped before merging: the code review did not clear the pull
      request
      {%- if review is defined %} ({{ review.output.merge_readiness }}, {{ review.output.blocking | length }} blocking finding(s))
      {%- endif %}
      {%- if review_fixer is defined and not review_fixer.output.all_resolved %}
      and the fix step left {{ review_fixer.output.unresolved | length }} of them outstanding:
      {{ review_fixer.output.unresolved | join('; ') }}
      {%- endif %}. The pull request is left open for a human to finish
      {%- if publish is defined %} — {{ publish.output.pr_url }}{% endif %}.

  - name: merge_gate
    type: human_gate
    description: The last stop before merge — the human reads the PR and decides whether it lands
    prompt: |
      ## Ready to merge — issue #{{ issue_resolver.output.issue_number }}

      **{{ issue_resolver.output.issue_title }}**

      {{ publish.output.pr_url }}

      {% if publish.output.error %}
      > **Publishing reported a problem:** {{ publish.output.error }}
      {% endif %}
      {% if publish.output.is_draft %}
      > **The PR is still a draft.**
      {% endif %}

      **Mergeable:** {{ publish.output.mergeable }}
      **Checks:** {{ publish.output.checks_summary }}

      ---

      {% if review is defined %}
      **Review:** {{ review.output.summary }}

      {% if (review.output.blocking | length) > 0 %}
      {{ review.output.blocking | length }} blocking finding(s) were raised and
      {% if review_fixer is defined and review_fixer.output.all_resolved %}all were resolved.{% else %}**not all were resolved.**{% endif %}
      {% else %}
      No blocking findings.
      {% endif %}

      {% if review_fixer is defined %}

      **Fixes applied:** {{ review_fixer.output.summary }}

      {% if review_fixer.output.verification %}
      **Verified with:** {{ review_fixer.output.verification }}
      {% endif %}

      {% if review_fixer.output.pushed %}
      Fixes were committed and pushed to `{{ worktree_verify.output.branch }}`.
      {% endif %}

      {% if (review_fixer.output.unresolved | length) > 0 %}
      **Blocking findings left outstanding:**
      {% for item in review_fixer.output.unresolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      {% if (review_fixer.output.recommendations_skipped | length) > 0 %}
      **Recommendations deliberately not taken:**
      {% for item in review_fixer.output.recommendations_skipped %}
      - {{ item }}
      {% endfor %}
      {% endif %}
      {% endif %}
      {% endif %}

      ---

      Merging squashes the PR, deletes the remote and local branch, and removes
      the worktree at `{{ worktree_verify.output.worktree_path }}`.
    options:
      - label: Merge & clean up
        value: merge
        route: merge
      - label: Don't merge (leave the PR open)
        value: stop
        route: stopped
    routes:
      - to: merge

  - name: merge
    description: Merges the pull request and cleans up the branch and worktree, using the merge-pr skill
    model: claude-sonnet-5
    plugins:
      - prs@jason-tools       # merge-pr
    # Pinned to the repository root, NOT the worktree — this step deletes that
    # worktree, and an agent cannot remove the directory it is standing in.
    working_dir: "{{ bootstrap.output.repo_root }}"
    input:
      - ship_draft.output.pr_number
      - bootstrap.output.repo_root
      - bootstrap.output.default_branch
      - worktree_verify.output.branch
    system_prompt: |
      You invoke the `merge-pr` skill and report what it did. The skill owns the
      merge strategy and the cleanup, including which branches and worktrees are
      yours to remove. Follow it as written.

      A human already approved this merge at a gate, or the run is on autopilot
      and there is no gate to ask at — either way, do not ask again. But do stop
      if the repository's own state makes merging unsafe.

      You never resolve merge conflicts. Conflicts mean the branch needs real
      work that a later step owns, and forcing past them here would either
      clobber the base branch or land a resolution nobody verified. Report them
      and stop.
    prompt: |
      Merge pull request #{{ ship_draft.output.pr_number }}, which merges
      `{{ worktree_verify.output.branch }}` into
      `{{ bootstrap.output.default_branch }}`.

      ## First, check that it can merge

      ```
      gh pr view {{ ship_draft.output.pr_number }} --json mergeable,mergeStateStatus
      ```

      If `mergeable` is `CONFLICTING` — or the merge itself fails because the
      branch conflicts with the base — **stop immediately**:

      - Set `blocked_by_conflicts: true` and `merged: false`.
      - Name the conflicting files in `conflict_summary`, along with what the
        base branch changed underneath this one if you can tell. Get the file
        list from `gh pr view --json files` plus
        `git -C {{ bootstrap.output.repo_root }} fetch origin` and
        `git -C {{ bootstrap.output.repo_root }} merge-tree`, or from the failed
        merge's own error output.
      - Do **not** check out the branch, do not resolve anything, do not force
        the merge, and do not delete the branch or the worktree. A later step
        resolves conflicts and sends the PR back here; it needs both intact.

      A `mergeable` of `UNKNOWN` means GitHub is still computing it — wait a few
      seconds and re-read it before deciding.

      ## Otherwise, merge it

      /merge-pr #{{ ship_draft.output.pr_number }}

      Then report what was merged and what was cleaned up. Set
      `blocked_by_conflicts: false` for any outcome that is not a conflict, and
      put the reason in `cleanup_notes` if the merge failed for some other
      cause.
    output:
      merged:
        type: boolean
        description: True when the pull request was squash-merged
      blocked_by_conflicts:
        type: boolean
        description: True only when the merge did not happen because the branch conflicts with the base. False for a successful merge and for every other kind of failure.
      conflict_summary:
        type: string
        description: Which files conflict and what changed underneath the branch, when blocked_by_conflicts is true. Empty otherwise.
      merge_commit:
        type: string
        description: SHA of the squash-merge commit on the default branch
      branch_deleted:
        type: boolean
        description: True when both the remote and local branch were deleted
      worktree_removed:
        type: boolean
        description: True when the worktree was removed
      issue_closed:
        type: boolean
        description: True when the linked issue was closed by the merge
      cleanup_notes:
        type: string
        description: Anything left behind or needing manual attention. Empty when cleanup was complete.
    routes:
      - to: merge_conflicts
        when: "{{ not output.merged and output.blocked_by_conflicts and not workflow.input.autopilot }}"
      # Autopilot resolves conflicts itself, bounded by the same round counter
      # that bounds the coder — without it, a resolver that keeps reporting
      # success would loop against a merge that keeps failing.
      - to: conflict_resolver
        when: "{{ not output.merged and output.blocked_by_conflicts and (conflict_resolver is not defined or conflict_resolver.output.round < workflow.input.max_autopilot_rounds) }}"
      - to: merge_blocked
        when: "{{ not output.merged and output.blocked_by_conflicts }}"
      - to: $end

  - name: merge_conflicts
    type: human_gate
    description: Reached when the branch conflicts with the base, so the human decides whether to have the conflicts resolved and the merge retried, or to stop and deal with the pull request by hand
    prompt: |
      ## Merge blocked by conflicts — issue #{{ issue_resolver.output.issue_number }}

      **{{ issue_resolver.output.issue_title }}**

      {{ ship_draft.output.pr_url }}

      `{{ worktree_verify.output.branch }}` conflicts with
      `{{ bootstrap.output.default_branch }}`, so nothing was merged.

      {% if merge.output.conflict_summary %}
      **Conflicts:**

      {{ merge.output.conflict_summary }}
      {% endif %}
      {% if conflict_resolver is defined %}

      ---

      A resolution was already attempted (round {{ conflict_resolver.output.round }}):

      {{ conflict_resolver.output.summary }}

      {% if (conflict_resolver.output.unresolved | length) > 0 %}
      **Still unresolved:**
      {% for item in conflict_resolver.output.unresolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}
      {% endif %}

      ---

      Resolving merges `{{ bootstrap.output.default_branch }}` into the branch
      in the worktree at `{{ worktree_verify.output.worktree_path }}`, keeps
      both sides' intent, re-runs the repository's checks, pushes, and comes
      back here to merge. It does not force-push and it does not rewrite the
      pull request's history.

      Stopping leaves the pull request open with the conflicts intact, and
      leaves the worktree and branch in place for you to finish by hand.
    options:
      - label: Resolve the conflicts & retry the merge
        value: resolve
        route: conflict_resolver
      - label: Stop here (leave the PR open)
        value: stop
        route: stopped

  - name: conflict_resolver
    description: Merges the base branch into the pull request branch and resolves the conflicts, re-running the repository's own checks before pushing
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: high
    plugins:
      - git@jason-tools       # git-workflow, gh-cli
    working_dir: "{{ worktree_verify.output.worktree_path }}"
    input:
      - planner.output.plan
      - planner.output.verification_commands
      - issue_resolver.output.issue_number
      - issue_resolver.output.issue_title
      - ship_draft.output.pr_number
      - merge.output.conflict_summary
      - bootstrap.output.default_branch
      - worktree_verify.output.worktree_path
      - worktree_verify.output.branch
      - conflict_resolver.output?
    system_prompt: |
      You resolve merge conflicts between a pull request branch and the branch
      it targets. You work only inside the worktree you are given.

      A conflict is two intents meeting, and resolving it means keeping both.
      Deleting the other side's work to make the file parse is the failure mode
      here — it compiles, it merges, and it silently reverts somebody's change.
      When you genuinely cannot tell what the other side intended, say so and
      leave it unresolved rather than guessing.

      Merge the base branch into this branch. Never rebase and never
      force-push: the pull request is already open and under review, and
      rewriting its history detaches the review comments people have left on it.

      Resolving conflicts is not a licence to change behaviour. Do not
      implement anything new, do not refactor what you touch, and do not
      "improve" either side while you are in there.
    prompt: |
      The merge of PR #{{ ship_draft.output.pr_number }} was blocked: branch
      `{{ worktree_verify.output.branch }}` conflicts with
      `{{ bootstrap.output.default_branch }}`.

      {% if merge.output.conflict_summary %}
      **Reported conflicts:**

      {{ merge.output.conflict_summary }}
      {% endif %}

      {% if conflict_resolver is defined and conflict_resolver.output %}
      ## This is attempt {{ conflict_resolver.output.round + 1 }}

      Your last attempt reported:

      {{ conflict_resolver.output.summary }}

      {% if (conflict_resolver.output.unresolved | length) > 0 %}
      It left these unresolved:
      {% for item in conflict_resolver.output.unresolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      The merge still failed, so something you concluded last time was wrong.
      Re-read the actual conflict state rather than trusting that summary.
      {% endif %}

      ## What to do

      1. **Get the current state.** You are in
         `{{ worktree_verify.output.worktree_path }}`.

         ```
         git status --short
         git fetch origin {{ bootstrap.output.default_branch }}
         ```

      2. **Merge the base branch in.**

         ```
         git merge origin/{{ bootstrap.output.default_branch }}
         ```

         If a previous attempt left a merge in progress, finish or abort that
         first — do not start a second one on top of it.

      3. **Resolve every conflict.** For each conflicted file, read both sides
         and work out what each was trying to do. Keep both intents. If the
         base branch renamed, moved or changed the signature of something this
         branch uses, follow that change rather than reinstating the old form.

         The plan this branch implements, for reference on what its side was
         trying to achieve:

         {{ planner.output.plan }}

      4. **Verify.** Conflict resolutions are exactly the kind of change that
         compiles and is still wrong, so run the repository's own checks:
         {% if planner.output.verification_commands | length > 0 %}
         {% for cmd in planner.output.verification_commands %}
         - `{{ cmd }}`
         {% endfor %}
         {% else %}
         Find them in the package manifest, the CI workflows, or the
         contributor guide, and run them.
         {% endif %}

      5. **Commit and push.** Commit the merge and push it to the existing
         branch with a plain `git push` — no force, no lease, no rebase.

      ## Reporting

      Set `resolved: true` only when every conflict is resolved, the checks
      pass, and the merge commit is pushed. If you could not resolve something,
      or a check fails and you cannot see why, set `resolved: false`, list the
      specifics in `unresolved`, and leave the working tree in a state a human
      can pick up. A false green here merges an unverified resolution into the
      default branch.

      Set `round` to {% if conflict_resolver is defined and conflict_resolver.output %}{{ conflict_resolver.output.round + 1 }}{% else %}1{% endif %}.
    output:
      resolved:
        type: boolean
        description: True only when every conflict was resolved, the verification commands passed, and the merge commit was pushed
      round:
        type: number
        description: Which resolution attempt this was, starting at 1
      summary:
        type: string
        description: What conflicted, and how each conflict was resolved
      files_resolved:
        type: array
        description: Paths of the files that had conflicts, relative to the worktree root
      verification:
        type: string
        description: Which verification commands were run after the resolution and what they reported
      unresolved:
        type: array
        description: Conflicts that could not be resolved, each with the reason. Empty when resolved is true.
      pushed:
        type: boolean
        description: True when the merge commit was pushed to the pull request branch
    routes:
      - to: merge
        when: "{{ output.resolved }}"
      - to: merge_conflicts
        when: "{{ not workflow.input.autopilot }}"
      - to: merge_blocked

  - name: merge_blocked
    type: terminate
    status: failed
    input:
      - merge.output.conflict_summary?
      - conflict_resolver.output?
      - ship_draft.output.pr_url?
    reason: >-
      Merge conflicts between the pull request branch and the base could not be
      resolved automatically
      {%- if conflict_resolver is defined %} after {{ conflict_resolver.output.round }} attempt(s):
      {{ conflict_resolver.output.unresolved | join('; ') if (conflict_resolver.output.unresolved | length) > 0 else conflict_resolver.output.summary }}
      {%- else %}: {{ merge.output.conflict_summary }}
      {%- endif %}. The pull request is left open with its worktree and branch
      intact{% if ship_draft is defined %} — {{ ship_draft.output.pr_url }}{% endif %}.

  - name: stopped
    type: terminate
    status: success
    input:
      - merge_conflicts.output?
      - merge_gate.output?
      - implementation_stalled.output?
      - plan_approval.output?
    reason: >-
      Stopped at your request during
      {%- if merge_conflicts is defined and merge_conflicts.output.selected == 'stop' %} the merge-conflict gate — the pull request is left open with its conflicts, worktree and branch intact
      {%- elif merge_gate is defined and merge_gate.output.selected == 'stop' %} the merge gate — the pull request is left open
      {%- elif implementation_stalled is defined and implementation_stalled.output.selected == 'stop' %} the implementation checkpoint — changes are uncommitted in the worktree
      {%- elif plan_approval is defined and plan_approval.output.selected == 'stop' %} plan approval — nothing was written to the repository
      {%- else %} the open questions — nothing was written to the repository
      {%- endif %}.

output:
  issue_number: "{{ issue_resolver.output.issue_number if issue_resolver is defined else 0 }}"
  issue_url: "{{ issue_resolver.output.issue_url if issue_resolver is defined else '' }}"
  autopilot: "{{ workflow.input.autopilot }}"
  worktree_path: "{{ worktree_verify.output.worktree_path if worktree_verify is defined else '' }}"
  branch: "{{ worktree_verify.output.branch if worktree_verify is defined else '' }}"
  plan: "{{ planner.output.plan if planner is defined else '' }}"
  open_questions: "{{ planner.output.open_questions if planner is defined else [] }}"
  open_questions_answered: "{{ ask_questions.output.answered_any if ask_questions is defined else false }}"
  open_questions_answers: "{{ ask_questions.output.answers | tojson if ask_questions is defined else '{}' }}"
  open_questions_transcript: "{{ ask_questions.output.transcript if ask_questions is defined else '' }}"
  plan_approved: "{{ plan_approval.output.selected == 'approve' if plan_approval is defined else false }}"
  implementation_complete: "{{ coder.output.complete if coder is defined else false }}"
  implementation_rounds: "{{ coder.output.round if coder is defined else 0 }}"
  files_changed: "{{ coder.output.files_changed if coder is defined else [] }}"
  pr_url: "{{ ship_draft.output.pr_url if ship_draft is defined else '' }}"
  pr_number: "{{ ship_draft.output.pr_number if ship_draft is defined else 0 }}"
  review_blocking_found: "{{ review.output.blocking | length if review is defined else 0 }}"
  review_recommendations_found: "{{ review.output.recommendations | length if review is defined else 0 }}"
  review_summary: "{{ review.output.summary if review is defined else '' }}"
  review_merge_readiness: "{{ review.output.merge_readiness if review is defined else '' }}"
  review_fixes_applied: "{{ review_fixer.output.summary if review_fixer is defined else '' }}"
  review_all_resolved: "{{ review_fixer.output.all_resolved if review_fixer is defined else true }}"
  unresolved_findings: "{{ review_fixer.output.unresolved if review_fixer is defined else [] }}"
  merged: "{{ merge.output.merged if merge is defined else false }}"
  merge_commit: "{{ merge.output.merge_commit if merge is defined else '' }}"
  merge_blocked_by_conflicts: "{{ merge.output.blocked_by_conflicts if merge is defined else false }}"
  conflicts_resolved: "{{ conflict_resolver.output.resolved if conflict_resolver is defined else false }}"
  conflict_resolution_rounds: "{{ conflict_resolver.output.round if conflict_resolver is defined else 0 }}"
  unresolved_conflicts: "{{ conflict_resolver.output.unresolved if conflict_resolver is defined else [] }}"
  worktree_removed: "{{ merge.output.worktree_removed if merge is defined else false }}"
  cleanup_notes: "{{ merge.output.cleanup_notes if merge is defined else '' }}"
  iterations: "{{ context.iteration }}"
