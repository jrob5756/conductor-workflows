# PR Review Workflow
#
# Reviews someone else's pull request and posts the findings you approve,
# orchestrating the skills you already run by hand rather than reimplementing
# their logic:
#
#   bootstrap (script)       resolve repo root / gh identity / worktrees dir
#     ↓
#   pr_resolver              read the pull request from GitHub, and report the
#     ↓                      repository and gh login it actually resolved
#   author_gate ────────────→ only when the PR is yours: review anyway / stop
#     ↓
#   pr_worktree (script)     fetch pull/N/head, cut a throwaway worktree
#     ↓
#   prior_review (script) ──→ compare against your previous review before either path
#   unchanged_gate          continue or exit when unchanged; unknown history also asks
#   select_review           choose the follow-up path when earlier feedback exists
#     ↓
#   concept_review           does the proposed intent belong in this repository?
#   concept_gate ───────────→ only when it found blocking gaps:
#     ↓                        proceed / post the concept findings and stop /
#     ↓                        stop without posting
#   ci_start (script)        start or approve Actions for the reviewed head
#   code_review              [code-review skill] report only, change nothing
#   ci_wait (script)         wait for CI; problems join the findings as BLOCKING
#     ↓
#   build_questions (script) findings → strictly shaped question objects
#     ↓
#   triage (questions)       per finding: post as-is / reseverity / reword /
#     ↓                      drop
#   apply_triage (script)    drop what you dropped, before a model sees it
#     ↓
#   comment_writer           [humanizer skill] final wording, inline anchors
#     ↓
#   post_review (script)     one review, event=COMMENT, inline where it can
#     ↓
#   cleanup (script)         remove the worktree and its branch
#     ↓
#   $end
#   review_clear_gate offers approval when no findings remain; LGTM leads to a separate merge gate.
#
# The follow-up path — taken when `prior_review` finds your earlier comments:
#
#   followup_review              did they do what you asked? one status per
#     ↓                          point: addressed / partly / not / moot /
#     ↓                          unclear, decided from the code
#   build_followup_questions     the outstanding points → question objects
#     ↓
#   followup_triage (questions)  per point: raise it again as-is / reseverity
#     ↓                          / reword / let it go
#   apply_followup_triage        drop what you let go, before a model sees it
#     ↓
#   followup_gate ──────────────→ approve / post the outstanding points /
#     ↓                           post nothing
#   followup_comment_writer      [humanizer skill] wording, inline anchors
#     ↓
#   post_followup_review         one review, event=COMMENT
#     ↓
#   cleanup
#
#   followup_clear_gate replaces `followup_gate` when nothing is left to
#   raise — because every point landed, or because you let the rest go at
#   triage. It offers the approval, a note you write yourself, and the escape
#   hatch back to a full first-pass review.
#
# The second visit
#   A pull request you have already reviewed is not a pull request you have
#   not. Running the concept and code passes again re-derives the points you
#   made last time, phrases them differently, and posts them a second time
#   under a fresh review — which reads to the author as if nobody opened the
#   replies they wrote. The expensive part is wasted and the cheap part is
#   insulting.
#
#   So `prior_review` asks GitHub, not a model, whether you have commented
#   here before: a submitted review, an inline comment, or a conversation
#   comment authored by any login `gh` is signed in as on this host. It is a
#   script because the branch has to be decided by a fact rather than by a
#   model recognising its own handiwork, and because the same call collects
#   the replies your comments drew, which is what the follow-up reads.
#
#   Identity there is a set rather than a name, because one human routinely
#   has more than one GitHub account and `gh` keeps them all, active one at a
#   time. Matched against the active login alone, a review left under your
#   other account is invisible, and the run takes the first-pass branch and
#   posts a second opinion on top of your own. The follow-up still publishes
#   as the active account, so the gates say so when the two differ.
#
#   `followup_review` then answers one question per point — did the code
#   change in the respect you raised — and refuses to answer it from the
#   conversation. "Fixed, thanks" is a claim; the file is the evidence. It
#   raises nothing new, because a finding nobody made before does not belong
#   in a follow-up: posted there it masquerades as something the author
#   already ignored. If you want fresh findings, `followup_clear_gate` routes
#   you into the full review.
#
#   Approval and merging require separate decisions, with fresh readiness shown after approval.
#
#   `build_followup_questions` reconciles what came back against what went in.
#   A point the analysis simply failed to mention would otherwise vanish, and
#   the gate downstream would go on to tell you everything was settled — so
#   any prior comment no entry cites is rebuilt from its own text and asked as
#   `unclear`. Nothing reaches a terminal state without a human having seen it.
#
#   `followup_comment_writer` is handed no summary and no account of what
#   changed, only the points that survived triage and the ones already
#   settled. Both of those narratives are written before you decide anything,
#   so either could name a point you went on to drop, and a dropped point
#   reaching the author through a summary line is no better than one reaching
#   them through a finding. The gates show you those narratives, because you
#   are the one deciding; the model that writes the public text does not get
#   them.
#
# Targeting
#   The reference may name a repository — `owner/repo#123`, or a full URL —
#   but the worktree and the posted review both target the repository you are
#   standing in. `pr_resolver` therefore reports the repository it actually
#   read, and the run stops when the two disagree. Without that check, passing
#   a reference from elsewhere reviews one pull request and comments on
#   another that happens to share its number.
#
#   For the same reason `pr_resolver` reports the `gh` login it ended up
#   authenticated as rather than the one captured at startup: it is allowed to
#   switch accounts to read a private pull request, and the own-PR gate is
#   worthless if it compares the author against a login that is no longer in
#   effect.
#
# Order
#   The concept review runs first because it is the cheap question. Deciding a
#   change should not exist at all after seven code specialists have picked
#   over its error handling wastes the specialists and, worse, anchors the
#   conversation on line-level detail that was never the point.
#
# Review and posting are separate
#   `code_review` reports and never edits, `comment_writer` words and never
#   judges, `post_review` publishes and never writes. An agent that reviews and
#   publishes in one pass grades its own work: it stops writing findings down
#   once it has phrased them, so whatever it dropped is invisible by the time
#   anyone reads the review. Splitting them forces every finding through a
#   written handoff, which is also what makes the triage list trustworthy.
#
#   `apply_triage` sits between the decision and the wording for the same
#   reason. A model handed every finding and told which to ignore can still
#   leak a dropped one into a summary line, and the person whose pull request
#   it is cannot tell that happened. Removing them first makes it impossible
#   rather than discouraged.
#
# Triage
#   Every finding is put to you individually, prefixed BLOCKING or RECOMMENDED.
#   Four outcomes come from three choices plus the write-your-own path, because
#   a choice reading "reword it" would record that label and no wording —
#   choices carry no follow-up prompt. The third choice is the severity the
#   finding does not currently carry, so promoting or demoting one is a single
#   tap and the counts the review is written from follow the decision rather
#   than the reviewer's ranking. Skipping a question posts it as-is, so
#   "skip all remaining" means "post the rest verbatim", which is the fast path
#   once you have read the first few. Aborting posts nothing.
#
#   Nits never reach you. `code-review` ranks them separately and they are not
#   worth a decision each.
#
#   The follow-up triage works identically and shares the same choices, one
#   difference aside: it drops nothing on severity. A nit on a first pass is
#   noise nobody has seen. A nit you already raised in public is a point the
#   author read and did not act on, and withholding the second mention lets
#   them read agreement into your silence — so it still gets a decision.
#
# Inline comments
#   GitHub rejects an entire review with a 422 if one comment names a line
#   outside the diff, so a single bad anchor loses every comment. `post_review`
#   parses the diff from the worktree the review actually ran against, keeps
#   the comments it can anchor, and folds the rest into the review body. If the
#   POST is refused outright it retries once with everything in the body: a
#   review that reads slightly worse beats a review that was never posted. It
#   never retries a failure that might have been accepted, such as a timeout,
#   because that would post a second review to a real person's pull request.
#
# Working directories
#   Steps with no `working_dir` run in the directory you invoked
#   `conductor run` from, so the workflow targets whatever repository you are
#   standing in. The two review agents pin `working_dir` to the worktree, which
#   is the only reason it exists. `cleanup` deliberately does not, mirroring
#   the manual step of leaving a worktree before deleting it.
#
#   The scripts resolve through `{{ workflow.dir }}`, so they are found whether
#   the workflow is run by path or through a registry, from any repository.
#
# Only the merge-readiness recheck loops; reviews and CI are not repeated by that gate.
#
# Plugins
#   Each step declares the plugin whose skill it drives, rather than the
#   workflow enabling skill discovery and excluding everything it does not
#   want. An allowlist cannot leak: installing a new plugin later has no effect
#   on this run, where a blocklist silently grew.
#
#   Declaring the plugin also loads what the skill depends on. `code-review`
#   dispatches to the seven specialist subagents `prs` ships in `agents/`;
#   discovering the skill alone leaves it calling agents that are not there.
#
#     pr_resolver                     git@jason-tools      gh-cli
#     code_review                     prs@jason-tools      code-review
#     comment_writer                  writing@jason-tools  humanizer
#     followup_comment_writer         writing@jason-tools  humanizer
#
#   `followup_review` declares none. It reads files and runs git, both of
#   which it has without a plugin, and every review skill it could reach would
#   push it toward finding something new — which is the one thing a follow-up
#   must not do.
#
#   Entries are `plugin@marketplace`, so they resolve against the installed
#   `jason-tools` marketplace. To run this against a different marketplace,
#   rewrite the suffixes, or declare `runtime.plugin_sources` to fetch one by
#   git URL and make the workflow self-installing.
#
#   Nothing else is loaded. `merge-pr` in particular is absent, so a review
#   agent cannot merge the thing it is reviewing.
#
# Usage:
#   Run it from the repository the pull request belongs to.
#
#     conductor run workflows/pr-review/workflow.yaml --input pr=123
#
#   The reference can also be a URL or an `owner/repo#123` reference:
#     conductor run workflows/pr-review/workflow.yaml \
#       --input pr="https://github.com/owner/repo/pull/123"
#
#   Run it a second time on the same pull request and it verifies the review
#   it posted the first time instead of writing another one.
#
# Requires:
#   - git and gh (GitHub CLI) on PATH, with `gh auth status` passing
#   - python3 on PATH (used by every script step)
#   - The plugins listed above installed from the `jason-tools` marketplace

workflow:
  name: pr-review
  description: Reviews repository fit before implementation quality, asks before repeating an unchanged review, starts and waits for PR CI alongside the code review, and includes CI problems as blocking findings for triage. Posts only the feedback you approve. Follow-up runs check earlier feedback instead of repeating a full review. After posting LGTM, shows current merge blockers and asks separately whether to squash-merge.
  version: "1.3.0"
  entry_point: bootstrap

  runtime:
    provider: copilot
    default_model: claude-sonnet-5
    max_session_seconds: 3600
    checkpoint:
      every_agent: true   # human-gated run — keep it resumable after an
      keep_last: 5        # external interruption

  input:
    pr:
      type: string
      required: true
      description: "Pull request to review — a number (`123`), a full URL, or `owner/repo#123`. It must already exist; this workflow never opens one."

  context:
    mode: explicit

  limits:
    max_iterations: 80

agents:
  # ---------------------------------------------------------------------------
  # Setup
  # ---------------------------------------------------------------------------

  - name: bootstrap
    description: Resolves the target repository and your GitHub identity from the directory the workflow was invoked in
    type: script
    command: python3
    timeout: 120
    args:
      - "{{ workflow.dir }}/scripts/bootstrap.py"
    routes:
      - to: bootstrap_failed
        when: "{{ not output.ok }}"
      - to: pr_resolver

  - name: bootstrap_failed
    type: terminate
    status: failed
    input:
      - bootstrap.output.error
    reason: "{{ bootstrap.output.error }}"

  - name: pr_resolver
    description: Loads the pull request under review from GitHub
    model: claude-sonnet-5
    reasoning:
      effort: medium
    plugins:
      - git@jason-tools       # gh-cli — account switching on a 404 or 403
    input:
      - workflow.input.pr
      - bootstrap.output.name_with_owner
      - bootstrap.output.gh_user
      - bootstrap.output.default_branch
    system_prompt: |
      You resolve the unit of work for a review pipeline: you read an existing
      pull request and report it. You never create, edit, close, approve or
      merge a pull request, you never comment on one, and you never touch git
      branches or working trees.

      Use the `gh` CLI for every GitHub operation. If a `gh` call fails with a
      404 or a permission error, run `gh auth status`, try `gh auth switch`,
      and retry once before reporting failure.
    prompt: |
      Repository: `{{ bootstrap.output.name_with_owner }}`
      Default branch: `{{ bootstrap.output.default_branch }}`

      ## Load pull request `{{ workflow.input.pr }}`

      The reference may be a bare number, a full URL, or `owner/repo#123`.
      Normalise it, then read the pull request:

      ```
      gh pr view <number> -R <owner>/<repo> \
        --json number,title,author,baseRefName,state,isDraft,isCrossRepository,url
      ```

      Report the repository you actually read in `name_with_owner`, as
      `owner/repo`. If the reference named one, that is the one you report,
      even when it is not the repository above — a later step compares the two
      and stops rather than reviewing the wrong pull request.

      Report the GitHub login the `gh` CLI is authenticated as in `gh_user`,
      read fresh with `gh api user --jq .login` **after** any account switch
      you had to make. A later step compares it against the author to decide
      whether you are reviewing your own work, and a stale login there means
      that check silently passes.

      If it cannot be read at all — it does not exist, or you lack access — set
      `found: false` and put the exact `gh` error in `notes`. Do not invent a
      pull request and do not open one.

      A closed, merged or draft pull request is not a failure. Set
      `found: true` and say so plainly in `notes`; the human decides whether
      reviewing it is still worth doing.

      Report it exactly as GitHub returned it. Do not paraphrase the title or
      body, and do not summarise or judge the change — that is the reviewers'
      job, and a summary here would prime them.
    output:
      found:
        type: boolean
        description: True when the pull request was read from GitHub. False when it does not exist or is not accessible.
      pr_number:
        type: number
        description: The pull request number
      pr_title:
        type: string
        description: The title, verbatim from GitHub
      pr_url:
        type: string
        description: Full URL of the pull request
      name_with_owner:
        type: string
        description: The repository this pull request actually belongs to, as owner/repo, taken from the reference you were given rather than assumed
      gh_user:
        type: string
        description: The GitHub login the gh CLI is authenticated as, read after any account switch
      author:
        type: string
        description: The GitHub login of the author, with no @ prefix
      base_ref:
        type: string
        description: The branch this pull request merges into
      state:
        type: string
        description: One of OPEN, CLOSED, MERGED
      is_draft:
        type: boolean
        description: True when the pull request is still a draft
      notes:
        type: string
        description: Anything the human should know before the review starts, such as the pull request being closed, merged or a draft. Empty when there is nothing to flag.
    routes:
      - to: pr_resolver_failed
        when: "{{ not output.found }}"
      - to: wrong_repository
        when: "{{ output.name_with_owner | lower != bootstrap.output.name_with_owner | lower }}"
      - to: author_gate
        when: "{{ output.author | lower == output.gh_user | lower or output.author | lower in bootstrap.output.gh_logins | map('lower') | list }}"
      - to: pr_worktree

  - name: wrong_repository
    type: terminate
    status: failed
    input:
      - workflow.input.pr
      - pr_resolver.output.name_with_owner
      - bootstrap.output.name_with_owner
    reason: "'{{ workflow.input.pr }}' belongs to {{ pr_resolver.output.name_with_owner }}, but this run started in {{ bootstrap.output.name_with_owner }}. The worktree and the posted review both target the repository you are standing in, so continuing would review one pull request and comment on another. Run this from {{ pr_resolver.output.name_with_owner }} instead."

  - name: pr_resolver_failed
    type: terminate
    status: failed
    input:
      - workflow.input.pr
      - pr_resolver.output.notes
    reason: "Pull request '{{ workflow.input.pr }}' could not be read from GitHub. {{ pr_resolver.output.notes }}"

  - name: author_gate
    type: human_gate
    description: Warns that you are about to review your own pull request, which posts comments rather than fixing anything
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - bootstrap.output.gh_logins
    prompt: |
      ## You are the author of #{{ pr_resolver.output.pr_number }}

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      The author is `{{ pr_resolver.output.author }}` and `gh` is
      authenticated as `{{ pr_resolver.output.gh_user }}`.
      {% if pr_resolver.output.author | lower != pr_resolver.output.gh_user | lower %}

      > Those are different logins, but both are accounts you are signed in
      > as, so this is still your own pull request. Anything posted here goes
      > up as `{{ pr_resolver.output.gh_user }}`.
      {% endif %}

      This workflow reviews and comments. It does not apply fixes, so on your
      own pull request it will post a review to yourself rather than change
      anything.

      That is still useful as a written record of what needs doing. If you
      wanted the findings applied instead, stop here and run the `code-review`
      skill directly.
    options:
      - label: Review it anyway and post the comments
        value: continue
        route: pr_worktree
      - label: Stop here
        value: stop
        route: stopped

  - name: pr_worktree
    description: Fetches the pull request head and checks it out into a throwaway worktree, so the review reads the code rather than a diff in a prompt
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.repo_root
      - bootstrap.output.worktrees_dir
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_resolver.output.base_ref
    args:
      - "{{ workflow.dir }}/scripts/pr_worktree.py"
      - "{{ bootstrap.output.repo_root }}"
      - "{{ bootstrap.output.worktrees_dir }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.base_ref }}"
    routes:
      - to: worktree_failed
        when: "{{ not output.ok }}"
      - to: prior_review

  - name: worktree_failed
    type: terminate
    status: failed
    input:
      - pr_worktree.output.error
    reason: "{{ pr_worktree.output.error }}"

  - name: prior_review
    description: Reads back everything you have already said on this pull request under any account you are signed in as, so a second visit checks your last review rather than writing another one
    type: script
    command: python3
    timeout: 180
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_resolver.output.gh_user
      - bootstrap.output.gh_logins
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
    args:
      - "{{ workflow.dir }}/scripts/prior_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_resolver.output.gh_user }}"
      - "{{ bootstrap.output.gh_logins | join(',') }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: unchanged_gate
        when: "{{ output.change_status in ['unchanged', 'unknown'] }}"
      - to: select_review

  - name: unchanged_gate
    type: human_gate
    description: Asks before reviewing unchanged content or content whose earlier baseline is unavailable
    input:
      - pr_resolver.output.pr_url
      - prior_review.output.change_status
      - prior_review.output.change_summary
      - prior_review.output.comparison_commit
      - pr_worktree.output.head_sha
    prompt: |
      {% if prior_review.output.change_status == 'unchanged' %}
      ## No code changes since your previous review
      {% else %}
      ## Changes since your previous review could not be determined
      {% endif %}

      {{ pr_resolver.output.pr_url }}

      {{ prior_review.output.change_summary }}

      Previous review commit: `{{ prior_review.output.comparison_commit or 'unavailable' }}`
      Current review commit: `{{ pr_worktree.output.head_sha }}`

      Neither review nor CI has started. Continue anyway, or exit without posting?
    options:
      - label: Continue reviewing anyway
        value: continue
        route: select_review
      - label: Exit without reviewing
        value: stop
        route: cleanup

  - name: select_review
    type: set
    input:
      - prior_review.output.has_prior_review
    values:
      followup: "{{ prior_review.output.has_prior_review }}"
    routes:
      - to: followup_review
        when: "{{ output.followup }}"
      - to: concept_review

  # ---------------------------------------------------------------------------
  # Concept review — the cheap question, asked first
  # ---------------------------------------------------------------------------

  - name: concept_review
    description: Judges whether the proposed goal belongs in the repository, assuming a correct implementation
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: high
    plugins: []
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.base_ref
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
    system_prompt: |
      Assess whether the intent of this pull request logically belongs in this
      repository. The question is: if this proposal were implemented perfectly,
      would it be a sensible addition to this project?

      Establish the repository's purpose, intended users, supported use cases,
      explicit non-goals, and ownership boundaries from its README, contributor
      guidance and design documentation. Read the PR description and linked
      issue to understand the actual problem and intended outcome. Skim the
      diff only to establish what capability or policy the PR proposes.

      Do not invoke a broader review skill. This is a product-scope and
      repository-fit assessment, not an implementation or integration audit.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not comment on GitHub. A later
      step publishes what a human approves, and it can only publish what you
      actually wrote down.

      Exclude code bugs, missing wiring, API correctness, edge cases, tests,
      error handling, security defects, style, naming, documentation coverage
      and refactoring suggestions. Those belong exclusively to code review.
      A defect fixable without changing the proposed goal is not a conceptual
      finding. Do not disguise an implementation defect as a "logical gap."
    prompt: |
      Review pull request #{{ pr_resolver.output.pr_number }} as a proposed
      change to this project.

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out again.
      The diff against the base branch is:

      ```
      git diff {{ pr_worktree.output.remote }}/{{ pr_resolver.output.base_ref }}...HEAD
      ```

      ## What to report

      Explain the problem the PR intends to solve, who needs it, and why that
      responsibility belongs here rather than in another project, plugin or
      layer. Assess whether the proposed behavior coheres with this project's
      documented purpose and product model.

      Examples of valid objections: an unrelated feature in a focused library,
      a use case the project explicitly excludes, or moving responsibility
      into a component whose documented role contradicts it. Cite concrete
      repository evidence, not personal taste or hypothetical future costs.

      Examples to exclude: a missing registration, an unhandled exception,
      incomplete tests, or an implementation that fails its otherwise sound
      goal. The code review owns all of those.

      New functionality is not out of scope merely because it is new. Do not
      invent requirements or infer a non-goal from the absence of a feature.
      If intent is unclear, record a product question rather than a code finding.

      If there are no material gaps, say so and return empty lists. Do not
      manufacture findings to look thorough — a clean concept review is a
      real result, and it is the one that lets the code review start.
    output:
      verdict:
        type: string
        description: Exactly one of good_addition, good_addition_with_changes, needs_rethinking, not_a_good_fit
      summary:
        type: string
        description: The core change in a few sentences — the problem, the audience, the approach and the expected value
      how_surfaced:
        type: string
        description: Intended audience and use case for the proposed capability, not an audit of UI or API wiring
      project_fit:
        type: string
        description: How the proposed goal aligns with the repository's documented purpose, non-goals and responsibility boundaries
      blocking:
        type: array
        description: Material conflicts between the proposed intent and repository scope or product model, with evidence and a recommendation about scope. Never code defects. Empty when nothing blocks.
      important:
        type: array
        description: Nonblocking concerns about the proposed scope or product responsibility, supported by repository evidence. Never missing implementation or integration work.
      open_questions:
        type: array
        description: Missing intent or product context that prevents a confident assessment. Empty when there are none.
      strengths:
        type: array
        description: What is coherent, valuable or well aligned with the project
    routes:
      - to: concept_gate
        when: "{{ (output.blocking | length) > 0 or output.verdict in ['needs_rethinking', 'not_a_good_fit'] }}"
      - to: ci_start

  - name: concept_gate
    type: human_gate
    description: The stop-or-continue checkpoint — the concept review found something that questions whether the change should proceed at all
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.notes
      - concept_review.output.verdict
      - concept_review.output.summary
      - concept_review.output.how_surfaced
      - concept_review.output.project_fit
      - concept_review.output.strengths
      - concept_review.output.blocking
      - concept_review.output.important
      - concept_review.output.open_questions
    prompt: |
      ## Concept review — #{{ pr_resolver.output.pr_number }}

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. A review still posts to it.
      {% endif %}
      {% if pr_resolver.output.notes %}

      > {{ pr_resolver.output.notes }}
      {% endif %}

      **Verdict:** `{{ concept_review.output.verdict }}`

      {{ concept_review.output.summary }}

      {% if (concept_review.output.blocking | length) > 0 %}
      ### Blocking

      {% for item in concept_review.output.blocking %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.important | length) > 0 %}
      ### Important

      {% for item in concept_review.output.important %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.open_questions | length) > 0 %}
      ### Open questions

      {% for item in concept_review.output.open_questions %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}

      ### Project fit

      {{ concept_review.output.project_fit }}

      ### How it reaches people

      {{ concept_review.output.how_surfaced }}
      {% if (concept_review.output.strengths | length) > 0 %}

      ### What works

      {% for item in concept_review.output.strengths %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ---

      Continuing runs the full code review and puts every finding to you
      individually before anything is posted.

      Posting publishes everything above as a review comment and stops,
      without the code review ever running. That is the right call when the
      change needs rethinking: line-level comments on code that may not
      survive the conversation waste everyone's time.
    options:
      - label: Continue to the code review
        value: continue
        route: ci_start
      - label: Post these concept findings and stop
        value: post_concept
        route: comment_writer
      - label: Stop without posting anything
        value: stop
        route: cleanup

  # ---------------------------------------------------------------------------
  # Code review
  # ---------------------------------------------------------------------------

  - name: ci_start
    description: Approves or starts the PR's Actions runs for the exact head being reviewed
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
    args:
      - "{{ workflow.dir }}/scripts/ci.py"
      - start
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
    routes:
      - to: code_review

  - name: code_review
    description: Runs the specialist code review and reports what it found, without touching the code or GitHub
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: high
    plugins:
      # `code-review` dispatches to the seven specialist subagents the plugin
      # ships in `agents/` (code-reviewer, pr-test-analyzer, silent-failure-
      # hunter, type-design-analyzer, comment-analyzer, code-simplifier,
      # dead-code-finder). Loading the plugin brings the skill AND those
      # subagents; loading the skill alone leaves it dispatching to agents that
      # do not exist.
      - prs@jason-tools       # code-review
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.base_ref
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
    system_prompt: |
      You invoke the `code-review` skill and report its findings. The skill
      owns which specialists run and how findings are ranked — follow it as
      written for everything up to and including the aggregated summary.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not create a GitHub review or
      comment. The skill's post-review section does not apply here: a later
      step publishes exactly what a human approves.

      A finding you phrase vaguely is one the human cannot judge and the
      writer cannot word. Every finding must stand on its own — someone
      reading only that entry should know what is wrong, where, and what to
      do about it.
    prompt: |
      Review pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}**.

      /code-review #{{ pr_resolver.output.pr_number }}

      Report the findings. Do not apply any fixes and do not post anything.

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out
      again. The diff under review is:

      ```
      git diff {{ pr_worktree.output.remote }}/{{ pr_resolver.output.base_ref }}...HEAD
      ```

      ## How to report findings

      Return one entry per finding in `findings`. Each entry is an object:

      ```json
      {
        "severity": "BLOCKING",
        "path": "src/thing.ts",
        "line": 42,
        "title": "Token expiry is never checked",
        "body": "What is wrong and why it matters, in enough detail to act on without re-reviewing.",
        "suggestion": "The concrete change, as code when a short snippet says it best."
      }
      ```

      - `severity` is `BLOCKING` or `RECOMMENDED`. Nothing else. **Leave nits
        out entirely** — they are not worth a human decision each.
      - `path` is repository-relative, exactly as it appears in the diff.
      - `line` is the line **in the new version of the file**, and it must be
        a line this pull request actually adds or touches. A comment anchored
        outside the diff cannot be attached inline, so a wrong line quietly
        demotes the finding into the review body. Omit `line` rather than
        guess.
      - `body` is prose for the pull request author, not a note to yourself.
        Do not reference the specialist that found it.

      Findings with no single location — an architectural objection, a missing
      test suite — belong in `findings` too, with `path` and `line` omitted.

      Finding nothing is a legitimate result. Return an empty list rather than
      padding it.
    output:
      findings:
        type: array
        description: 'One object per finding: {"severity": "BLOCKING"|"RECOMMENDED", "path": "...", "line": 42, "title": "...", "body": "...", "suggestion": "..."}. Nits excluded. `path` and `line` omitted when the finding has no single location. Empty when the review found nothing.'
      summary:
        type: string
        description: The review's overall assessment of the pull request, for the top of the posted review
      merge_readiness:
        type: string
        description: One of ready, needs_work, do_not_merge
    routes:
      - to: ci_wait

  - name: ci_wait
    description: Waits for CI and records failures, missing runs or unverifiable results as blocking feedback
    type: script
    command: python3
    timeout: 2100
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - ci_start.output
    args:
      - "{{ workflow.dir }}/scripts/ci.py"
      - wait
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
    stdin: "{{ ci_start.output | tojson }}"
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: build_questions

  - name: build_questions
    description: Turns the findings into strictly shaped question objects, so a stray key from the reviewer cannot abort the triage node after the review has been paid for
    type: script
    command: python3
    timeout: 60
    input:
      - code_review.output.findings
      - ci_wait.output.findings
    args:
      - "{{ workflow.dir }}/scripts/build_questions.py"
    stdin: "{{ (code_review.output.findings + ci_wait.output.findings) | tojson }}"
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: review_clear_gate
        when: "{{ output.question_count == 0 }}"
      - to: triage

  - name: triage
    type: questions
    description: Puts every finding to you individually inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: build_questions.output.questions
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.notes
      - build_questions.output.question_count
      - build_questions.output.blocking_count
      - build_questions.output.recommended_count
    prompt: |
      ## Findings on #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. Anything you approve still posts to it.
      {% endif %}
      {% if pr_resolver.output.notes %}

      > {{ pr_resolver.output.notes }}
      {% endif %}

      The code review found {{ build_questions.output.blocking_count }} blocking
      and {{ build_questions.output.recommended_count }} recommended
      finding{{ 's' if build_questions.output.question_count != 1 else '' }}.
      Nothing has been posted to the pull request yet.

      Decide each one. There are four ways to answer:

      - **Post as-is** keeps the reviewer's wording and its severity.
      - **Post as BLOCKING** / **Post as RECOMMENDED** posts the same wording
        at the other severity, so you can promote something the reviewer
        under-rated or demote something that should not hold up a merge. Only
        the severity the finding does not already carry is offered.
      - **Do not post** drops the finding entirely.
      - **Write your own** posts the finding with your note applied, so use it
        to soften the tone, add context the reviewer lacked, or narrow the ask.

      Skipping a question posts it as-is, which makes "skip all remaining" a
      quick way to accept the rest once you have read the first few. Aborting
      posts nothing at all.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: cleanup
    routes:
      - to: apply_triage

  - name: apply_triage
    description: Applies your decisions to the findings before any model sees them, so a finding you dropped cannot leak into the review
    type: script
    command: python3
    timeout: 60
    input:
      - build_questions.output.findings
      - triage.output.items
    args:
      - "{{ workflow.dir }}/scripts/apply_triage.py"
    stdin: '{"findings": {{ build_questions.output.findings | tojson }}, "items": {{ triage.output.items | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: review_clear_gate
        when: "{{ output.approved_count == 0 }}"
      - to: comment_writer

  - name: review_clear_gate
    type: human_gate
    description: Offers LGTM when the full review has no findings left to post
    input:
      - pr_resolver.output.pr_url
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - ci_wait.output.summary
      - apply_triage.output.dropped_count?
    prompt: |
      ## No findings left to post

      {{ pr_resolver.output.pr_url }}

      {% if apply_triage is defined %}
      You dropped all {{ apply_triage.output.dropped_count }} findings at triage.
      This does not mean the original findings or CI failures were resolved.
      {% else %}
      The code review and CI produced no blocking or recommended findings.
      {% endif %}

      **CI:** {{ ci_wait.output.summary }}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      GitHub will refuse an approval from the PR author.
      {% endif %}

      Approving posts `LGTM, thanks for contributing!`. Afterwards, a separate
      gate shows current merge readiness and asks whether to merge.
    options:
      - label: 'Approve - "LGTM, thanks for contributing!"'
        value: approve
        route: post_approval
      - label: Post nothing
        value: stop
        route: cleanup

  # ---------------------------------------------------------------------------
  # Wording and posting
  # ---------------------------------------------------------------------------

  - name: comment_writer
    description: Words the approved findings for the author and maps them to inline anchors, running every comment through the humanizer
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium
    plugins:
      - writing@jason-tools   # humanizer
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - concept_gate.output.selected?
      - concept_review.output.summary?
      - concept_review.output.verdict?
      - concept_review.output.how_surfaced?
      - concept_review.output.project_fit?
      - concept_review.output.strengths?
      - concept_review.output.blocking?
      - concept_review.output.important?
      - concept_review.output.open_questions?
      - apply_triage.output.approved?
      - apply_triage.output.approved_count?
      - apply_triage.output.blocking_count?
      - apply_triage.output.recommended_count?
    system_prompt: |
      You write the review that gets posted to a pull request. You are the
      last step before it is public, and you are writing to its author.

      You decide nothing. Which findings are posted was settled by a human,
      one at a time, and everything they dropped was removed before you were
      called — what you are given is exactly what goes out. Do not add a
      finding nobody raised, do not merge two into one, and do not soften a
      blocking finding into a suggestion.

      The severity on each finding is theirs too, not the reviewer's: they can
      promote or demote one at triage, so a finding may read more or less
      severely than its label. The label wins. Write it at the weight it
      carries and let the wording follow.

      Your job is wording and placement.

      Every comment goes through the `humanizer` skill before you return it.
      Apply it properly — draft, audit what still reads as machine-generated,
      then revise. Do not just delete em dashes and call it done.

      Write like a competent colleague who read the code: direct about what is
      wrong, specific about where, and free of ceremony. No preamble, no
      "great work overall", no emoji, no praise sandwich. The author is a peer
      and their time is worth more than the padding.
    prompt: |
      {% if concept_gate is defined and concept_gate.output.selected == 'post_concept' %}
      Write a review of pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}** — from a concept review. The human
      chose to publish these findings and stop, so no code review ran and there
      are no line-level findings to place. Return an empty `inline_comments`.

      The review body is the whole artefact. Lead with what the change is and
      the verdict, then the findings.

      **Verdict:** `{{ concept_review.output.verdict }}`

      **The change:** {{ concept_review.output.summary }}

      **How it reaches people:** {{ concept_review.output.how_surfaced }}

      **Project fit:** {{ concept_review.output.project_fit }}
      {% if (concept_review.output.strengths | length) > 0 %}

      ## What works

      Open with these. On a change that may need rethinking, what to keep is
      as useful to the author as what to fix, and it is the difference between
      a review they can act on and one they argue with.

      {% for item in concept_review.output.strengths %}
      - {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.blocking | length) > 0 %}
      ## Blocking

      {% for item in concept_review.output.blocking %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.important | length) > 0 %}
      ## Important

      {% for item in concept_review.output.important %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.open_questions | length) > 0 %}
      ## Open questions

      Put these to the author as questions, not as findings. They are things
      the review could not determine, not things the author got wrong.

      {% for item in concept_review.output.open_questions %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}

      Set `has_content: true`. The verdict, the assessment and the project-fit
      judgement are always worth posting, so this path always produces a
      review even when the finding lists happen to be short.
      {% else %}
      Write a review of pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}**.

      ## The findings

      These are the {{ apply_triage.output.approved_count }} finding{{ 's' if apply_triage.output.approved_count != 1 else '' }}
      a human approved for posting: {{ apply_triage.output.blocking_count }}
      blocking and {{ apply_triage.output.recommended_count }} recommended.
      Findings they dropped are already gone and you never see them, so
      everything below is posted and nothing else is.

      {% for finding in apply_triage.output.approved %}
      ---

      ### `{{ finding.id }}` — {{ finding.severity }}: {{ finding.title }}

      {% if finding.path %}**Location:** `{{ finding.path }}{% if finding.line %}:{{ finding.line }}{% endif %}`{% else %}**Location:** none — this finding has no single line{% endif %}

      {{ finding.body }}
      {% if finding.suggestion %}
      **Suggested fix:** {{ finding.suggestion }}
      {% endif %}
      {% if finding.guidance %}
      **The human's instruction for this one:** {{ finding.guidance }}

      That is how they want it posted. Apply it — soften the tone, add the
      context, or narrow the ask as they described. Their wording wins over
      the reviewer's.
      {% endif %}
      {% endfor %}

      ---

      ## How to lay it out

      **`inline_comments`** carries every finding above that has a `path` and
      a `line`. One object per finding:

      ```json
      {"path": "src/thing.ts", "line": 42, "body": "The comment, in markdown."}
      ```

      Copy `path` and `line` from the finding exactly. Do not adjust, round or
      guess a line — a comment that does not land on the diff gets folded into
      the body automatically, which is a worse result than a correct anchor.

      Include a ```suggestion``` block in the body wherever the fix is a short,
      concrete edit to those exact lines. Getting the indentation right matters:
      the author applies it with one click.

      Prefix each inline comment with **BLOCKING** or **RECOMMENDED** so its
      weight is obvious without opening the summary.

      **`review_body`** is the top-level comment. It holds:

      - Two or three sentences on the state of the change, drawn from the
        findings above and nothing else. If none of them are blocking, do not
        imply the change cannot merge; if some are, say so plainly.
      - A short list of the blocking findings by location, so the author can
        see the shape of the work without reading every inline thread.
      - Any finding above with no `path` or `line`, written out in full, since
        it has nowhere else to go.

      Do not repeat an inline comment's full text in the body. The author reads
      both.

      Every finding above must appear exactly once, either inline or in the
      body. Set `has_content: true`.

      Set `posted_count` to how many findings survived and appear in your
      output, and `dropped_count` to how many you dropped. The two together
      must equal the number of findings you were given, so a finding you
      cannot place has to be counted somewhere rather than quietly vanishing.
      {% endif %}
    output:
      review_body:
        type: string
        description: The top-level review comment in markdown. Empty only when has_content is false.
      inline_comments:
        type: array
        description: 'One object per finding anchored to a line: {"path": "...", "line": 42, "body": "..."}. Empty when no surviving finding has a location.'
      has_content:
        type: boolean
        description: False only when there is genuinely nothing to post. Both paths hand you content, so this is a safety net rather than a normal outcome.
    routes:
      - to: cleanup
        when: "{{ not output.has_content }}"
      - to: post_review

  - name: post_review
    description: Posts one review to the pull request, anchoring inline comments to the diff wherever it can and folding the rest into the body
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.base_ref
      - pr_worktree.output.remote
      - comment_writer.output.review_body
      - comment_writer.output.inline_comments
    args:
      - "{{ workflow.dir }}/scripts/post_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
      - "{{ pr_worktree.output.base_ref }}"
      - "{{ pr_worktree.output.remote }}"
      - "COMMENT"
    stdin: '{"body": {{ comment_writer.output.review_body | tojson }}, "comments": {{ comment_writer.output.inline_comments | tojson }}}'
    routes:
      - to: cleanup

  # ---------------------------------------------------------------------------
  # Follow-up review — the second visit, taken instead of everything above
  # ---------------------------------------------------------------------------

  - name: followup_review
    description: Checks each point you raised last time against the code as it stands now, rather than reviewing the pull request from scratch
    model: claude-opus-5
    context_tier: long_context
    reasoning:
      effort: high
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.base_ref
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
      - prior_review.output.prior_items
      - prior_review.output.context_comments
      - prior_review.output.last_interaction_at
      - prior_review.output.last_review_at
      - prior_review.output.last_review_state
      - prior_review.output.last_review_commit
      - prior_review.output.items_dropped
    system_prompt: |
      You check a review you have already given against the code as it stands
      now. A first pass already happened, the author has read it, and running
      one again would re-derive points they have acted on and post them a
      second time as though nobody read their replies.

      Your unit of work is the point, not the comment. One comment that raised
      three separate things is three entries. One thing you said twice is one.

      Decide from the code, not from the conversation. "Fixed, thanks" is a
      claim, and this step exists because claims and diffs disagree. Open the
      file and look. Where the code cannot settle it, say `unclear` rather
      than guessing in either direction — the human decides what to do with an
      unclear point, and they cannot if you have already decided for them.

      Raise nothing new. A finding you did not make before does not belong in
      a follow-up: posted there it masquerades as something the author read
      and ignored. If the change has grown new problems, that is a fresh
      review, and the human has a route to one.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not comment on GitHub. A later
      step publishes what a human approves, and it can only publish what you
      actually wrote down.
    prompt: |
      You have reviewed pull request #{{ pr_resolver.output.pr_number }}
      before. Work out what became of each point you made.

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      ## What you said
      {% if prior_review.output.last_review_state %}

      Your last review was submitted {{ prior_review.output.last_review_at }}
      as `{{ prior_review.output.last_review_state }}`.
      {% else %}

      Your last comment was {{ prior_review.output.last_interaction_at }}.
      {% endif %}
      {% for item in prior_review.output.prior_items %}

      ---

      ### `{{ item.id }}` — {{ item.kind }}{% if item.path %} on `{{ item.path }}{% if item.line %}:{{ item.line }}{% endif %}`{% endif %}

      {{ item.body }}
      {% if (item.replies | length) > 0 %}
      **What came back:**
      {% for reply in item.replies %}
      - **{{ reply.author }}**: {{ reply.body }}
      {% endfor %}
      {% endif %}
      {% endfor %}

      ---
      {% if prior_review.output.items_dropped %}

      > {{ prior_review.output.items_dropped }} older comment{{ 's' if prior_review.output.items_dropped != 1 else '' }} of yours could not be shown here. Say so in `summary` — a human is told what is settled based on what you report, and they should know the account is partial.
      {% endif %}
      {% if (prior_review.output.context_comments | length) > 0 %}

      ## Said on the pull request since

      {% for comment in prior_review.output.context_comments %}
      - **{{ comment.author }}**: {{ comment.body }}
      {% endfor %}
      {% endif %}

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out again.
      {% if prior_review.output.last_review_commit %}

      What has moved since you looked:

      ```
      git diff {{ prior_review.output.last_review_commit }}...HEAD
      ```

      If that commit is not in the worktree, the branch was force-pushed after
      your review and its history no longer holds what you read. Fall back to
      the whole diff and check every point against the current file:

      ```
      git diff {{ pr_worktree.output.remote }}/{{ pr_resolver.output.base_ref }}...HEAD
      ```
      {% else %}

      No commit is recorded against your earlier comments, so check every point
      against the current file. The whole diff is:

      ```
      git diff {{ pr_worktree.output.remote }}/{{ pr_resolver.output.base_ref }}...HEAD
      ```
      {% endif %}

      A diff tells you what moved, never whether a point was addressed. A
      change can touch the exact lines you commented on and still not do what
      you asked, and a point can be settled by an edit somewhere else entirely.
      Read the file.

      ## What to report

      One entry in `items` per point you made. Each entry is an object:

      ```json
      {
        "source_id": "p3",
        "status": "not_addressed",
        "severity": "BLOCKING",
        "path": "src/thing.ts",
        "line": 42,
        "title": "Token expiry is never checked",
        "original": "What you asked for, narrowed to the ask itself.",
        "evidence": "What the code does now, naming the file and line you read.",
        "recommendation": "What is left to do. Empty when nothing is."
      }
      ```

      - `source_id` is the `p...` id of the comment the point came from.
        Several entries may share one.
      - `status` is exactly one of:
        - `addressed` — the code now does what you asked.
        - `partially_addressed` — some of it landed and some did not. Say
          which in `evidence`.
        - `not_addressed` — the code is unchanged in the respect you raised.
        - `obsolete` — the point no longer applies, because the code it
          concerned is gone or the design moved past it. Keep this separate
          from `addressed`: one means they did it, the other means nobody
          needs to.
        - `unclear` — the code did not settle it.
      - `severity` is `BLOCKING` or `RECOMMENDED`, judged as the point stands
        today rather than as you filed it last time. Nothing else.
      - `path` is repository-relative, exactly as it appears in the diff.
      - `line` is the line **in the current version of the file**, and it must
        be a line this pull request adds or touches. An anchor outside the diff
        cannot be attached inline, so a wrong line quietly demotes the point
        into the review body. Omit `line` rather than guess, and omit both for
        a point with no single location.
      - `original` and `evidence` are prose for the author. Do not quote
        comment ids at them and do not write them as notes to yourself.

      Every point above appears exactly once. Something you said that was never
      a finding — a question, a thank-you, an answer to someone else — is
      `obsolete`.

      Everything having been addressed is a real and common result. Report it
      plainly rather than hunting for something still wrong to justify the pass.
    output:
      items:
        type: array
        description: 'One object per point you made previously: {"source_id": "p3", "status": "addressed"|"partially_addressed"|"not_addressed"|"obsolete"|"unclear", "severity": "BLOCKING"|"RECOMMENDED", "path": "...", "line": 42, "title": "...", "original": "...", "evidence": "...", "recommendation": "..."}. `path` and `line` omitted when the point has no single location.'
      summary:
        type: string
        description: Where the pull request now stands against your earlier review, in a few sentences
      changes_since:
        type: string
        description: What the author changed since your review, read from the diff rather than from their replies. Empty when nothing has changed.
      verdict:
        type: string
        description: Exactly one of all_addressed, partially_addressed, not_addressed
    routes:
      - to: build_followup_questions

  - name: build_followup_questions
    description: Turns the outstanding points into strictly shaped question objects, reconciles them against the comments you actually made, and counts the settled ones so a clean result is something you can see rather than infer from an empty list
    type: script
    command: python3
    timeout: 60
    input:
      - followup_review.output.items
      - prior_review.output.prior_items
    args:
      - "{{ workflow.dir }}/scripts/build_followup_questions.py"
    # The prior comments travel with the analysis so the script can check that
    # every one of them was accounted for. An analysis that quietly omits a
    # point would otherwise route straight to the clear gate, which then tells
    # you everything was settled. Anything unaccounted for comes back as an
    # unclear question rather than as silence.
    stdin: '{"items": {{ followup_review.output.items | tojson }}, "prior_items": {{ prior_review.output.prior_items | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: followup_clear_gate
        when: "{{ output.question_count == 0 }}"
      - to: followup_triage

  - name: followup_triage
    type: questions
    description: Puts every still-open point to you individually, so raising one a second time is a decision rather than a default
    source: build_followup_questions.output.questions
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - followup_review.output.summary
      - followup_review.output.changes_since
      - build_followup_questions.output.question_count
      - build_followup_questions.output.blocking_count
      - build_followup_questions.output.recommended_count
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
    prompt: |
      ## Your earlier review of #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}

      {{ followup_review.output.summary }}
      {% if followup_review.output.changes_since %}

      **What changed since {{ prior_review.output.last_review_at or prior_review.output.last_interaction_at }}:** {{ followup_review.output.changes_since }}
      {% endif %}

      {{ build_followup_questions.output.addressed_count }} of your points
      {{ 'has' if build_followup_questions.output.addressed_count == 1 else 'have' }} been
      addressed{% if build_followup_questions.output.obsolete_count %} and {{ build_followup_questions.output.obsolete_count }} no longer appl{{ 'ies' if build_followup_questions.output.obsolete_count == 1 else 'y' }}{% endif %}.
      {{ build_followup_questions.output.question_count }} {{ 'is' if build_followup_questions.output.question_count == 1 else 'are' }} still open:
      {{ build_followup_questions.output.blocking_count }} blocking and
      {{ build_followup_questions.output.recommended_count }} recommended.
      Nothing has been posted to the pull request yet.

      Decide each one. There are four ways to answer:

      - **Post as-is** raises it again at the severity it carries now.
      - **Post as BLOCKING** / **Post as RECOMMENDED** raises the same wording
        at the other severity, so a point the author has now sat on twice can
        be promoted, or one you no longer want to hold up a merge demoted.
        Only the severity it does not already carry is offered.
      - **Do not post** lets it go. Nothing about it reaches the author.
      - **Write your own** raises it with your note applied — the place to
        acknowledge a partial fix, accept a reason you were given, or narrow
        what is left.

      Skipping a question raises it as-is, so "skip all remaining" means
      "raise the rest verbatim". Aborting posts nothing at all.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: cleanup
    routes:
      - to: apply_followup_triage

  - name: apply_followup_triage
    description: Applies your decisions before any model sees them — the same script the first-pass triage uses, so a point you let go is gone by the same guarantee
    type: script
    command: python3
    timeout: 60
    input:
      - build_followup_questions.output.findings
      - followup_triage.output.items
    args:
      - "{{ workflow.dir }}/scripts/apply_triage.py"
    stdin: '{"findings": {{ build_followup_questions.output.findings | tojson }}, "items": {{ followup_triage.output.items | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: followup_clear_gate
        when: "{{ output.approved_count == 0 }}"
      - to: followup_gate

  - name: followup_gate
    type: human_gate
    description: The publish decision when points from your earlier review are still open
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - prior_review.output.matched_logins
      - prior_review.output.other_login_items
      - followup_review.output.summary
      - followup_review.output.changes_since
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.resolved
      - apply_followup_triage.output.approved_count
      - apply_followup_triage.output.blocking_count
      - apply_followup_triage.output.recommended_count
      - apply_followup_triage.output.dropped_count
    prompt: |
      ## Follow-up on #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}

      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. Anything you choose here still posts to it.
      {% endif %}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      > This is your own pull request. GitHub refuses an approval from the author, so that option will fail here.
      {% endif %}
      {% if prior_review.output.other_login_items %}

      > The review being followed up on was posted as {{ prior_review.output.matched_logins | join(', ') }}, and `gh` is now active as `{{ pr_resolver.output.gh_user }}`. Anything you publish here goes up under `{{ pr_resolver.output.gh_user }}`, so the pull request will show one reviewer under two names. Run `gh auth switch` and start again if you would rather keep them together.
      {% endif %}

      {{ followup_review.output.summary }}
      {% if followup_review.output.changes_since %}

      **What changed since {{ prior_review.output.last_review_at or prior_review.output.last_interaction_at }}:** {{ followup_review.output.changes_since }}
      {% endif %}
      {% if (build_followup_questions.output.resolved | length) > 0 %}

      ### Settled

      {% for item in build_followup_questions.output.resolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ### Still open

      You kept {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }} —
      {{ apply_followup_triage.output.blocking_count }} blocking and
      {{ apply_followup_triage.output.recommended_count }} recommended{% if apply_followup_triage.output.dropped_count %}, and let {{ apply_followup_triage.output.dropped_count }} go{% endif %}.

      ---

      Approving posts `LGTM, thanks for contributing!` and nothing else, which
      on a pull request with open points says you have decided they can ship
      without them.

      After approval is posted, a separate gate shows current merge readiness
      and asks whether to squash-merge. Approval alone never merges.

      Posting the findings raises exactly the points you kept, worded as a
      follow-up rather than as a first review, with inline comments wherever
      the diff allows.
    options:
      - label: 'Approve — "LGTM, thanks for contributing!"'
        value: approve
        route: post_approval
      - label: Post the points you kept as a review
        value: comment
        route: followup_comment_writer
      - label: Post nothing
        value: stop
        route: cleanup

  - name: followup_clear_gate
    type: human_gate
    description: The publish decision when nothing from your earlier review is left to raise, whether because it all landed or because you let the rest go
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - prior_review.output.items_dropped
      - prior_review.output.matched_logins
      - prior_review.output.other_login_items
      - followup_review.output.summary
      - followup_review.output.changes_since
      - followup_review.output.verdict
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.resolved
      - apply_followup_triage.output.dropped_count?
    prompt: |
      ## Follow-up on #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}

      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. Anything you choose here still posts to it.
      {% endif %}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      > This is your own pull request. GitHub refuses an approval from the author, so that option will fail here.
      {% endif %}
      {% if prior_review.output.items_dropped %}

      > {{ prior_review.output.items_dropped }} of your older comment{{ 's' if prior_review.output.items_dropped != 1 else '' }} were too far back to be read, so "nothing left to raise" covers only what was.
      {% endif %}
      {% if prior_review.output.other_login_items %}

      > The review being followed up on was posted as {{ prior_review.output.matched_logins | join(', ') }}, and `gh` is now active as `{{ pr_resolver.output.gh_user }}`. Anything you publish here goes up under `{{ pr_resolver.output.gh_user }}`, so the pull request will show one reviewer under two names. Run `gh auth switch` and start again if you would rather keep them together.
      {% endif %}
      {% if apply_followup_triage is defined %}

      **Nothing is left to raise** — you let every open point go at triage
      ({{ apply_followup_triage.output.dropped_count }} of them).
      {% else %}

      **Nothing is left to raise.** Every point from your review of
      {{ prior_review.output.last_review_at or prior_review.output.last_interaction_at }} is addressed or no longer
      applies.
      {% endif %}

      {{ followup_review.output.summary }}
      {% if followup_review.output.changes_since %}

      **What changed since:** {{ followup_review.output.changes_since }}
      {% endif %}
      {% if (build_followup_questions.output.resolved | length) > 0 %}

      ### Settled

      {% for item in build_followup_questions.output.resolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ---

      Approving posts `LGTM, thanks for contributing!` and nothing else.

      After approval is posted, a separate gate shows current merge readiness
      and asks whether to squash-merge. Approval alone never merges.

      Writing your own note posts it verbatim as a review comment — nothing
      rewrites it and nothing is appended.

      Running the full review starts the first-pass path from the top: concept
      review, code review, and a decision on every finding. That is the route
      to fresh findings, which this pass deliberately does not produce. It
      costs a full review and it posts a second, separate review to the pull
      request.
    options:
      - label: 'Approve — "LGTM, thanks for contributing!"'
        value: approve
        route: post_approval
      - label: Comment with a note I write
        value: note
        route: post_note
        prompt_for: note
        multiline: true
      - label: Run the full review instead
        value: full_review
        route: concept_review
      - label: Post nothing
        value: stop
        route: cleanup

  - name: followup_comment_writer
    description: Words the points you chose to raise again, framed as a second mention rather than a first
    model: claude-sonnet-5
    context_tier: long_context
    reasoning:
      effort: medium
    plugins:
      - writing@jason-tools   # humanizer
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.resolved
      - apply_followup_triage.output.approved
      - apply_followup_triage.output.approved_count
      - apply_followup_triage.output.blocking_count
      - apply_followup_triage.output.recommended_count
    system_prompt: |
      You write the follow-up review that gets posted to a pull request. You
      are the last step before it is public, and you are writing to its author
      — who has already read your first review and answered parts of it.

      You decide nothing. Which points are raised again was settled by a human,
      one at a time, and everything they let go was removed before you were
      called. What you are given is exactly what goes out. Do not add a point
      nobody raised, do not merge two into one, and do not soften a blocking
      point into a suggestion.

      You are given no summary of the earlier review and no prose account of
      what has changed, deliberately. Both are written before the human
      decides anything, so either could name a point they went on to drop, and
      a dropped point reaching the author through a summary line is no better
      than one reaching them through a finding. Everything you have is either
      a point they kept or a point that is settled.

      The severity on each point is theirs, not the reviewer's. The label wins.
      Write it at the weight it carries and let the wording follow.

      Write it as a second mention, because that is what it is. Say what has
      landed before what has not — it is true, it is short, and a follow-up
      that opens on the same complaint reads as though the work in between did
      not happen. Then be plain about what is still open. Do not re-argue a
      point from scratch, do not apologise for raising it again, and do not
      accuse anyone of ignoring it.

      Every comment goes through the `humanizer` skill before you return it.
      Apply it properly — draft, audit what still reads as machine-generated,
      then revise. Do not just delete em dashes and call it done.

      Write like a competent colleague who read the code: direct about what is
      wrong, specific about where, and free of ceremony. No preamble, no
      emoji, no praise sandwich.
    prompt: |
      Write a follow-up review of pull request
      #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}**.

      You reviewed it on {{ prior_review.output.last_review_at or prior_review.output.last_interaction_at }}. Since
      then, {{ build_followup_questions.output.addressed_count }} of the points
      you made {{ 'has' if build_followup_questions.output.addressed_count == 1 else 'have' }} been
      addressed{% if build_followup_questions.output.obsolete_count %} and {{ build_followup_questions.output.obsolete_count }} no longer appl{{ 'ies' if build_followup_questions.output.obsolete_count == 1 else 'y' }}{% endif %}.
      {% if (build_followup_questions.output.resolved | length) > 0 %}

      ## What has landed

      Open the review by crediting these. They are settled, so they are context
      rather than findings — a sentence or two drawn from them, not a list
      repeated back.

      {% for item in build_followup_questions.output.resolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ## The points to raise again

      These are the {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }}
      a human kept: {{ apply_followup_triage.output.blocking_count }} blocking
      and {{ apply_followup_triage.output.recommended_count }} recommended.
      Points they let go are already gone and you never see them, so everything
      below is posted and nothing else is.

      {% for finding in apply_followup_triage.output.approved %}
      ---

      ### `{{ finding.id }}` — {{ finding.severity }}: {{ finding.title }}

      {% if finding.path %}**Location:** `{{ finding.path }}{% if finding.line %}:{{ finding.line }}{% endif %}`{% else %}**Location:** none — this point has no single line{% endif %}

      **Status:** `{{ finding.status }}`

      {{ finding.body }}
      {% if finding.suggestion %}
      **What is still needed:** {{ finding.suggestion }}
      {% endif %}
      {% if finding.guidance %}
      **The human's instruction for this one:** {{ finding.guidance }}

      That is how they want it raised. Apply it — accept the partial fix,
      acknowledge the reason they were given, or narrow the ask as described.
      Their wording wins over the reviewer's.
      {% endif %}
      {% endfor %}

      ---

      ## How to lay it out

      A `status` of `partially_addressed` is not the same comment as
      `not_addressed`. Credit what landed and name only the remainder;
      restating the whole original point tells the author their work did not
      register. `unclear` is a question, not a finding — you could not tell
      from the code, so ask.

      **`inline_comments`** carries every point above that has a `path` and a
      `line`. One object per point:

      ```json
      {"path": "src/thing.ts", "line": 42, "body": "The comment, in markdown."}
      ```

      Copy `path` and `line` from the point exactly. Do not adjust, round or
      guess a line — a comment that does not land on the diff gets folded into
      the body automatically, which is a worse result than a correct anchor.

      Include a ```suggestion``` block in the body wherever what is left is a
      short, concrete edit to those exact lines. Getting the indentation right
      matters: the author applies it with one click.

      Prefix each inline comment with **BLOCKING** or **RECOMMENDED** so its
      weight is obvious without opening the summary.

      **`review_body`** is the top-level comment. It holds:

      - One or two sentences on what has landed since your last review, drawn
        from the settled points above.
      - Two or three on what is still open, and whether it blocks.
      - A short list of the blocking points by location, so the author can see
        the shape of the remaining work without opening every thread.
      - Any point above with no `path` or `line`, written out in full, since it
        has nowhere else to go.

      Do not repeat an inline comment's full text in the body. The author reads
      both.

      Every point above must appear exactly once, either inline or in the body.
      Set `has_content: true`.

      Set `posted_count` to how many of the points you were given appear in
      your output and `dropped_count` to how many you could not place. The two
      together must equal {{ apply_followup_triage.output.approved_count }}. A
      `posted_count` below that stops the run rather than posting a follow-up
      the human approved more of than it contains.
    output:
      review_body:
        type: string
        description: The top-level review comment in markdown. Empty only when has_content is false.
      inline_comments:
        type: array
        description: 'One object per point anchored to a line: {"path": "...", "line": 42, "body": "..."}. Empty when no surviving point has a location.'
      posted_count:
        type: number
        description: How many of the points you were given appear in your output, inline or in the body
      dropped_count:
        type: number
        description: How many of the points you were given you could not place. Should be zero.
      has_content:
        type: boolean
        description: False only when there is genuinely nothing to post. This path always hands you points, so it is a safety net rather than a normal outcome.
    routes:
      - to: cleanup
        when: "{{ not output.has_content or (output.posted_count | int) < (apply_followup_triage.output.approved_count | int) }}"
      - to: post_followup_review

  - name: post_followup_review
    description: Posts the follow-up as one COMMENT review, anchoring inline comments to the diff wherever it can and folding the rest into the body
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.base_ref
      - pr_worktree.output.remote
      - followup_comment_writer.output.review_body
      - followup_comment_writer.output.inline_comments
    args:
      - "{{ workflow.dir }}/scripts/post_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
      - "{{ pr_worktree.output.base_ref }}"
      - "{{ pr_worktree.output.remote }}"
      - "COMMENT"
    stdin: '{"body": {{ followup_comment_writer.output.review_body | tojson }}, "comments": {{ followup_comment_writer.output.inline_comments | tojson }}}'
    routes:
      - to: cleanup

  - name: post_approval
    description: Approves the pull request with the one line and nothing else — no summary, no findings, no model between the decision and the text
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.base_ref
      - pr_worktree.output.remote
    args:
      - "{{ workflow.dir }}/scripts/post_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
      - "{{ pr_worktree.output.base_ref }}"
      - "{{ pr_worktree.output.remote }}"
      - "APPROVE"
    stdin: '{"body": "LGTM, thanks for contributing!", "comments": []}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: merge_readiness

  - name: merge_readiness
    description: Refreshes mergeability, checks and review requirements after LGTM is posted
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
    args:
      - "{{ workflow.dir }}/scripts/merge_readiness.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
    routes:
      - to: merge_blocked_gate
        when: "{{ not output.ok or not output.can_merge }}"
      - to: merge_gate

  - name: merge_gate
    type: human_gate
    description: Asks separately whether to merge after approval and a fresh readiness check
    input:
      - pr_resolver.output.pr_url
      - post_approval.output.review_url
      - pr_worktree.output.head_sha
      - merge_readiness.output.summary
      - merge_readiness.output.issues
    prompt: |
      ## LGTM posted. Would you like to merge?

      {{ post_approval.output.review_url }}

      {{ merge_readiness.output.summary }}
      {% for issue in merge_readiness.output.issues %}
      - {{ issue }}
      {% endfor %}

      Squash-merge {{ pr_resolver.output.pr_url }} at reviewed head
      `{{ pr_worktree.output.head_sha }}` and delete its source branch?
      Readiness is checked again before merging; no checks or protections are bypassed.
    options:
      - label: Squash-merge the approved PR
        value: merge
        route: merge_pr
      - label: Leave it approved without merging
        value: stop
        route: cleanup

  - name: merge_blocked_gate
    type: human_gate
    description: Shows all known merge blockers and lets the human recheck or leave the PR approved
    input:
      - pr_resolver.output.pr_url
      - post_approval.output.review_url
      - merge_readiness.output.summary
      - merge_readiness.output.issues
      - merge_readiness.output.error
    prompt: |
      ## LGTM posted. Merging is blocked or cannot be confirmed safe.

      {{ post_approval.output.review_url }}

      {{ merge_readiness.output.summary }}
      {% for issue in merge_readiness.output.issues %}
      - {{ issue }}
      {% endfor %}
      {% if merge_readiness.output.error %}

      **Readiness error:** {{ merge_readiness.output.error }}
      {% endif %}

      Would you like to merge once these issues are resolved? Resolve conflicts,
      failing or pending checks, or repository requirements on
      {{ pr_resolver.output.pr_url }}, then recheck to reach the merge decision.
      If the head changed, start a new review instead. Nothing merges from this gate.
    options:
      - label: Recheck readiness
        value: recheck
        route: merge_readiness
      - label: Leave it approved without merging
        value: stop
        route: cleanup

  - name: merge_pr
    description: Rechecks readiness and squash-merges only the approved head, deleting the source branch
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
    args:
      - "{{ workflow.dir }}/scripts/merge_pr.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "squash"
      - "false"
      - "true"
      - "{{ pr_worktree.output.head_sha }}"
    routes:
      - to: cleanup

  - name: post_note
    description: Posts the note you wrote, verbatim, as a plain review comment
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.base_ref
      - pr_worktree.output.remote
      - followup_clear_gate.output.additional_input
    args:
      - "{{ workflow.dir }}/scripts/post_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
      - "{{ pr_worktree.output.base_ref }}"
      - "{{ pr_worktree.output.remote }}"
      - "COMMENT"
    # No agent reads this. A note you wrote yourself is already the wording you
    # want, and passing it through the writer would return something adjacent
    # to it that you never approved.
    stdin: '{"body": {{ followup_clear_gate.output.additional_input.note | default("") | tojson }}, "comments": []}'
    routes:
      - to: cleanup

  # ---------------------------------------------------------------------------
  # Teardown
  # ---------------------------------------------------------------------------

  - name: cleanup
    description: Removes the review worktree and its branch, from the repository root rather than the worktree it is deleting
    type: script
    command: python3
    timeout: 120
    input:
      - bootstrap.output.repo_root
      - pr_worktree.output.worktree_path?
      - pr_worktree.output.branch?
    args:
      - "{{ workflow.dir }}/scripts/cleanup.py"
      - "{{ bootstrap.output.repo_root }}"
      - "{{ pr_worktree.output.worktree_path if pr_worktree is defined else '' }}"
      - "{{ pr_worktree.output.branch if pr_worktree is defined else '' }}"
    routes:
      - to: prior_scan_failed
        when: "{{ prior_review is defined and not prior_review.output.ok }}"
      - to: ci_failed
        when: "{{ ci_wait is defined and not ci_wait.output.ok }}"
      - to: findings_unreadable
        when: "{{ (build_questions is defined and not build_questions.output.ok) or (build_followup_questions is defined and not build_followup_questions.output.ok) }}"
      - to: triage_failed
        when: "{{ (apply_triage is defined and not apply_triage.output.ok) or (apply_followup_triage is defined and not apply_followup_triage.output.ok) }}"
      - to: review_failed
        when: "{{ post_review is defined and not post_review.output.ok }}"
      - to: review_posted
        when: "{{ post_review is defined and post_review.output.ok }}"
      - to: followup_failed
        when: "{{ (post_followup_review is defined and not post_followup_review.output.ok) or (post_approval is defined and not post_approval.output.ok) or (post_note is defined and not post_note.output.ok) }}"
      - to: merge_failed
        when: "{{ merge_pr is defined and not merge_pr.output.ok }}"
      - to: followup_posted
        when: "{{ (post_followup_review is defined and post_followup_review.output.ok) or (post_approval is defined and post_approval.output.ok) or (post_note is defined and post_note.output.ok) }}"
      - to: followup_not_written
        when: "{{ followup_comment_writer is defined and post_followup_review is not defined }}"
      - to: no_review

  - name: prior_scan_failed
    type: terminate
    status: failed
    input:
      - pr_resolver.output.pr_number
      - prior_review.output.error
    reason: "Could not tell whether you have already reviewed #{{ pr_resolver.output.pr_number }}, so the run stopped rather than risk posting a second first-pass review over your own comments. The worktree has been removed. {{ prior_review.output.error }}"

  - name: findings_unreadable
    type: terminate
    status: failed
    input:
      - build_questions.output.error?
      - build_followup_questions.output.error?
    reason: "The review produced findings that could not be read, so none of them reached you and nothing was posted. The worktree has been removed. {{ build_questions.output.error if build_questions is defined else build_followup_questions.output.error }}"

  - name: ci_failed
    type: terminate
    status: failed
    input:
      - ci_wait.output.error
    reason: "CI results could not be incorporated into the review, so nothing was posted. {{ ci_wait.output.error }}"

  - name: triage_failed
    type: terminate
    status: failed
    input:
      - apply_triage.output.error?
      - apply_followup_triage.output.error?
    reason: "Your triage decisions could not be applied, so nothing was posted. The worktree has been removed. {{ apply_triage.output.error if apply_triage is defined else apply_followup_triage.output.error }}"

  - name: review_posted
    type: terminate
    status: success
    input:
      - pr_resolver.output.pr_number
      - apply_triage.output.approved_count?
      - apply_triage.output.dropped_count?
      - apply_triage.output.reclassified_count?
      - post_review.output.review_url
      - post_review.output.inline_posted
      - post_review.output.inline_demoted
      - post_review.output.error
    reason: "Posted a review on #{{ pr_resolver.output.pr_number }}{% if apply_triage is defined %} with {{ apply_triage.output.approved_count }} finding{{ 's' if apply_triage.output.approved_count != 1 else '' }} ({{ apply_triage.output.dropped_count }} dropped{% if apply_triage.output.reclassified_count %} and {{ apply_triage.output.reclassified_count }} reclassified{% endif %} at triage){% else %} from the concept review{% endif %}, {{ post_review.output.inline_posted }} anchored inline and {{ post_review.output.inline_demoted }} in the body. {{ post_review.output.review_url }}{% if post_review.output.error %} Note: {{ post_review.output.error }}{% endif %}"

  - name: review_failed
    type: terminate
    status: failed
    input:
      - pr_resolver.output.pr_number
      - post_review.output.error
    reason: "The review of #{{ pr_resolver.output.pr_number }} was written but could not be posted. {{ post_review.output.error }}"

  - name: followup_posted
    type: terminate
    status: success
    input:
      - pr_resolver.output.pr_number
      - build_followup_questions.output.addressed_count?
      - apply_followup_triage.output.approved_count?
      - apply_followup_triage.output.dropped_count?
      - apply_followup_triage.output.reclassified_count?
      - post_approval.output.review_url?
      - post_note.output.review_url?
      - merge_pr.output.merged?
      - merge_pr.output.queued?
      - merge_pr.output.branch_deleted?
      - merge_pr.output.error?
      - post_followup_review.output.review_url?
      - post_followup_review.output.inline_posted?
      - post_followup_review.output.inline_demoted?
      - post_followup_review.output.error?
    reason: "{% if post_approval is defined %}Approved #{{ pr_resolver.output.pr_number }}{% if apply_followup_triage is defined and apply_followup_triage.output.approved_count %}, leaving {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }} from your earlier review unraised{% endif %}.{% if merge_pr is defined %}{% if merge_pr.output.merged %} Squash-merged{% if merge_pr.output.branch_deleted %} and deleted the source branch{% endif %}.{% elif merge_pr.output.queued %} Auto-merge is on, so GitHub will squash it once the required checks pass — it is not merged yet.{% endif %}{% if merge_pr.output.error %} Note: {{ merge_pr.output.error }}{% endif %}{% endif %} {{ post_approval.output.review_url }}{% elif post_note is defined %}Commented on #{{ pr_resolver.output.pr_number }} with your note; nothing from your earlier review was raised. {{ post_note.output.review_url }}{% else %}Raised {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }} from your earlier review again on #{{ pr_resolver.output.pr_number }} ({{ build_followup_questions.output.addressed_count }} already addressed, {{ apply_followup_triage.output.dropped_count }} let go{% if apply_followup_triage.output.reclassified_count %}, {{ apply_followup_triage.output.reclassified_count }} reclassified{% endif %} at triage), {{ post_followup_review.output.inline_posted }} anchored inline and {{ post_followup_review.output.inline_demoted }} in the body. {{ post_followup_review.output.review_url }}{% if post_followup_review.output.error %} Note: {{ post_followup_review.output.error }}{% endif %}{% endif %}"

  - name: followup_failed
    type: terminate
    status: failed
    input:
      - pr_resolver.output.pr_number
      - post_approval.output.error?
      - post_note.output.error?
      - post_followup_review.output.error?
    reason: "{% if post_approval is defined %}The approval of #{{ pr_resolver.output.pr_number }} could not be posted. {{ post_approval.output.error }}{% elif post_note is defined %}Your note on #{{ pr_resolver.output.pr_number }} could not be posted. {{ post_note.output.error }}{% else %}The follow-up review of #{{ pr_resolver.output.pr_number }} was written but could not be posted. {{ post_followup_review.output.error }}{% endif %} The worktree has been removed."

  - name: merge_failed
    type: terminate
    status: failed
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_url
      - merge_pr.output.error
      - merge_pr.output.state
    reason: "Approval for #{{ pr_resolver.output.pr_number }} was posted, but the merge could not be completed or confirmed. {{ merge_pr.output.error }} Check the current PR state and resolve the reported blockers before retrying. If the head changed, start a new review. {{ pr_resolver.output.pr_url }}"

  - name: followup_not_written
    type: terminate
    status: failed
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_url
      - apply_followup_triage.output.approved_count
      - followup_comment_writer.output.posted_count?
      - followup_comment_writer.output.has_content?
    reason: "You kept {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }} to raise on #{{ pr_resolver.output.pr_number }}, but the review written from them {% if not followup_comment_writer.output.has_content %}came back empty{% else %}carried only {{ followup_comment_writer.output.posted_count }}{% endif %}. Nothing was posted: a follow-up missing points you approved is worse than none, because the ones it drops read as withdrawn. The worktree has been removed. {{ pr_resolver.output.pr_url }}"

  - name: no_review
    type: terminate
    status: success
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_url
    reason: "Nothing was posted to #{{ pr_resolver.output.pr_number }}. Either the review found nothing, you dropped every finding, or you stopped at a gate. The worktree has been removed. {{ pr_resolver.output.pr_url }}"

  - name: stopped
    type: terminate
    status: success
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_url
    reason: "Stopped before the review started. Nothing was posted to #{{ pr_resolver.output.pr_number }} and no worktree was created. {{ pr_resolver.output.pr_url }}"
