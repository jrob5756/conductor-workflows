    options:
      - label: Post the points you kept as a review
        value: comment
        route: followup_comment_writer
      - label: Post nothing
        value: stop
        route: cleanup

  - name: followup_clear_gate
    type: human_gate
    description: The publish decision when nothing from your earlier review is left to raise, whether because it all landed or because you let the rest go
    input:
      - workflow.input.merge
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - prior_review.output.items_dropped
      - prior_review.output.matched_logins
      - prior_review.output.other_login_items
      - followup_review.output.summary
      - followup_review.output.changes_since
      - followup_review.output.verdict
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.resolved
      - apply_followup_triage.output.dropped_count?
      - ci_wait.output.summary
      - build_followup_questions.output.confirmations
      - prior_review.output.thread_error
    prompt: |
      ## Follow-up on #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}

      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. Anything you choose here still posts to it.
      {% endif %}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      > This is your own pull request. GitHub refuses an approval from the author, so that option will fail here.
      {% endif %}
      {% if prior_review.output.items_dropped %}

      > {{ prior_review.output.items_dropped }} of your older comment{{ 's' if prior_review.output.items_dropped != 1 else '' }} were too far back to be read, so "nothing left to raise" covers only what was.
      {% endif %}
      {% if prior_review.output.other_login_items %}

      > The review being followed up on was posted as {{ prior_review.output.matched_logins | join(', ') }}, and `gh` is now active as `{{ pr_resolver.output.gh_user }}`. Anything you publish here goes up under `{{ pr_resolver.output.gh_user }}`, so the pull request will show one reviewer under two names. Run `gh auth switch` and start again if you would rather keep them together.
