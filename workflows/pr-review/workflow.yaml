# PR Review Workflow
#
# Reviews someone else's pull request and posts the findings you approve,
# orchestrating the skills you already run by hand rather than reimplementing
# their logic:
#
#   bootstrap (script)       resolve repo root / gh identity / worktrees dir
#     ↓
#   pr_resolver              read the pull request from GitHub, and report the
#     ↓                      repository and gh login it actually resolved
#   author_gate ────────────→ only when the PR is yours: review anyway / stop
#     ↓
#   pr_worktree (script)     fetch pull/N/head, cut a throwaway worktree
#     ↓
#   prior_review (script) ──→ compare against your previous review before either path
#   unchanged_gate          continue or exit when unchanged; unknown history also asks
#   select_review           choose the follow-up path when earlier feedback exists
#     ↓
#   concept_review           does the proposed intent belong in this repository?
#   concept_gate ───────────→ only when it found blocking gaps:
#     ↓                        proceed / post the concept findings and stop /
#     ↓                        stop without posting
#   ci_start (script)        approve or rerun Actions for the reviewed head
#                            only when needed; passing runs are reused
#   code_review              [code-review skill] report only, change nothing
#   ci_wait (script)         wait for CI; problems join the findings as BLOCKING
#     ↓
#   build_questions (script) findings → strictly shaped question objects
#     ↓
#   triage (questions)       per finding: post as-is / reseverity / reword /
#     ↓                      drop
#   apply_triage (script)    drop what you dropped, before a model sees it
#     ↓
#   comment_writer           [humanizer skill] one structured body per approved ID
#     ↓
#   post_review (script)     one review, event=COMMENT, inline where it can
#     ↓
#   cleanup (script)         remove the worktree and its branch
#     ↓
#   $end
#   review_clear_gate offers approval when no findings remain; LGTM leads to a separate merge gate.
#
# The follow-up path — taken when `prior_review` finds your earlier comments:
#
#   ci_start (script)            approve or rerun Actions only when needed
#   followup_review              did they do what you asked? one status per
#     ↓                          point: addressed / partly / not / moot /
#     ↓                          unclear, decided from the code
#   ci_wait (script)             wait for CI on this pass too
#   build_followup_questions     outstanding points and CI problems → questions
#     ↓
#   followup_triage (questions)  per point: raise it again as-is / reseverity
#     ↓                          / reword / let it go
#   apply_followup_triage        drop what you let go, before a model sees it
#     ↓
#   followup_gate ──────────────→ approve / post the outstanding points /
#     ↓                           post nothing
#   followup_comment_writer      [humanizer skill] one body per approved ID
#     ↓
#   post_followup_review         one review, event=COMMENT
#     ↓
#   cleanup
#
#   Threads on a follow-up: a point that landed gets a "Fix confirmed" reply
#   and its thread is resolved; a point still open (or partly done) is
#   answered on its original thread, which is reopened if it was resolved; a
#   problem introduced since the last review is a new inline comment. The
#   review body lists all three. Fixed-point confirmations go out with
#   whichever publish option you choose, and never on "Post nothing".
#
#   followup_clear_gate replaces `followup_gate` when nothing is left to
#   raise — because every point landed, or because you let the rest go at
#   triage. It offers the approval, a note you write yourself, and the escape
#   hatch back to a full first-pass review.
#
# The second visit
#   A pull request you have already reviewed is not a pull request you have
#   not. Running the concept and code passes again re-derives the points you
#   made last time, phrases them differently, and posts them a second time
#   under a fresh review — which reads to the author as if nobody opened the
#   replies they wrote. The expensive part is wasted and the cheap part is
#   insulting.
#
#   So `prior_review` asks GitHub, not a model, whether you have commented
#   here before: a submitted review, an inline comment, or a conversation
#   comment authored by any login `gh` is signed in as on this host. It is a
#   script because the branch has to be decided by a fact rather than by a
#   model recognising its own handiwork, and because the same call collects
#   the replies your comments drew, which is what the follow-up reads.
#
#   Identity there is a set rather than a name, because one human routinely
#   has more than one GitHub account and `gh` keeps them all, active one at a
#   time. Matched against the active login alone, a review left under your
#   other account is invisible, and the run takes the first-pass branch and
#   posts a second opinion on top of your own. The follow-up still publishes
#   as the active account, so the gates say so when the two differ.
#
#   `followup_review` then answers one question per point — did the code
#   change in the respect you raised — and refuses to answer it from the
#   conversation. "Fixed, thanks" is a claim; the file is the evidence. It
#   raises nothing new, because a finding nobody made before does not belong
#   in a follow-up: posted there it masquerades as something the author
#   already ignored. If you want fresh findings, `followup_clear_gate` routes
#   you into the full review.
#
#   Approval and merging require separate decisions, with fresh readiness shown after approval.
#
#   Reconciliation requires explicit duplicate-source accounting for legacy summaries.
#   Unexamined legacy sources stop; omitted verified code findings reach triage as unclear.
#   Prior CI findings delegate to ci_wait rather than retain the model's earlier status.
#   Python preserves the writer's opening separately from the approved findings.
#
# Targeting
#   The reference may name a repository — `owner/repo#123`, or a full URL —
#   but the worktree and the posted review both target the repository you are
#   standing in. `pr_resolver` therefore reports the repository it actually
#   read, and the run stops when the two disagree. Without that check, passing
#   a reference from elsewhere reviews one pull request and comments on
#   another that happens to share its number.
#
#   GitHub commands use the preflight-selected identity without global account switches.
#
# Order
#   The concept review runs first because it is the cheap question. Deciding a
#   change should not exist at all after seven code specialists have picked
#   over its error handling wastes the specialists and, worse, anchors the
#   conversation on line-level detail that was never the point.
#
# Review and posting are separate
#   `code_review` reports and never edits, `comment_writer` words and never
#   judges, `post_review` publishes and never writes. An agent that reviews and
#   publishes in one pass grades its own work: it stops writing findings down
#   once it has phrased them, so whatever it dropped is invisible by the time
#   anyone reads the review. Splitting them forces every finding through a
#   written handoff, which is also what makes the triage list trustworthy.
#
#   `apply_triage` sits between the decision and the wording for the same
#   reason. A model handed every finding and told which to ignore can still
#   leak a dropped one into a summary line, and the person whose pull request
#   it is cannot tell that happened. Removing them first makes it impossible
#   rather than discouraged.
#   Publication validates exact ID coverage and checks fresh PR state/head before every POST.
#
# Triage
#   Every finding is put to you individually, prefixed BLOCKING or RECOMMENDED.
#   Four outcomes come from three choices plus the write-your-own path, because
#   a choice reading "reword it" would record that label and no wording —
#   choices carry no follow-up prompt. The third choice is the severity the
#   finding does not currently carry, so promoting or demoting one is a single
#   tap and the counts the review is written from follow the decision rather
#   than the reviewer's ranking. Skipping a question posts it as-is, so
#   "skip all remaining" means "post the rest verbatim", which is the fast path
#   once you have read the first few. Aborting posts nothing.
#
#   Nits never reach you. `code-review` ranks them separately and they are not
#   worth a decision each.
#
#   The follow-up triage works identically and shares the same choices, one
#   difference aside: it drops nothing on severity. A nit on a first pass is
#   noise nobody has seen. A nit you already raised in public is a point the
#   author read and did not act on, and withholding the second mention lets
#   them read agreement into your silence — so it still gets a decision.
#
# Inline comments
#   GitHub rejects an entire review with a 422 if one comment names a line
#   outside the diff, so a single bad anchor loses every comment. `post_review`
#   parses the diff from the worktree the review actually ran against, keeps
#   the comments it can anchor, and folds the rest into the review body. If the
#   POST is refused outright it retries once with everything in the body: a
#   review that reads slightly worse beats a review that was never posted. It
#   never retries a failure that might have been accepted, such as a timeout,
#   because that would post a second review to a real person's pull request.
#
# Working directories
#   Steps with no `working_dir` run in the directory you invoked
#   `conductor run` from, so the workflow targets whatever repository you are
#   standing in. The two review agents pin `working_dir` to the worktree, which
#   is the only reason it exists. `cleanup` deliberately does not, mirroring
#   the manual step of leaving a worktree before deleting it.
#
#   The scripts resolve through `{{ workflow.dir }}`, so they are found whether
#   the workflow is run by path or through a registry, from any repository.
#
# Only the merge-readiness recheck loops; reviews and CI are not repeated by that gate.
#
# Plugins
#   Each step declares the plugin whose skill it drives, rather than the
#   workflow enabling skill discovery and excluding everything it does not
#   want. An allowlist cannot leak: installing a new plugin later has no effect
#   on this run, where a blocklist silently grew.
#
#   Declaring the plugin also loads what the skill depends on. `code-review`
#   dispatches to the seven specialist subagents `prs` ships in `agents/`;
#   discovering the skill alone leaves it calling agents that are not there.
#
#     code_review                     prs@jason-tools      code-review
#     comment_writer                  writing@jason-tools  humanizer
#     followup_comment_writer         writing@jason-tools  humanizer
#
#   `followup_review` declares none. It reads files and runs git, both of
#   which it has without a plugin, and every review skill it could reach would
#   push it toward finding something new — which is the one thing a follow-up
#   must not do.
#
#   Entries are `plugin@marketplace`, so they resolve against the installed
#   `jason-tools` marketplace. To run this against a different marketplace,
#   rewrite the suffixes, or declare `runtime.plugin_sources` to fetch one by
#   git URL and make the workflow self-installing.
#
#   Nothing else is loaded. `merge-pr` in particular is absent, so a review
#   agent cannot merge the thing it is reviewing.
#
# Usage:
#   Run it from the repository the pull request belongs to.
#
#     conductor run workflows/pr-review/workflow.yaml --input pr=123
#
#   The reference can also be a URL or an `owner/repo#123` reference:
#     conductor run workflows/pr-review/workflow.yaml \
#       --input pr="https://github.com/owner/repo/pull/123"
#
#   Run it a second time on the same pull request and it verifies the review
#   it posted the first time instead of writing another one.
#
# Requires:
#   - git and gh (GitHub CLI) on PATH, with `gh auth status` passing
#   - python3 on PATH (used by every script step)
#   - The plugins listed above installed from the `jason-tools` marketplace

workflow:
  name: pr-review
  description: Reviews open pull requests for repository fit and implementation quality in isolated worktrees. Reuses passing CI, approves or retries runs only when needed, and reconciles current checks without duplicate findings. Follow-up runs track distinct earlier findings. Fixed points get a fix-confirmed reply and are resolved, unfixed ones are replied to on their original thread (reopened if resolved), and new problems become new inline comments. Validates approved finding coverage and the reviewed head before publishing. Approval and squash-merge require separate decisions; stopped runs remain resumable until explicitly discarded.
  version: "1.4.0"
  entry_point: bootstrap

  runtime:
    provider: copilot
    default_model: gpt-6-luna
    max_session_seconds: 3600
    checkpoint:
      every_agent: true   # human-gated run — keep it resumable after an
      keep_last: 5        # external interruption

  input:
    pr:
      type: string
      required: true
      description: "Pull request to review — a number (`123`), a full URL, or `owner/repo#123`. It must already exist; this workflow never opens one."
    ignored_checks:
      type: array
      required: false
      default: ["license/cla"]
      description: Exact, case-sensitive PR check names excluded from review-time waiting and findings. Pass [] to inspect all checks. Does not exclude Actions runs or relax merge requirements.
    merge:
      type: boolean
      required: false
      default: true
      description: Offer the separate human-confirmed merge flow after approval. False ends after publication and cleanup, without merge-readiness checks or merge gates.

  context:
    mode: explicit

  limits:
    max_iterations: 80

agents:
  # ---------------------------------------------------------------------------
  # Setup
  # ---------------------------------------------------------------------------

  - name: bootstrap
    description: Resolves the target repository and automatically selects a writable GitHub account without changing the global login
    type: script
    command: python3
    timeout: 120
    args:
      - "{{ workflow.dir }}/scripts/bootstrap.py"
    routes:
      - to: authentication_gate
        when: "{{ output.auth_error is defined and output.auth_error }}"
      - to: bootstrap_failed
        when: "{{ not output.ok }}"
      - to: pr_resolver

  - name: authentication_gate
    type: human_gate
    description: Pauses only when no configured GitHub identity can perform the review
    input:
      - bootstrap.output.error
    prompt: |
      ## GitHub access needs attention

      {{ bootstrap.output.error }}

      No review, worktree, CI action, or publication has started.
      Authenticate a suitable account or fix its repository permissions, then retry.
      Account selection is automatic; you do not need to choose one for each run.
      An explicit environment token must be fixed at launch and requires a new run.
    options:
      - label: Stop without reviewing
        value: stop
        route: bootstrap_failed
      - label: Retry the automatic authentication check
        value: retry
        route: bootstrap

  - name: bootstrap_failed
    type: terminate
    status: failed
    input:
      - bootstrap.output.error
    reason: "{{ bootstrap.output.error }}"

  - name: pr_resolver
    description: Reads the existing pull request with the preflight-selected GitHub identity
    type: script
    command: python3
    timeout: 120
    input:
      - workflow.input.pr
      - bootstrap.output.name_with_owner
      - bootstrap.output.gh_user
      - bootstrap.output.host
      - bootstrap.output.auth_source
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/pr_resolver.py"
      - "{{ workflow.input.pr }}"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ bootstrap.output.host }}"
    routes:
      - to: pr_authentication_gate
        when: "{{ output.auth_error is defined and output.auth_error }}"
      - to: wrong_repository
        when: "{{ output.name_with_owner is defined and output.name_with_owner | lower != bootstrap.output.name_with_owner | lower }}"
      - to: pr_resolver_failed
        when: "{{ not output.found }}"
      - to: pr_not_open
        when: "{{ output.state != 'OPEN' }}"
      - to: author_gate
        when: "{{ output.author | lower == output.gh_user | lower or output.author | lower in bootstrap.output.gh_logins | map('lower') | list }}"
      - to: pr_worktree

  - name: pr_authentication_gate
    type: human_gate
    description: Pauses when the selected credential cannot read the pull request
    input:
      - bootstrap.output.gh_user
      - pr_resolver.output.notes
    prompt: |
      ## GitHub could not read the pull request

      Account: `{{ bootstrap.output.gh_user }}`

      {{ pr_resolver.output.notes }}

      No review, worktree, CI action, or publication has started.
      Fix the account's access or authenticate another writable account, then
      retry preflight. Explicit environment-token changes require a new run.
    options:
      - label: Stop without reviewing
        value: stop
        route: pr_resolver_failed
      - label: Retry the automatic authentication check
        value: retry
        route: bootstrap

  - name: pr_not_open
    type: terminate
    status: success
    input:
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
    reason: "Stopped: {{ pr_resolver.output.pr_url }} is {{ pr_resolver.output.state }}. No worktree, review, CI action or publication was started."

  - name: wrong_repository
    type: terminate
    status: failed
    input:
      - workflow.input.pr
      - pr_resolver.output.name_with_owner
      - bootstrap.output.name_with_owner
    reason: "'{{ workflow.input.pr }}' belongs to {{ pr_resolver.output.name_with_owner }}, but this run started in {{ bootstrap.output.name_with_owner }}. The worktree and the posted review both target the repository you are standing in, so continuing would review one pull request and comment on another. Run this from {{ pr_resolver.output.name_with_owner }} instead."

  - name: pr_resolver_failed
    type: terminate
    status: failed
    input:
      - workflow.input.pr
      - pr_resolver.output.notes
    reason: "Pull request '{{ workflow.input.pr }}' could not be read from GitHub. {{ pr_resolver.output.notes }}"

  - name: author_gate
    type: human_gate
    description: Warns that you are about to review your own pull request, which posts comments rather than fixing anything
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - bootstrap.output.gh_logins
    prompt: |
      ## You are the author of #{{ pr_resolver.output.pr_number }}

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      The author is `{{ pr_resolver.output.author }}` and `gh` is
      authenticated as `{{ pr_resolver.output.gh_user }}`.
      {% if pr_resolver.output.author | lower != pr_resolver.output.gh_user | lower %}

      > Those are different logins, but both are accounts you are signed in
      > as, so this is still your own pull request. Anything posted here goes
      > up as `{{ pr_resolver.output.gh_user }}`.
      {% endif %}

      This workflow reviews and comments. It does not apply fixes, so on your
      own pull request it will post a review to yourself rather than change
      anything.

      That is still useful as a written record of what needs doing. If you
      wanted the findings applied instead, stop here and run the `code-review`
      skill directly.
    options:
      - label: Review it anyway and post the comments
        value: continue
        route: pr_worktree
      - label: Stop here
        value: stop
        route: stopped

  - name: pr_worktree
    description: Fetches the pull request head and checks it out into a throwaway worktree, so the review reads the code rather than a diff in a prompt
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.repo_root
      - bootstrap.output.worktrees_dir
      - bootstrap.output.name_with_owner
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_resolver.output.base_ref
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/pr_worktree.py"
      - "{{ bootstrap.output.repo_root }}"
      - "{{ bootstrap.output.worktrees_dir }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.base_ref }}"
    routes:
      - to: worktree_failed
        when: "{{ not output.ok }}"
      - to: prior_review

  - name: worktree_failed
    type: terminate
    status: failed
    input:
      - pr_worktree.output.error
    reason: "{{ pr_worktree.output.error }}"

  - name: prior_review
    description: Reads back everything you have already said on this pull request under any account you are signed in as, so a second visit checks your last review rather than writing another one
    type: script
    command: python3
    timeout: 180
    input:
      - bootstrap.output.name_with_owner
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_resolver.output.gh_user
      - bootstrap.output.gh_logins
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/prior_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_resolver.output.gh_user }}"
      - "{{ bootstrap.output.gh_logins | join(',') }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: unchanged_gate
        when: "{{ output.change_status in ['unchanged', 'unknown'] }}"
      - to: select_review

  - name: unchanged_gate
    type: human_gate
    description: Asks before reviewing unchanged content or content whose earlier baseline is unavailable
    input:
      - pr_resolver.output.pr_url
      - prior_review.output.change_status
      - prior_review.output.change_summary
      - prior_review.output.comparison_commit
      - pr_worktree.output.head_sha
    prompt: |
      {% if prior_review.output.change_status == 'unchanged' %}
      ## No code changes since your previous review
      {% else %}
      ## Changes since your previous review could not be determined
      {% endif %}

      {{ pr_resolver.output.pr_url }}

      {{ prior_review.output.change_summary }}

      Previous review commit: `{{ prior_review.output.comparison_commit or 'unavailable' }}`
      Current review commit: `{{ pr_worktree.output.head_sha }}`

      Neither review nor CI has started. Continue anyway, or exit without posting?
    options:
      - label: Continue reviewing anyway
        value: continue
        route: select_review
      - label: Exit without reviewing
        value: stop
        route: cleanup

  - name: select_review
    type: set
    input:
      - prior_review.output.has_prior_review
    values:
      followup: "{{ prior_review.output.has_prior_review }}"
    routes:
      - to: ci_start
        when: "{{ output.followup }}"
      - to: concept_review

  # ---------------------------------------------------------------------------
  # Concept review — the cheap question, asked first
  # ---------------------------------------------------------------------------

  - name: concept_review
    description: Judges whether the proposed goal belongs in the repository, assuming a correct implementation
    model: gpt-6-astra
    context_tier: long_context
    reasoning:
      effort: high
    plugins: []
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.base_ref
      - pr_worktree.output.base_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
    system_prompt: |
      Assess whether the intent of this pull request logically belongs in this
      repository. The question is: if this proposal were implemented perfectly,
      would it be a sensible addition to this project?

      Establish the repository's purpose, intended users, supported use cases,
      explicit non-goals, and ownership boundaries from its README, contributor
      guidance and design documentation. Read the PR description and linked
      issue to understand the actual problem and intended outcome. Skim the
      diff only to establish what capability or policy the PR proposes.

      Do not invoke a broader review skill. This is a product-scope and
      repository-fit assessment, not an implementation or integration audit.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not comment on GitHub. A later
      step publishes what a human approves, and it can only publish what you
      actually wrote down.

      Exclude code bugs, missing wiring, API correctness, edge cases, tests,
      error handling, security defects, style, naming, documentation coverage
      and refactoring suggestions. Those belong exclusively to code review.
      A defect fixable without changing the proposed goal is not a conceptual
      finding. Do not disguise an implementation defect as a "logical gap."
    prompt: |
      For read-only GitHub queries, replace the `gh` command with:
      `python3 "{{ workflow.dir }}/scripts/github_auth.py" "{{ bootstrap.output.host }}" "{{ bootstrap.output.gh_user }}" "{{ bootstrap.output.auth_source }}" gh`.
      Never run `gh auth switch`; it changes the login of concurrent workflows.

      Review pull request #{{ pr_resolver.output.pr_number }} as a proposed
      change to this project.

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out again.
      The diff against the base branch is:

      ```
      git diff {{ pr_worktree.output.base_sha }}...HEAD
      ```

      ## What to report

      Explain the problem the PR intends to solve, who needs it, and why that
      responsibility belongs here rather than in another project, plugin or
      layer. Assess whether the proposed behavior coheres with this project's
      documented purpose and product model.

      Examples of valid objections: an unrelated feature in a focused library,
      a use case the project explicitly excludes, or moving responsibility
      into a component whose documented role contradicts it. Cite concrete
      repository evidence, not personal taste or hypothetical future costs.

      Examples to exclude: a missing registration, an unhandled exception,
      incomplete tests, or an implementation that fails its otherwise sound
      goal. The code review owns all of those.

      New functionality is not out of scope merely because it is new. Do not
      invent requirements or infer a non-goal from the absence of a feature.
      If intent is unclear, record a product question rather than a code finding.

      If there are no material gaps, say so and return empty lists. Do not
      manufacture findings to look thorough — a clean concept review is a
      real result, and it is the one that lets the code review start.
    output:
      verdict:
        type: string
        description: Exactly one of good_addition, good_addition_with_changes, needs_rethinking, not_a_good_fit
      summary:
        type: string
        description: The core change in a few sentences — the problem, the audience, the approach and the expected value
      how_surfaced:
        type: string
        description: Intended audience and use case for the proposed capability, not an audit of UI or API wiring
      project_fit:
        type: string
        description: How the proposed goal aligns with the repository's documented purpose, non-goals and responsibility boundaries
      blocking:
        type: array
        description: Material conflicts between the proposed intent and repository scope or product model, with evidence and a recommendation about scope. Never code defects. Empty when nothing blocks.
      important:
        type: array
        description: Nonblocking concerns about the proposed scope or product responsibility, supported by repository evidence. Never missing implementation or integration work.
      open_questions:
        type: array
        description: Missing intent or product context that prevents a confident assessment. Empty when there are none.
      strengths:
        type: array
        description: What is coherent, valuable or well aligned with the project
    routes:
      - to: concept_gate
        when: "{{ (output.blocking | length) > 0 or output.verdict in ['needs_rethinking', 'not_a_good_fit'] }}"
      - to: ci_start

  - name: concept_gate
    type: human_gate
    description: The stop-or-continue checkpoint — the concept review found something that questions whether the change should proceed at all
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.notes
      - concept_review.output.verdict
      - concept_review.output.summary
      - concept_review.output.how_surfaced
      - concept_review.output.project_fit
      - concept_review.output.strengths
      - concept_review.output.blocking
      - concept_review.output.important
      - concept_review.output.open_questions
    prompt: |
      ## Concept review — #{{ pr_resolver.output.pr_number }}

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. A review still posts to it.
      {% endif %}
      {% if pr_resolver.output.notes %}

      > {{ pr_resolver.output.notes }}
      {% endif %}

      **Verdict:** `{{ concept_review.output.verdict }}`

      {{ concept_review.output.summary }}

      {% if (concept_review.output.blocking | length) > 0 %}
      ### Blocking

      {% for item in concept_review.output.blocking %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.important | length) > 0 %}
      ### Important

      {% for item in concept_review.output.important %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.open_questions | length) > 0 %}
      ### Open questions

      {% for item in concept_review.output.open_questions %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}

      ### Project fit

      {{ concept_review.output.project_fit }}

      ### How it reaches people

      {{ concept_review.output.how_surfaced }}
      {% if (concept_review.output.strengths | length) > 0 %}

      ### What works

      {% for item in concept_review.output.strengths %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ---

      Continuing runs the full code review and puts every finding to you
      individually before anything is posted.

      Posting publishes everything above as a review comment and stops,
      without the code review ever running. That is the right call when the
      change needs rethinking: line-level comments on code that may not
      survive the conversation waste everyone's time.
    options:
      - label: Continue to the code review
        value: continue
        route: ci_start
      - label: Post these concept findings and stop
        value: post_concept
        route: comment_writer
      - label: Stop without posting anything
        value: stop
        route: cleanup

  # ---------------------------------------------------------------------------
  # Code review
  # ---------------------------------------------------------------------------

  - name: ci_start
    description: Approves pending or reruns non-passing Actions runs for the exact head being reviewed, reusing runs that already passed
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - concept_review.output.verdict?
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/ci.py"
      - start
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
    routes:
      - to: ci_authentication_gate
        when: "{{ output.auth_error is defined and output.auth_error }}"
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: followup_review
        when: "{{ concept_review is not defined }}"
      - to: code_review

  - name: ci_authentication_gate
    type: human_gate
    description: Stops before code review when GitHub refuses the selected account's CI access
    input:
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - ci_start.output.error
    prompt: |
      ## CI could not start with the selected GitHub account

      Account: `{{ bootstrap.output.gh_user }}`

      {{ ci_start.output.error }}

      Code review has not started on this pass. Restore this account's access
      or refresh its stored credential, then retry CI. Already running or passing
      runs will be reused. No global account switch is needed.
      To use another identity or change an explicit environment token, stop and
      launch a new run so the author and prior-review checks use that identity too.
    options:
      - label: Stop and clean up without reviewing
        value: stop
        route: cleanup
      - label: Retry CI with the selected account
        value: retry
        route: ci_start

  - name: code_review
    description: Runs the specialist code review and reports what it found, without touching the code or GitHub
    model: gpt-6-astra 
    context_tier: long_context
    reasoning:
      effort: high
    plugins:
      # `code-review` dispatches to the seven specialist subagents the plugin
      # ships in `agents/` (code-reviewer, pr-test-analyzer, silent-failure-
      # hunter, type-design-analyzer, comment-analyzer, code-simplifier,
      # dead-code-finder). Loading the plugin brings the skill AND those
      # subagents; loading the skill alone leaves it dispatching to agents that
      # do not exist.
      - prs@jason-tools       # code-review
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.base_ref
      - pr_worktree.output.base_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
    system_prompt: |
      You invoke the `code-review` skill and report its findings. The skill
      owns which specialists run and how findings are ranked — follow it as
      written for everything up to and including the aggregated summary.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not create a GitHub review or
      comment. The skill's post-review section does not apply here: a later
      step publishes exactly what a human approves.

      A finding you phrase vaguely is one the human cannot judge and the
      writer cannot word. Every finding must stand on its own — someone
      reading only that entry should know what is wrong, where, and what to
      do about it.
    prompt: |
      For read-only GitHub queries, replace the `gh` command with:
      `python3 "{{ workflow.dir }}/scripts/github_auth.py" "{{ bootstrap.output.host }}" "{{ bootstrap.output.gh_user }}" "{{ bootstrap.output.auth_source }}" gh`.
      Pass this prefix to review subagents too. Never run `gh auth switch`;
      it changes the login of concurrent workflows.

      Review pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}**.

      /code-review #{{ pr_resolver.output.pr_number }}

      Report the findings. Do not apply any fixes and do not post anything.

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out
      again. The diff under review is:

      ```
      git diff {{ pr_worktree.output.base_sha }}...HEAD
      ```

      ## How to report findings

      Return one entry per finding in `findings`. Each entry is an object:

      ```json
      {
        "severity": "BLOCKING",
        "path": "src/thing.ts",
        "line": 42,
        "title": "Token expiry is never checked",
        "body": "What is wrong and why it matters, in enough detail to act on without re-reviewing.",
        "suggestion": "The concrete change, as code when a short snippet says it best."
      }
      ```

      - `severity` is `BLOCKING` or `RECOMMENDED`. Nothing else. **Leave nits
        out entirely** — they are not worth a human decision each.
      - `path` is repository-relative, exactly as it appears in the diff.
      - `line` is the line **in the new version of the file**, and it must be
        a line this pull request actually adds or touches. A comment anchored
        outside the diff cannot be attached inline, so a wrong line quietly
        demotes the finding into the review body. Omit `line` rather than
        guess.
      - `body` is prose for the pull request author, not a note to yourself.
        Do not reference the specialist that found it.

      Findings with no single location — an architectural objection, a missing
      test suite — belong in `findings` too, with `path` and `line` omitted.

      Finding nothing is a legitimate result. Return an empty list rather than
      padding it.
    output:
      findings:
        type: array
        description: 'One object per finding: {"severity": "BLOCKING"|"RECOMMENDED", "path": "...", "line": 42, "title": "...", "body": "...", "suggestion": "..."}. Nits excluded. `path` and `line` omitted when the finding has no single location. Empty when the review found nothing.'
      summary:
        type: string
        description: The review's overall assessment of the pull request, for the top of the posted review
      merge_readiness:
        type: string
        description: One of ready, needs_work, do_not_merge
    routes:
      - to: ci_wait

  - name: ci_wait
    description: Waits for CI and records failures, missing runs or unverifiable results as blocking feedback
    type: script
    command: python3
    timeout: 2100
    input:
      - bootstrap.output.name_with_owner
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - ci_start.output
      - workflow.input.ignored_checks
      - code_review.output.findings?
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/ci.py"
      - wait
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ workflow.input.ignored_checks | tojson }}"
    stdin: "{{ ci_start.output | tojson }}"
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: build_followup_questions
        when: "{{ code_review is not defined }}"
      - to: build_questions

  - name: build_questions
    description: Turns the findings into strictly shaped question objects, so a stray key from the reviewer cannot abort the triage node after the review has been paid for
    type: script
    command: python3
    timeout: 60
    input:
      - code_review.output.findings
      - ci_wait.output.findings
    args:
      - "{{ workflow.dir }}/scripts/build_questions.py"
    stdin: '{"code_findings": {{ code_review.output.findings | tojson }}, "ci_findings": {{ ci_wait.output.findings | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: review_clear_gate
        when: "{{ output.question_count == 0 }}"
      - to: triage

  - name: triage
    type: questions
    description: Puts every finding to you individually inside a single step, so answers can be revised with Back and the whole set costs one iteration
    source: build_questions.output.questions
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.notes
      - build_questions.output.question_count
      - build_questions.output.blocking_count
      - build_questions.output.recommended_count
    prompt: |
      ## #{{ pr_resolver.output.pr_number }} — {{ build_questions.output.question_count }} finding{{ 's' if build_questions.output.question_count != 1 else '' }} to decide

      {{ build_questions.output.blocking_count }} blocking, {{ build_questions.output.recommended_count }} recommended.
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}
      Note: this pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}.
      {% endif %}
      Nothing is posted yet. Skip = post as-is; abort = post nothing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: cleanup
    routes:
      - to: apply_triage

  - name: apply_triage
    description: Applies your decisions to the findings before any model sees them, so a finding you dropped cannot leak into the review
    type: script
    command: python3
    timeout: 60
    input:
      - build_questions.output.findings
      - triage.output.items
    args:
      - "{{ workflow.dir }}/scripts/apply_triage.py"
    stdin: '{"findings": {{ build_questions.output.findings | tojson }}, "items": {{ triage.output.items | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: review_clear_gate
        when: "{{ output.approved_count == 0 }}"
      - to: comment_writer

  - name: review_clear_gate
    type: human_gate
    description: Offers LGTM when the full review has no findings left to post
    input:
      - workflow.input.merge
      - pr_resolver.output.pr_url
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - ci_wait.output.summary
      - apply_triage.output.dropped_count?
    prompt: |
      ## No findings left to post

      {{ pr_resolver.output.pr_url }}

      {% if apply_triage is defined %}
      You dropped all {{ apply_triage.output.dropped_count }} findings at triage.
      This does not mean the original findings or CI failures were resolved.
      {% else %}
      The code review and CI produced no blocking or recommended findings.
      {% endif %}

      **CI:** {{ ci_wait.output.summary }}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      GitHub will refuse an approval from the PR author.
      {% endif %}

      Approving posts a short LGTM with thanks tailored to this contribution.
      {% if workflow.input.merge %}
      Afterwards, a separate gate shows current merge readiness and asks whether to merge.
      {% else %}
      Merging is disabled for this run; approval is followed by cleanup and completion.
      {% endif %}
    options:
      - label: Approve with a personal thank-you
        value: approve
        route: approval_writer
      - label: Post nothing
        value: stop
        route: cleanup

  # ---------------------------------------------------------------------------
  # Wording and posting
  # ---------------------------------------------------------------------------

  - name: comment_writer
    description: Words each approved finding by ID, leaving placement and coverage validation to Python
    model: gpt-6-luna
    context_tier: long_context
    reasoning:
      effort: medium
    plugins:
      - writing@jason-tools   # humanizer
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - concept_gate.output.selected?
      - concept_review.output.summary?
      - concept_review.output.verdict?
      - concept_review.output.how_surfaced?
      - concept_review.output.project_fit?
      - concept_review.output.strengths?
      - concept_review.output.blocking?
      - concept_review.output.important?
      - concept_review.output.open_questions?
      - apply_triage.output.approved?
      - apply_triage.output.approved_count?
      - apply_triage.output.blocking_count?
      - apply_triage.output.recommended_count?
    system_prompt: |
      You write the review that gets posted to a pull request. You are the
      last step before it is public, and you are writing to its author.

      You decide nothing. Which findings are posted was settled by a human,
      one at a time, and everything they dropped was removed before you were
      called — what you are given is exactly what goes out. Do not add a
      finding nobody raised, do not merge two into one, and do not soften a
      blocking finding into a suggestion.

      The severity on each finding is theirs too, not the reviewer's: they can
      promote or demote one at triage, so a finding may read more or less
      severely than its label. The label wins. Write it at the weight it
      carries and let the wording follow.

      Your job is wording, not placement.

      Every comment goes through the `humanizer` skill before you return it.
      Apply it properly — draft, audit what still reads as machine-generated,
      then revise. Do not just delete em dashes and call it done.

      Open the main review with brief, genuine appreciation for the contribution,
      then transition to the feedback. Be warm without exaggerated praise or
      implying approval when concerns remain. Vary the wording to suit this PR;
      do not copy a stock thank-you. Keep individual findings direct and specific,
      without repeating the greeting on each inline comment. No emoji.
    prompt: |
      {% if concept_gate is defined and concept_gate.output.selected == 'post_concept' %}
      Write a review of pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}** — from a concept review. The human
      chose to publish these findings and stop, so no code review ran and there
      are no line-level findings to place. Return an empty `items` array.

      The review body is the whole artefact. Start by thanking the author for
      proposing the change, even if it needs rethinking. Then explain the
      verdict and findings without suggesting that the proposal is approved.

      **Verdict:** `{{ concept_review.output.verdict }}`

      **The change:** {{ concept_review.output.summary }}

      **How it reaches people:** {{ concept_review.output.how_surfaced }}

      **Project fit:** {{ concept_review.output.project_fit }}
      {% if (concept_review.output.strengths | length) > 0 %}

      ## What works

      Open with these. On a change that may need rethinking, what to keep is
      as useful to the author as what to fix, and it is the difference between
      a review they can act on and one they argue with.

      {% for item in concept_review.output.strengths %}
      - {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.blocking | length) > 0 %}
      ## Blocking

      {% for item in concept_review.output.blocking %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.important | length) > 0 %}
      ## Important

      {% for item in concept_review.output.important %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}
      {% if (concept_review.output.open_questions | length) > 0 %}
      ## Open questions

      Put these to the author as questions, not as findings. They are things
      the review could not determine, not things the author got wrong.

      {% for item in concept_review.output.open_questions %}
      {{ loop.index }}. {{ item }}
      {% endfor %}
      {% endif %}

      Return the concept review, including that warm opening, in `review_body`.
      Set `opening` to "" because it is already part of the concept review body.
      {% else %}
      Write a review of pull request #{{ pr_resolver.output.pr_number }} —
      **{{ pr_resolver.output.pr_title }}**.

      ## The findings

      These are the {{ apply_triage.output.approved_count }} finding{{ 's' if apply_triage.output.approved_count != 1 else '' }}
      a human approved for posting: {{ apply_triage.output.blocking_count }}
      blocking and {{ apply_triage.output.recommended_count }} recommended.
      Findings they dropped are already gone and you never see them, so
      everything below is posted and nothing else is.

      {% for finding in apply_triage.output.approved %}
      ---

      ### `{{ finding.id }}` — {{ finding.severity }}: {{ finding.title }}

      {% if finding.path %}**Location:** `{{ finding.path }}{% if finding.line %}:{{ finding.line }}{% endif %}`{% else %}**Location:** none — this finding has no single line{% endif %}

      {{ finding.body }}
      {% if finding.suggestion %}
      **Suggested fix:** {{ finding.suggestion }}
      {% endif %}
      {% if finding.guidance %}
      **The human's instruction for this one:** {{ finding.guidance }}

      That is how they want it posted. Apply it — soften the tone, add the
      context, or narrow the ask as they described. Their wording wins over
      the reviewer's.
      {% endif %}
      {% endfor %}

      ---

      ## How to lay it out

      Return one object in `items` for EVERY approved finding, including
      findings with no line or path:

      ```json
      {"finding_id": "b1", "body": "The complete finding, in markdown."}
      ```

      Copy the approved finding's `id` into `finding_id` exactly once.
      Return only those two keys. Python uses the approved location to choose
      inline or body placement; you never choose or invent an anchor.

      Include a ```suggestion``` block in the body wherever the fix is a short,
      concrete edit to those exact lines. Getting the indentation right matters:
      the author applies it with one click.

      Prefix each finding with **BLOCKING** or **RECOMMENDED** so its
      weight is obvious without opening the summary.

      Return a separate `opening`: one or two sentences thanking the author
      for this contribution and introducing the feedback. Use only the PR
      title and approved findings above, never the earlier concept assessment
      or dropped findings. When blocking findings remain, explain that there
      are points to address before moving forward. When all are recommended,
      introduce them as suggestions, not merge blockers. Do not enumerate
      findings in the opening or claim a bug is fixed simply because it is
      the PR's goal.

      Set `review_body` to "" on this path. Python places the opening before
      the counts and preserves each finding exactly once. Never drop a finding
      you cannot anchor.
      {% endif %}
    output:
      opening:
        type: string
        description: Brief appreciative opening and transition based only on the title and approved findings; empty only for concept reviews.
      review_body:
        type: string
        description: Concept-only review prose; empty for structured finding reviews.
      items:
        type: array
        description: 'Every approved ID exactly once as {"finding_id": "b1", "body": "Nonempty complete finding"}. Empty only on the concept-only path.'
    routes:
      - to: post_review

  - name: post_review
    description: Posts one review to the pull request, anchoring inline comments to the diff wherever it can and folding the rest into the body
    type: script
    command: python3
    timeout: 300
    input:
      - bootstrap.output.name_with_owner
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_worktree.output.head_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.base_sha
      - pr_worktree.output.remote
      - comment_writer.output.review_body
      - comment_writer.output.opening
      - comment_writer.output.items
      - apply_triage.output.approved?
      - concept_gate.output.selected?
    args:
      - "{{ workflow.dir }}/scripts/github_auth.py"
      - "{{ bootstrap.output.host }}"
      - "{{ bootstrap.output.gh_user }}"
      - "{{ bootstrap.output.auth_source }}"
      - "{{ workflow.dir }}/scripts/post_review.py"
      - "{{ bootstrap.output.name_with_owner }}"
      - "{{ pr_resolver.output.pr_number }}"
      - "{{ pr_worktree.output.head_sha }}"
      - "{{ pr_worktree.output.worktree_path }}"
      - "{{ pr_worktree.output.base_sha }}"
      - "{{ pr_worktree.output.remote }}"
      - "COMMENT"
    stdin: >-
      {% if concept_gate is defined and concept_gate.output.selected == 'post_concept' %}
      {"mode": "concept", "body": {{ comment_writer.output.review_body | tojson }}}
      {% else %}
      {"mode": "findings", "opening": {{ comment_writer.output.opening | tojson }}, "approved": {{ apply_triage.output.approved | tojson }}, "items": {{ comment_writer.output["items"] | tojson }}}
      {% endif %}
    routes:
      - to: cleanup

  # ---------------------------------------------------------------------------
  # Follow-up review — the second visit, taken instead of everything above
  # ---------------------------------------------------------------------------

  - name: followup_review
    description: Checks each point you raised last time against the code as it stands now, rather than reviewing the pull request from scratch
    model: gpt-6-astra 
    context_tier: long_context
    reasoning:
      effort: high
    working_dir: "{{ pr_worktree.output.worktree_path }}"
    input:
      - bootstrap.output.host
      - bootstrap.output.gh_user
      - bootstrap.output.auth_source
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.base_ref
      - pr_worktree.output.base_sha
      - pr_worktree.output.worktree_path
      - pr_worktree.output.branch
      - pr_worktree.output.remote
      - prior_review.output.prior_items
      - prior_review.output.context_comments
      - prior_review.output.last_interaction_at
      - prior_review.output.last_review_at
      - prior_review.output.last_review_state
      - prior_review.output.last_review_commit
      - prior_review.output.items_dropped
    system_prompt: |
      You check a review you have already given against the code as it stands
      now. A first pass already happened, the author has read it, and running
      one again would re-derive points they have acted on and post them a
      second time as though nobody read their replies.

      Your unit of work is the point, not the comment. One comment that raised
      three separate things is three entries. One thing you said twice is one.

      Decide from the code, not from the conversation. "Fixed, thanks" is a
      claim, and this step exists because claims and diffs disagree. Open the
      file and look. Where the code cannot settle it, say `unclear` rather
      than guessing in either direction — the human decides what to do with an
      unclear point, and they cannot if you have already decided for them.

      Keep the two kinds of result apart. Everything in `items` is a point you
      made before. A problem you did not raise before, but which the change
      since your review has introduced, goes in `new_items` and nowhere else,
      so it is never presented to the author as something they already read
      and ignored. Report only problems in code this pull request adds or
      changes, do not re-review what was already covered, and leave
      `new_items` empty when there is nothing.

      You are a reviewer, not an implementer and not a publisher. Do not edit
      files, do not commit, do not push, and do not comment on GitHub. A later
      step publishes what a human approves, and it can only publish what you
      actually wrote down.
    prompt: |
      For read-only GitHub queries, replace the `gh` command with:
      `python3 "{{ workflow.dir }}/scripts/github_auth.py" "{{ bootstrap.output.host }}" "{{ bootstrap.output.gh_user }}" "{{ bootstrap.output.auth_source }}" gh`.
      Never run `gh auth switch`; it changes the login of concurrent workflows.

      You have reviewed pull request #{{ pr_resolver.output.pr_number }}
      before. Work out what became of each point you made.

      **{{ pr_resolver.output.pr_title }}**
      {{ pr_resolver.output.pr_url }}

      ## What you said
      {% if prior_review.output.last_review_state %}

      Your last review was submitted {{ prior_review.output.last_review_at }}
      as `{{ prior_review.output.last_review_state }}`.
      {% else %}

      Your last comment was {{ prior_review.output.last_interaction_at }}.
      {% endif %}
      {% for item in prior_review.output.prior_items %}

      ---

      ### `{{ item.id }}` — {{ item.kind }} (source type: {{ item.source_type }}){% if item.path %} on `{{ item.path }}{% if item.line %}:{{ item.line }}{% endif %}`{% endif %}

      {{ item.body }}
      {% if (item.replies | length) > 0 %}
      **What came back:**
      {% for reply in item.replies %}
      - **{{ reply.author }}**: {{ reply.body }}
      {% endfor %}
      {% endif %}
      {% endfor %}

      ---
      {% if prior_review.output.items_dropped %}

      > {{ prior_review.output.items_dropped }} older comment{{ 's' if prior_review.output.items_dropped != 1 else '' }} of yours could not be shown here. Say so in `summary` — a human is told what is settled based on what you report, and they should know the account is partial.
      {% endif %}
      {% if (prior_review.output.context_comments | length) > 0 %}

      ## Said on the pull request since

      {% for comment in prior_review.output.context_comments %}
      - **{{ comment.author }}**: {{ comment.body }}
      {% endfor %}
      {% endif %}

      ## Where the code is

      It is already checked out for you at
      `{{ pr_worktree.output.worktree_path }}`, on branch
      `{{ pr_worktree.output.branch }}`, and that is your working directory.
      **Do not create another worktree** and do not check the branch out again.
      {% if prior_review.output.last_review_commit %}

      What has moved since you looked:

      ```
      git diff {{ prior_review.output.last_review_commit }}...HEAD
      ```

      If that commit is not in the worktree, the branch was force-pushed after
      your review and its history no longer holds what you read. Fall back to
      the whole diff and check every point against the current file:

      ```
      git diff {{ pr_worktree.output.base_sha }}...HEAD
      ```
      {% else %}

      No commit is recorded against your earlier comments, so check every point
      against the current file. The whole diff is:

      ```
      git diff {{ pr_worktree.output.base_sha }}...HEAD
      ```
      {% endif %}

      A diff tells you what moved, never whether a point was addressed. A
      change can touch the exact lines you commented on and still not do what
      you asked, and a point can be settled by an edit somewhere else entirely.
      Read the file.

      ## What to report

      One entry in `items` per point you made. Each entry is an object:

      ```json
      {
        "source_ids": ["p1", "p3"],
        "source_type": "code",
        "status": "not_addressed",
        "severity": "BLOCKING",
        "path": "src/thing.ts",
        "line": 42,
        "title": "Token expiry is never checked",
        "original": "What you asked for, narrowed to the ask itself.",
        "evidence": "What the code does now, naming the file and line you read.",
        "recommendation": "What is left to do. Empty when nothing is."
      }
      ```

      - `source_ids` lists EVERY `p...` source of this distinct point, including
        summary and inline duplicates. Several points may share one source
        when a body raises multiple concerns. Do not count the summary as an
        additional finding or discard its body-only points.
      - `source_type` is `code` or `ci`. Items with verified `ci` provenance
        belong to the final CI check, not a code-based status assessment.
        Legacy CI-only points may be explicitly classified `ci`; split mixed
        code/CI comments into separate points. Never label code feedback CI.
      - `duplicate_sources` accounts for a legacy summary not cited in items:
        {"source_id": "p1", "covered_by": ["p2", "p3"], "evidence": "Every point in p1 duplicates these examined sources."}
        Use this ONLY after reading all its content. Every covered source
        must itself be cited by an item. Body-only and additional points must
        have their own entries, not be hidden by a duplicate mapping.
      - `status` is exactly one of:
        - `addressed` — the code now does what you asked.
        - `partially_addressed` — some of it landed and some did not. Say
          which in `evidence`.
        - `not_addressed` — the code is unchanged in the respect you raised.
        - `obsolete` — the point no longer applies, because the code it
          concerned is gone or the design moved past it. Keep this separate
          from `addressed`: one means they did it, the other means nobody
          needs to.
        - `unclear` — the code did not settle it.
      - `severity` is `BLOCKING` or `RECOMMENDED`, judged as the point stands
        today rather than as you filed it last time. Nothing else.
      - `path` is repository-relative, exactly as it appears in the diff.
      - `line` is the line **in the current version of the file**, and it must
        be a line this pull request adds or touches. An anchor outside the diff
        cannot be attached inline, so a wrong line quietly demotes the point
        into the review body. Omit `line` rather than guess, and omit both for
        a point with no single location.
      - `original` and `evidence` are prose for the author. Do not quote
        comment ids at them and do not write them as notes to yourself.

      Every point above appears exactly once. Something you said that was never
      a finding — a question, a thank-you, an answer to someone else — is
      `obsolete`.

      ## New problems

      `new_items` holds problems that were not in what you said before. Each
      entry has the same fields as an item except `source_ids`, `status` and
      `duplicate_sources`, which are omitted, and `source_type` is always
      `code`. `path` and `line` must anchor to a line this pull request adds or
      touches so it can be posted inline.

      Everything having been addressed is a real and common result. Report it
      plainly rather than hunting for something still wrong to justify the pass.
    output:
      items:
        type: array
        description: 'One object per distinct point with source_ids, source_type (code or ci), status, severity, path, line, title, original, evidence and recommendation. Cite every duplicate source; split multi-point bodies.'
      duplicate_sources:
        type: array
        description: 'Explicit whole-source duplicate accounting: {"source_id": "p1", "covered_by": ["p2", "p3"], "evidence": "Why all content is covered"}. Empty unless fully examined duplicates remain uncited.'
      new_items:
        type: array
        description: 'Problems not raised before, introduced by the change since your review: severity, path, line, title, original, evidence, recommendation and source_type code. Empty when there are none.'
      summary:
        type: string
        description: Where the pull request now stands against your earlier review, in a few sentences
      changes_since:
        type: string
        description: What the author changed since your review, read from the diff rather than from their replies. Empty when nothing has changed.
      verdict:
        type: string
        description: Exactly one of all_addressed, partially_addressed, not_addressed
    routes:
      - to: ci_wait

  - name: build_followup_questions
    description: Reconciles earlier feedback, counts settled points, and turns outstanding points and current CI problems into triage questions
    type: script
    command: python3
    timeout: 60
    input:
      - followup_review.output.items
      - followup_review.output.new_items
      - followup_review.output.duplicate_sources
      - prior_review.output.prior_items
      - ci_wait.output.findings
    args:
      - "{{ workflow.dir }}/scripts/build_followup_questions.py"
    # Legacy sources must be examined before summary duplicates or superseded CI can be excluded.
    stdin: '{"items": {{ followup_review.output["items"] | tojson }}, "new_items": {{ followup_review.output["new_items"] | default([]) | tojson }}, "duplicate_sources": {{ followup_review.output.duplicate_sources | tojson }}, "prior_items": {{ prior_review.output.prior_items | tojson }}, "ci_findings": {{ ci_wait.output.findings | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: followup_clear_gate
        when: "{{ output.question_count == 0 }}"
      - to: followup_triage

  - name: followup_triage
    type: questions
    description: Puts every still-open point to you individually, so raising one a second time is a decision rather than a default
    source: build_followup_questions.output.questions
    input:
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - followup_review.output.summary
      - followup_review.output.changes_since
      - build_followup_questions.output.question_count
      - build_followup_questions.output.blocking_count
      - build_followup_questions.output.recommended_count
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.ci_count
      - build_followup_questions.output.new_count
      - build_followup_questions.output.confirmations
    prompt: |
      ## Follow-up on #{{ pr_resolver.output.pr_number }} — {{ build_followup_questions.output.question_count }} to decide

      {{ build_followup_questions.output.blocking_count }} blocking, {{ build_followup_questions.output.recommended_count }} recommended
      ({{ build_followup_questions.output.new_count }} new, {{ build_followup_questions.output.ci_count }} CI).
      {{ build_followup_questions.output.addressed_count }} earlier point{{ 's' if build_followup_questions.output.addressed_count != 1 else '' }} addressed{% if build_followup_questions.output.obsolete_count %}, {{ build_followup_questions.output.obsolete_count }} moot{% endif %}.
      Nothing is posted yet. Skip = post as-is; abort = post nothing.
    allow_back: true
    allow_skip: true
    allow_skip_all: true
    allow_abort: true
    abort_route: cleanup
    routes:
      - to: apply_followup_triage

  - name: apply_followup_triage
    description: Applies your decisions before any model sees them — the same script the first-pass triage uses, so a point you let go is gone by the same guarantee
    type: script
    command: python3
    timeout: 60
    input:
      - build_followup_questions.output.findings
      - followup_triage.output.items
    args:
      - "{{ workflow.dir }}/scripts/apply_triage.py"
    stdin: '{"findings": {{ build_followup_questions.output.findings | tojson }}, "items": {{ followup_triage.output.items | tojson }}}'
    routes:
      - to: cleanup
        when: "{{ not output.ok }}"
      - to: followup_clear_gate
        when: "{{ output.approved_count == 0 }}"
      - to: followup_blocking_gate
        when: "{{ output.blocking_count > 0 }}"
      - to: followup_gate

  - name: followup_gate
    type: human_gate
    description: The publish decision when points from your earlier review are still open
    input:
      - workflow.input.merge
      - pr_resolver.output.pr_number
      - pr_resolver.output.pr_title
      - pr_resolver.output.pr_url
      - pr_resolver.output.state
      - pr_resolver.output.is_draft
      - pr_resolver.output.author
      - pr_resolver.output.gh_user
      - prior_review.output.last_review_at
      - prior_review.output.last_interaction_at
      - prior_review.output.matched_logins
      - prior_review.output.other_login_items
      - followup_review.output.summary
      - followup_review.output.changes_since
      - build_followup_questions.output.addressed_count
      - build_followup_questions.output.obsolete_count
      - build_followup_questions.output.resolved
      - apply_followup_triage.output.approved_count
      - apply_followup_triage.output.blocking_count
      - apply_followup_triage.output.recommended_count
      - apply_followup_triage.output.dropped_count
      - ci_wait.output.summary
      - build_followup_questions.output.confirmations
      - prior_review.output.thread_error
    prompt: |
      ## Follow-up on #{{ pr_resolver.output.pr_number }} — {{ pr_resolver.output.pr_title }}

      {{ pr_resolver.output.pr_url }}
      {% if pr_resolver.output.state != 'OPEN' or pr_resolver.output.is_draft %}

      > This pull request is {% if pr_resolver.output.is_draft %}a draft{% if pr_resolver.output.state != 'OPEN' %} and {% endif %}{% endif %}{% if pr_resolver.output.state != 'OPEN' %}{{ pr_resolver.output.state | lower }}{% endif %}. Anything you choose here still posts to it.
      {% endif %}
      {% if pr_resolver.output.author | lower == pr_resolver.output.gh_user | lower %}

      > This is your own pull request. GitHub refuses an approval from the author, so that option will fail here.
      {% endif %}
      {% if prior_review.output.other_login_items %}

      > The review being followed up on was posted as {{ prior_review.output.matched_logins | join(', ') }}, and `gh` is now active as `{{ pr_resolver.output.gh_user }}`. Anything you publish here goes up under `{{ pr_resolver.output.gh_user }}`, so the pull request will show one reviewer under two names. Run `gh auth switch` and start again if you would rather keep them together.
      {% endif %}

      {{ followup_review.output.summary }}
      {% if followup_review.output.changes_since %}

      **What changed since {{ prior_review.output.last_review_at or prior_review.output.last_interaction_at }}:** {{ followup_review.output.changes_since }}
      {% endif %}
      {% if (build_followup_questions.output.resolved | length) > 0 %}

      ### Settled

      {% for item in build_followup_questions.output.resolved %}
      - {{ item }}
      {% endfor %}
      {% endif %}

      ### Still open

      **CI:** {{ ci_wait.output.summary }}

      You kept {{ apply_followup_triage.output.approved_count }} point{{ 's' if apply_followup_triage.output.approved_count != 1 else '' }} —
      {{ apply_followup_triage.output.blocking_count }} blocking and
      {{ apply_followup_triage.output.recommended_count }} recommended{% if apply_followup_triage.output.dropped_count %}, and let {{ apply_followup_triage.output.dropped_count }} go{% endif %}.

      {% if (build_followup_questions.output.confirmations | length) > 0 %}
      Approving or commenting first replies "Fix confirmed" on {{ build_followup_questions.output.confirmations | length }} addressed
      thread{{ 's' if (build_followup_questions.output.confirmations | length) != 1 else '' }} and resolves {{ 'it' if (build_followup_questions.output.confirmations | length) == 1 else 'them' }}.
      {% endif %}
      {% if prior_review.output.thread_error %}
      > Review threads could not be read ({{ prior_review.output.thread_error }}), so no earlier comment can be confirmed, resolved or reopened on this run.
      {% endif %}

      ---

      Approving posts a short LGTM with thanks tailored to this contribution, which
      on a pull request with open points says you have decided they can ship
      without them.

      {% if workflow.input.merge %}
      After approval is posted, a separate gate shows current merge readiness
      and asks whether to squash-merge. Approval alone never merges.
      {% else %}
      Merging is disabled for this run; approval is followed by cleanup and completion.
      {% endif %}

      Posting the findings raises exactly the points you kept, worded as a
      follow-up rather than as a first review, with inline comments wherever
      the diff allows.
    options:
      - label: Approve with a personal thank-you
        value: approve
        route: confirm_threads_approve
      - label: Post the points you kept as a review
        value: comment
        route: followup_comment_writer
      - label: Post nothing
        value: stop
        route: cleanup

