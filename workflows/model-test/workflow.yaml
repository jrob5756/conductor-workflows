parallel:
  - name: probe_all
    description: Probe all candidate models concurrently; record per-model success/failure.
    failure_mode: continue_on_error
    agents:
      - probe_auto
      - probe_claude_opus_5
      - probe_claude_sonnet_5
      - probe_claude_opus_4_8
      - probe_claude_opus_4_7
      - probe_claude_opus_4_6
      - probe_claude_sonnet_4_6
      - probe_claude_sonnet_4_5
      - probe_claude_haiku_4_5
      - probe_gpt_5_6_sol
      - probe_gpt_5_6_terra
      - probe_gpt_5_6_luna
      - probe_gpt_5_5
      - probe_gpt_5_4
      - probe_gpt_5_3_codex
      - probe_gpt_5_4_mini
      - probe_gpt_5_mini
      - probe_gemini_3_1_pro_preview
      - probe_gemini_3_5_flash
      - probe_gemini_3_6_flash
      - probe_grok_4_5
      - probe_mai_code_1_flash_picker
    routes:
      - to: $end

output:
  results: |
    {% set probes = [
      'probe_auto',
      'probe_claude_opus_5',
      'probe_claude_sonnet_5',
      'probe_claude_opus_4_8',
      'probe_claude_opus_4_7',
      'probe_claude_opus_4_6',
      'probe_claude_sonnet_4_6',
      'probe_claude_sonnet_4_5',
      'probe_claude_haiku_4_5',
      'probe_gpt_5_6_sol',
      'probe_gpt_5_6_terra',
      'probe_gpt_5_6_luna',
      'probe_gpt_5_5',
      'probe_gpt_5_4',
      'probe_gpt_5_3_codex',
      'probe_gpt_5_4_mini',
      'probe_gpt_5_mini',
      'probe_gemini_3_1_pro_preview',
      'probe_gemini_3_5_flash',
      'probe_gemini_3_6_flash',
      'probe_grok_4_5',
      'probe_mai_code_1_flash_picker'
    ] %}
    {% for name in probes -%}
    {% if name in probe_all.outputs -%}
    PASS  {{ name }} -> {{ probe_all.outputs[name].reply | default('(no reply)') }}
    {% else -%}
    FAIL  {{ name }} -> {{ probe_all.errors[name].message | default('(unknown error)') }}
    {% endif -%}
    {%- endfor %}
