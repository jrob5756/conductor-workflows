# Model Availability Probe
#
# Pings every Copilot model id in parallel with a trivial arithmetic question to
# confirm the SDK actually accepts it end-to-end.
#
# `conductor doctor --models -p copilot` is the authoritative list of ids; this
# workflow is the empirical check that each one really runs — an id can be
# advertised and still fail at session.create.
#
# Keep the model list below in sync with `conductor doctor --models -p copilot`.
#
# Known result as of the last run: 21/22 pass. `gpt-5.6-luna` consistently
# returns a dict where a string was declared, which is a structured-output
# quirk of that model rather than an availability problem.
#
# The probe deliberately asks a real question and requests a full sentence,
# rather than demanding a magic token. Two failure modes motivated this:
# instruction-following models can read "reply with exactly the word OK" as a
# compliance test and refuse outright, and a bare "4" sometimes gets extracted
# as a dict or dropped entirely. Both surface as false negatives that look like
# the model is unavailable when it is not.
#
# Usage:
#   conductor run workflows/model-test/workflow.yaml

workflow:
  name: model-test
  description: Pings every candidate Copilot model in parallel with a trivial prompt to see which ids the SDK accepts.
  entry_point: probe_all
  version: 0.2.0
  runtime:
    provider: copilot
    timeout: 60
    max_session_seconds: 60
  limits:
    max_iterations: 50
    timeout_seconds: 300

agents:
  - name: probe_auto
    model: auto
    system_prompt: "You are a connectivity probe. Answer in as few words as possible."
    prompt: "What is 2 + 2? Answer in one short sentence."
    output:
      reply: { type: string }
